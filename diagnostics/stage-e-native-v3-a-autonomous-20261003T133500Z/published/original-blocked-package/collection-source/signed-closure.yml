name: Native-v3 A signed allocation closure (PAPER ONLY)
on:
  create:
permissions:
  contents: read
jobs:
  signed-preflight:
    if: github.event.ref_type == 'branch' && github.event.ref == 'preflight/native-v3-a-signed-closure-20261003T121620Z'
    runs-on: [self-hosted, linux, x64, meme-machine-stage-e-observer]
    timeout-minutes: 25
    steps:
      - name: Read immutable approved executable
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f480c6b4f7a8442fd148c7ed61bcc4447edaefca
          path: native-v3-approved-signed-closure-20261003T121620Z
          fetch-depth: 0
          persist-credentials: false
      - name: Read separate collection-only controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: native-v3-signed-closure-20261003T121620Z
          fetch-depth: 1
          persist-credentials: false
      - name: Fresh complete environment and process binding
        id: binding
        shell: sh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          MM_APPROVED_REPOSITORY: ${{ github.workspace }}/native-v3-approved-signed-closure-20261003T121620Z
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          record=json.loads(Path('/mnt/volume_nyc1_1790918115030/meme-machine-observer-v2-7a516a6a/fresh-environment.json').read_bytes())
          executable=record['python_executable']
          if hashlib.sha256(Path(executable).read_bytes()).hexdigest()!=record['python_executable_hash']:
              raise SystemExit('preserved_Python_executable_changed')
          script=Path(os.environ['GITHUB_WORKSPACE'])/'native-v3-signed-closure-20261003T121620Z/diagnostics/stage-e-native-v3-a-closure-20261003T121620Z/complete_preflight.py'
          os.execv(executable,[executable,'-I','-B',str(script),'prepare'])
          PY
      - name: Preserve fresh unsigned allocation facts before controller signing
        if: always() && steps.binding.outputs.evidence_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-v3-a-closure-allocation-20261003T121620Z-${{ github.run_id }}-1
          path: ${{ steps.binding.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Independently verify signed allocation and complete remaining preflight
        id: complete
        if: steps.binding.outcome == 'success'
        shell: sh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          MM_APPROVED_REPOSITORY: ${{ github.workspace }}/native-v3-approved-signed-closure-20261003T121620Z
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          record=json.loads(Path('/mnt/volume_nyc1_1790918115030/meme-machine-observer-v2-7a516a6a/fresh-environment.json').read_bytes())
          executable=record['python_executable']
          if hashlib.sha256(Path(executable).read_bytes()).hexdigest()!=record['python_executable_hash']:
              raise SystemExit('preserved_Python_executable_changed')
          script=Path(os.environ['GITHUB_WORKSPACE'])/'native-v3-signed-closure-20261003T121620Z/diagnostics/stage-e-native-v3-a-closure-20261003T121620Z/complete_preflight.py'
          os.execv(executable,[executable,'-I','-B',str(script),'complete'])
          PY
      - name: Preserve final closure record including any exact blocker
        if: always() && steps.binding.outputs.evidence_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-v3-a-closure-final-20261003T121620Z-${{ github.run_id }}-1
          path: ${{ steps.binding.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 90
          overwrite: false
