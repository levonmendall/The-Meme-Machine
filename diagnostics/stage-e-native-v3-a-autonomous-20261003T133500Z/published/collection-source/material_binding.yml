name: Stage-E Native V3-A admission on frozen harness (PAPER ONLY)
on:
  create:
  workflow_dispatch:
    inputs:
      execution_class:
        type: choice
        options: [A]
        required: true
permissions:
  contents: read
jobs:
  register:
    if: github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref == 'preflight/native-v3-a-autonomous-admission-20261003T133500Z'
    runs-on: [self-hosted, linux, x64, meme-machine-stage-e-observer]
    timeout-minutes: 5
    steps:
      - name: Register exact workflow identity without workload or reservation
        run: /usr/bin/python3 -I -B -c 'import json,os; print(json.dumps({k:os.environ.get(k) for k in ("GITHUB_EVENT_NAME","GITHUB_RUN_ID","GITHUB_SHA","RUNNER_NAME")}))'
  admission:
    if: github.event_name == 'workflow_dispatch' && inputs.execution_class == 'A' && github.run_attempt == 1 && github.ref == 'refs/heads/preflight/native-v3-a-autonomous-admission-20261003T133500Z'
    runs-on: [self-hosted, linux, x64, meme-machine-stage-e-observer]
    timeout-minutes: 30
    steps:
      - name: Read immutable frozen approved harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f480c6b4f7a8442fd148c7ed61bcc4447edaefca
          path: native-v3-approved-autonomous-admission
          fetch-depth: 0
          persist-credentials: false
      - name: Read separate admission collector and fixed workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: native-v3-autonomous-admission
          persist-credentials: false
      - name: Refresh complete process and resource facts for allocation
        id: binding
        shell: sh
        env:
          MM_APPROVED_REPOSITORY: ${{ github.workspace }}/native-v3-approved-autonomous-admission
          PYTHONDONTWRITEBYTECODE: '1'
        run: exec /workspace/stage-e-runtime/bin/python -I -B native-v3-autonomous-admission/diagnostics/stage-e-native-v3-a-autonomous-20261003T133500Z/complete_preflight.py prepare
      - name: Preserve fresh unsigned allocation for independent controller review
        if: always() && steps.binding.outputs.evidence_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-v3-autonomous-allocation-${{ github.run_id }}-1
          path: ${{ steps.binding.outputs.evidence_path }}
          retention-days: 90
          overwrite: false
          if-no-files-found: error
      - name: Reverify signed allocation and complete every remaining admission check
        if: steps.binding.outcome == 'success'
        id: complete
        shell: sh
        env:
          MM_APPROVED_REPOSITORY: ${{ github.workspace }}/native-v3-approved-autonomous-admission
          PYTHONDONTWRITEBYTECODE: '1'
        run: exec /workspace/stage-e-runtime/bin/python -I -B native-v3-autonomous-admission/diagnostics/stage-e-native-v3-a-autonomous-20261003T133500Z/complete_preflight.py complete
      - name: Preserve complete admission result and any exact cryptographic blocker
        if: always() && steps.binding.outputs.evidence_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-v3-autonomous-admission-${{ github.run_id }}-1
          path: ${{ steps.binding.outputs.evidence_path }}
          retention-days: 90
          overwrite: false
          if-no-files-found: error
