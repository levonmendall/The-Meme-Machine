# Existing service; install only after authenticated selected protection passes.
# Replace validation-observation.conf or paper-bootstrap.conf coherently.
# This source profile does not start/enable a service or initialize capital.
[Service]
EnvironmentFile=
EnvironmentFile=/etc/meme-machine/paper.shared-1000.env
Environment=MM_PAPER_ENV_FILE=/etc/meme-machine/paper.shared-1000.env
Environment=MM_PROVIDER_OPERATION_MODE=CONTINUOUS
Environment=MM_VOLUME_QUALITY_ENABLED=1
Environment=MM_PONS_USD_ACQUISITION_OVERLAP=1
Environment=MM_PONS_USD_BRIDGE_ROUTES=verified_two_hop_v1
Environment=MM_PROVIDER_USAGE_DB=/mnt/volume_nyc1_1790918115030/meme-machine-paper-shared-1000/shared/provider-usage.continuous.sqlite
Environment=MM_CONTINUOUS_PROVIDER_ENVELOPE=/etc/meme-machine/paper-continuous.pump-first.json
# Clear these in the environment file too: EnvironmentFile overrides Environment.
UnsetEnvironment=MM_BOUNDED_PROVIDER_DB MM_BOUNDED_PROVIDER_ENVELOPE MM_POSITION_CONTINUATION_ENVELOPE
ExecStart=
ExecStart=/opt/meme-machine/.venv/bin/python -m meme_machine.operational normal
Restart=on-failure
RestartSec=5s
RuntimeMaxSec=infinity
TimeoutStopSec=65s
KillMode=control-group
CPUQuota=180%
MemoryHigh=6G
MemoryMax=7G
