# Install only for the separately authorized FIRST_POSITION_BOOTSTRAP.
# Remove before the ordinary CAPACITY -> RECOVERY -> AUTONOMY workflow.
# This file is prepared source; it does not activate or install itself.
[Service]
ExecStart=
ExecStart=/opt/meme-machine/.venv/bin/python -m meme_machine.operational bootstrap
# The existing supervisor owns native positions through all lifecycle phases.
# Its durable admission/resource clocks survive a normal service restart.
Restart=on-failure
RuntimeMaxSec=264000s
TimeoutStopSec=65s
KillMode=control-group
CPUQuota=180%
MemoryHigh=6G
MemoryMax=7G
Environment=MM_POSITION_CONTINUATION_ENVELOPE=/etc/meme-machine/position-continuation.json
