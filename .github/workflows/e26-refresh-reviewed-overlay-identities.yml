name: E26 refresh reviewed overlay identities
on:
  push:
    branches: [recovery/stagee25-github-native-publication-20260928]
    paths:
      - '.github/stagee26/refresh-trigger.txt'
permissions:
  contents: write
concurrency:
  group: e26-refresh-reviewed-overlay-identities
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 48fee7b1aab5597c2d39ccab711853c637332da8
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify exact pre-refresh candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 48fee7b1aab5597c2d39ccab711853c637332da8
          test "$(git status --porcelain)" = ""
      - name: Prepare reviewed baseline integration
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/reviewed-base" 23f06ed84e5b5e2d4efd074618ab44ae7ed58011
          (cd "$RUNNER_TEMP/reviewed-base" && python -m certification.run prepare --worktrees "$RUNNER_TEMP/baseline-worktrees")
      - name: Prepare current candidate integration
        run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/current-worktrees"
      - name: Refresh only reviewed source identities
        run: |
          set -euo pipefail
          python -m certification.build_consistency refresh             --worktrees "$RUNNER_TEMP/current-worktrees"             --baseline-worktrees "$RUNNER_TEMP/baseline-worktrees"             --output "$RUNNER_TEMP/refresh.json"
          git diff -- certification/sources.json certification/profitability_protocol.json
          test -z "$(git diff --name-only | grep -vE '^(certification/sources.json|certification/profitability_protocol.json)$' || true)"
      - name: Commit refreshed identities to E26 branch
        run: |
          set -euo pipefail
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git add certification/sources.json certification/profitability_protocol.json
          git diff --cached --quiet && { echo "no identity refresh produced"; exit 1; }
          git commit -m "Refresh E26 prepared-lane overlay identities"
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/repair/stagee26-eligible-hot-measurement-20260928
          echo "NEW_SHA=$NEW_SHA" >> "$GITHUB_ENV"
          echo "$NEW_SHA" > "$RUNNER_TEMP/new-sha.txt"
      - name: Verify refreshed exact source
        run: |
          rm -rf "$RUNNER_TEMP/verify-worktrees"
          python -m certification.run prepare --worktrees "$RUNNER_TEMP/verify-worktrees"
          python -m certification.build_consistency verify             --worktrees "$RUNNER_TEMP/verify-worktrees"             --expected-sha "$NEW_SHA"             --output "$RUNNER_TEMP/post-refresh-verify.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e26-overlay-identity-refresh-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/refresh.json
            ${{ runner.temp }}/post-refresh-verify.json
            ${{ runner.temp }}/new-sha.txt
          if-no-files-found: warn
          retention-days: 90
