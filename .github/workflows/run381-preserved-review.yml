name: Run 381 archive scheduling pressure verification
on:
  push:
    branches: [analysis/run381-preserved-evidence-20260927]
permissions:
  contents: read
jobs:
  pressure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [old, repaired]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.txt
      - name: Verify fair scheduling and durable archive retry
        env:
          PROFILE_RUNTIME: ${{ matrix.runtime }}
        run: |
          mkdir -p pressure-output
          set -o pipefail
          if [ "$PROFILE_RUNTIME" = old ]; then
            git show 3d4be5c538fdde44b37c159c5c5dad9200a5039e:meme_machine/solana_evidence_service.py > meme_machine/solana_evidence_service.py
            git show 3d4be5c538fdde44b37c159c5c5dad9200a5039e:meme_machine/solana_evidence_control.py > meme_machine/solana_evidence_control.py
            for test in ArchiveSchedulingTests.test_new_source_commits_cannot_overtake_completed_archive_and_cleanup ArchiveReceiptRetryTests.test_cooperative_commit_yield_reuses_already_published_archive ArchiveReceiptRetryTests.test_yield_after_durable_commit_retries_idempotently; do
              python -m certification.run381_expected_failure "tests.test_run381_archive_scheduling.$test" 2>&1 | tee -a pressure-output/regression-before.log
            done
          else
            python -m unittest tests.test_run381_archive_scheduling tests.test_run379_control_pressure certification.tests.test_run381_contention_profile tests.test_run381_subscription_progress tests.test_run381_archive_canonical tests.test_run381_retention_progress tests.test_run381_repair_pagination tests.test_run381_maintenance_overlap -q 2>&1 | tee pressure-output/regression-after.log
          fi
      - name: Full source-clock replay at measured failed-certificate timing floors
        if: matrix.runtime == 'repaired'
        env:
          PROFILE_RUNTIME: ${{ matrix.runtime }}
        run: |
          status=0
          python -m certification.run381_pressure --measured-contention --output pressure-output > pressure-output/pressure.jsonl 2>&1 || status=$?
          PROFILE_EXIT="$status" python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('pressure-output/result.json').read_text())
          assert r['measured_contention']['profile']=='run381-fullcert-36293751021'
          if os.environ['PROFILE_RUNTIME']=='old':
              assert os.environ['PROFILE_EXIT']=='1' and r['passed'] is False
              assert r['failure'] in ('AssertionError:archive_clock_fell_behind','AssertionError:retention_clock_fell_behind'),r['failure']
              assert r['counters']['stream_accepted_messages']>1000
          else:
              assert os.environ['PROFILE_EXIT']=='0' and r['passed'] is True
          PY
      - name: Publish bounded causal result
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path=Path('pressure-output/result.json')
          if path.exists():
              raw=path.read_bytes();assert len(raw)<=128*1024
              print('PRESSURE_RESULT_SHA256',hashlib.sha256(raw).hexdigest())
              print('PRESSURE_RESULT',raw.decode())
          else:
              log=Path('pressure-output/pressure.jsonl')
              if log.exists():print('PRESSURE_FAILURE_LOG',log.read_text()[-8000:])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: run381-archive-scheduling-${{ matrix.runtime }}
          path: pressure-output/
          retention-days: 90
          if-no-files-found: error
