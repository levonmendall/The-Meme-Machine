name: Run 381 source-clock pressure comparison
on:
  push:
    branches: [analysis/run381-preserved-evidence-20260927]
permissions:
  contents: read
jobs:
  pressure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [repaired]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.txt
      - name: Select preserved or repaired source
        env:
          PROFILE_RUNTIME: ${{ matrix.runtime }}
        run: |
          if [ "$PROFILE_RUNTIME" = old ]; then
            git show 510872d8cc5d2fde2ae7ef412b5b31e5e4c1cfbf:meme_machine/solana_evidence_plane.py > meme_machine/solana_evidence_plane.py
            git show 510872d8cc5d2fde2ae7ef412b5b31e5e4c1cfbf:meme_machine/solana_evidence_service.py > meme_machine/solana_evidence_service.py
            git show 510872d8cc5d2fde2ae7ef412b5b31e5e4c1cfbf:meme_machine/solana_evidence_storage.py > meme_machine/solana_evidence_storage.py
            git show 510872d8cc5d2fde2ae7ef412b5b31e5e4c1cfbf:meme_machine/solana_evidence_control.py > meme_machine/solana_evidence_control.py
          fi
      - name: Reproduce old scope starvation and verify bounded repair
        run: |
          git show 76fb6e6b8d337b540ecac3eacdc91d6e673c5e35:meme_machine/solana_evidence_plane.py > meme_machine/solana_evidence_plane.py
          if python -m unittest tests.test_run381_retention_progress.RetentionProgressTests.test_recurring_urgent_work_cannot_starve_later_retention_scopes; then
            echo "Old implementation did not reproduce the required regression"
            exit 1
          fi
          git restore --source=HEAD -- meme_machine/solana_evidence_plane.py
          python -m unittest tests.test_run381_retention_progress tests.test_run381_repair_pagination -q
      - name: Reconstructed production pressure without provider credentials
        env:
          PRESSURE_FRAMES: '2223'
        run: |
          mkdir -p pressure-output
          python -m certification.run381_pressure --frames "$PRESSURE_FRAMES" --output pressure-output > pressure-output/pressure.jsonl 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: run381-mature-pressure-${{ matrix.runtime }}
          path: pressure-output/
          retention-days: 90
          if-no-files-found: error
