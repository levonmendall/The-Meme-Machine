name: Run 381 bounded offline pressure artifact review
on:
  push:
    branches: [analysis/run381-preserved-evidence-20260927]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read digest-verified offline result
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,io,json,os,time,urllib.request,urllib.error,zipfile
          repo='levonmendall/The-Meme-Machine'
          run_id=36287585070
          expected_sha='76fb6e6b8d337b540ecac3eacdc91d6e673c5e35'
          base='https://api.github.com/repos/'+repo
          def api(path):
           req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
           with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          run=api('/actions/runs/'+str(run_id))
          assert run['head_sha']==expected_sha
          for attempt in range(36):
           rows=api('/actions/runs/'+str(run_id)+'/artifacts')['artifacts']
           matches=[a for a in rows if a['name']=='run381-mature-pressure-repaired' and not a['expired']]
           if matches:break
           time.sleep(10)
          else:raise RuntimeError('preserved_pressure_artifact_unavailable')
          assert len(matches)==1
          a=matches[0]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs):return None
          request=urllib.request.Request(a['archive_download_url'],headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN']})
          try:
           with urllib.request.build_opener(NoRedirect()).open(request,timeout=30) as response:raw=response.read(1024*1024+1)
          except urllib.error.HTTPError as exc:
           if exc.code not in (301,302,303,307,308):raise
           url=exc.headers['Location']
           assert url.startswith('https://')
           with urllib.request.urlopen(url,timeout=30) as response:raw=response.read(1024*1024+1)
          assert len(raw)<=1024*1024
          actual=hashlib.sha256(raw).hexdigest()
          assert a['digest']=='sha256:'+actual
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
           info=archive.getinfo('result.json');assert info.file_size<=128*1024
           result=json.loads(archive.read(info))
           print('PRESSURE_ARTIFACT',json.dumps(dict(id=a['id'],sha256=actual,run_id=run_id,sha=expected_sha)))
           print('PRESSURE_RESULT',json.dumps(result,sort_keys=True))
           info=archive.getinfo('pressure.jsonl');assert info.file_size<=256*1024
           for line in archive.read(info).decode().splitlines():
            if line.startswith('{'):
             row=json.loads(line)
             if 'elapsed' in row and 'passed' not in row:print('PRESSURE_TIMELINE',json.dumps(row,sort_keys=True))
          PY
