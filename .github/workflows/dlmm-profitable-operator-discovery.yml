name: dlmm-profitable-operator-discovery
on:
  push:
    branches:
      - research/dlmm-profitable-operator-discovery
permissions:
  contents: read

jobs:
  census:
    if: contains(github.event.head_commit.message, '[dlmm-operator-census]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: dlmm-profitable-operator-census
      cancel-in-progress: true
    env:
      MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Profitable-operator regression gate
        run: python -m unittest tests.test_dlmm_profitable_operator_discovery -v
      - name: Validate direct Alchemy DLMM topology
        run: python -m tests.dlmm_alchemy_provider
      - name: Census every observable eligible SOL-paired DLMM pool without PnL reads
        run: python -m tests.dlmm_profitable_operator_discovery census
      - name: Preserve census and resumable pool checkpoint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-profitable-operator-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dlmm-profitable-operator-census.json
            dlmm-profitable-operator-census-checkpoint.json
          if-no-files-found: warn
          retention-days: 90


  freeze:
    if: contains(github.event.head_commit.message, '[dlmm-operator-freeze]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/dlmm-profitable-operator-discovery
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Download exact successful pre-PnL census artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10578350403/zip > /tmp/dlmm-operator-census.zip
          mkdir -p /tmp/dlmm-operator-census
          unzip -q /tmp/dlmm-operator-census.zip -d /tmp/dlmm-operator-census
      - name: Freeze all 200 census wallets without PnL filtering
        run: python -m tests.dlmm_profitable_operator_freeze /tmp/dlmm-operator-census/dlmm-profitable-operator-census.json
      - name: Verify frozen cohort boundary
        run: |
          python - <<'PY'
          import json
          p='DLMM_PROFITABLE_OPERATOR_COHORT_V1.json'
          x=json.load(open(p))
          assert x['kind']=='dlmm_profitable_operator_cohort_v1'
          assert x['status']=='frozen_pre_pnl'
          assert x['pnl_data_read_before_freeze'] is False
          assert x['source_wallet_count']==200
          assert len(x['wallets'])==200
          assert len({w['wallet'] for w in x['wallets']})==200
          print({'cohort_hash':x['cohort_hash'],'wallets':len(x['wallets'])})
          PY
      - name: Commit exact frozen cohort
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DLMM_PROFITABLE_OPERATOR_COHORT_V1.json
          git commit -m "Freeze 200-wallet profitable-operator cohort pre-PnL"
          git push origin HEAD:research/dlmm-profitable-operator-discovery

  # Frozen 200-wallet cohort: fd1201139ca6d9e08e202a68024706fe186d794d
  rank:
    if: contains(github.event.head_commit.message, '[dlmm-operator-rank]')
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    concurrency:
      group: dlmm-profitable-operator-rank
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    env:
      DLMM_OPERATOR_METEORA_WORKERS: '12'
      MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Profitable-operator regression gate
        run: python -m unittest tests.test_dlmm_profitable_operator_discovery -v
      - name: Restore latest compatible wallet checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f dlmm-profitable-operator-ranking-checkpoint.json
          mapfile -t artifact_ids < <(
            gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false and (.name | startswith("dlmm-profitable-operator-ranking-"))) | [.created_at, (.id|tostring)] | @tsv' \
              | sort -r | cut -f2
          )
          restored=0
          for artifact_id in "${artifact_ids[@]}"; do
            rm -rf /tmp/dlmm-rank-restore
            mkdir -p /tmp/dlmm-rank-restore
            if ! gh api "repos/${{ github.repository }}/actions/artifacts/${artifact_id}/zip" > /tmp/dlmm-rank-restore.zip; then
              continue
            fi
            if ! unzip -q /tmp/dlmm-rank-restore.zip -d /tmp/dlmm-rank-restore; then
              continue
            fi
            candidate="$(find /tmp/dlmm-rank-restore -name dlmm-profitable-operator-ranking-checkpoint.json -type f -print -quit)"
            if [ -z "$candidate" ]; then
              continue
            fi
            cp "$candidate" dlmm-profitable-operator-ranking-checkpoint.candidate.json
            if python -m tests.dlmm_profitable_operator_discovery check-rank-checkpoint \
                --cohort DLMM_PROFITABLE_OPERATOR_COHORT_V1.json \
                --checkpoint dlmm-profitable-operator-ranking-checkpoint.candidate.json; then
              mv dlmm-profitable-operator-ranking-checkpoint.candidate.json \
                 dlmm-profitable-operator-ranking-checkpoint.json
              echo "Restored compatible rank checkpoint from artifact ${artifact_id}"
              restored=1
              break
            fi
            rm -f dlmm-profitable-operator-ranking-checkpoint.candidate.json
          done
          echo "DLMM_OPERATOR_CHECKPOINT_RESTORED=${restored}" >> "$GITHUB_ENV"
          if [ "$restored" -eq 0 ]; then
            echo "No compatible prior rank checkpoint found; starting from frozen cohort."
          fi
      - name: Rank only committed frozen operator cohort
        timeout-minutes: 240
        run: python -m tests.dlmm_profitable_operator_discovery rank --cohort DLMM_PROFITABLE_OPERATOR_COHORT_V1.json
      - name: Deep reconstruct every eligible operator with authenticated Solana evidence
        run: python -m tests.dlmm_profitable_operator_deep --ranking dlmm-profitable-operator-ranking.json
      - name: Derive only preregistered cross-operator rule proposals
        run: python -m tests.dlmm_profitable_operator_rules --deep dlmm-profitable-operator-deep-reconstruction.json
      - name: Preserve ranking, deep reconstruction, rule proposals and checkpoints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-profitable-operator-ranking-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dlmm-profitable-operator-ranking.json
            dlmm-profitable-operator-ranking-checkpoint.json
            dlmm-profitable-operator-deep-reconstruction.json
            dlmm-profitable-operator-deep-checkpoint.json
            dlmm-profitable-operator-rule-proposals.json
          if-no-files-found: warn
          retention-days: 90
