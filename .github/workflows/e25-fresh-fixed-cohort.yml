name: E25 fresh fixed cohort
on:
  push:
    branches: [recovery/stagee25-github-native-publication-20260928]
    paths:
      - '.github/stagee25/cohort-trigger.txt'
permissions:
  contents: read
  actions: read
concurrency:
  group: e25-fresh-fixed-cohort
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: acfa2d8063240ead4dc6d5663f17fa3ae0d75d9b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = acfa2d8063240ead4dc6d5663f17fa3ae0d75d9b
          test "$(git rev-parse HEAD^{tree})" = 7156eca779727de652336e728e797d0429b0d395
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check 'websockets==17.1'
          mkdir -p "$RUNNER_TEMP/env"
          python -m certification.qualification_environment --output "$RUNNER_TEMP/env/environment.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e25-cohort-environment-${{ github.run_id }}
          path: ${{ runner.temp }}/env/environment.json
          if-no-files-found: error
          retention-days: 90

  fixed-trial:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        trial: [combined-1, combined-2, combined-3, recovery-1]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: acfa2d8063240ead4dc6d5663f17fa3ae0d75d9b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Frozen identity and dependency preflight
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = acfa2d8063240ead4dc6d5663f17fa3ae0d75d9b
          test "$(git rev-parse HEAD^{tree})" = 7156eca779727de652336e728e797d0429b0d395
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check 'websockets==17.1'
          python -m certification.qualification_environment --output "$RUNNER_TEMP/environment-${{ matrix.trial }}.json"
      - name: Run exactly one predetermined fixed trial
        timeout-minutes: 35
        run: |
          python -m certification.maintenance_qualification             --trial "${{ matrix.trial }}"             --output "$RUNNER_TEMP/${{ matrix.trial }}"
      - name: Preserve original fixed-trial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e25-fixed-trial-${{ matrix.trial }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/${{ matrix.trial }}/
            ${{ runner.temp }}/environment-${{ matrix.trial }}.json
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    needs: [preflight, fixed-trial]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: acfa2d8063240ead4dc6d5663f17fa3ae0d75d9b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check 'websockets==17.1'
      - name: Recover same-run raw environment and all four original trial artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          from certification.autonomous_control import _artifact_metadata
          from certification.autonomous_window import extract_artifact
          from certification.prospective_program import GitHub
          api=GitHub(); run_id=int(os.environ['GITHUB_RUN_ID'])
          root=Path(os.environ['RUNNER_TEMP'])/'cohort'; root.mkdir()
          env_ref=_artifact_metadata(api,run_id,f'e25-cohort-environment-{run_id}')
          env_src=extract_artifact(api,env_ref,Path(os.environ['RUNNER_TEMP'])/'env-download')
          matches=list(env_src.rglob('environment.json'))
          if len(matches)!=1: raise ValueError('cohort_environment_missing_or_duplicate')
          shutil.copy2(matches[0],root/'environment.json')
          for trial in ('combined-1','combined-2','combined-3','recovery-1'):
              ref=_artifact_metadata(api,run_id,f'e25-fixed-trial-{trial}-{run_id}')
              src=extract_artifact(api,ref,Path(os.environ['RUNNER_TEMP'])/('download-'+trial))
              candidates=list(src.rglob('trial.json'))
              if len(candidates)!=1: raise ValueError('trial_metadata_missing_or_duplicate:'+trial)
              shutil.copytree(candidates[0].parent,root/trial)
          PY
      - name: Recompute cohort acceptance from original evidence
        run: |
          python -m certification.maintenance_qualification             --aggregate "$RUNNER_TEMP/cohort"             --expected-sha acfa2d8063240ead4dc6d5663f17fa3ae0d75d9b             --output "$RUNNER_TEMP/cohort/aggregate.json"
      - name: Preserve complete fresh cohort
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e25-fixed-cohort-acfa2d8063240ead4dc6d5663f17fa3ae0d75d9b-${{ github.run_id }}
          path: ${{ runner.temp }}/cohort/
          if-no-files-found: error
          retention-days: 90
