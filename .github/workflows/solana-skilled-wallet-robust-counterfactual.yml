name: solana-skilled-wallet-robust-counterfactual
on:
  push:
    branches: [research/solana-skilled-wallet-alpha]
permissions: {contents: read}
jobs:
  study:
    if: contains(github.event.head_commit.message, '[robust-wallet-alpha]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - run: python -m pip install --disable-pip-version-check requests zstandard
      - name: Run multi-control robust skilled-wallet counterfactual
        run: set -o pipefail; python -m tests.solana_skilled_wallet_robust_counterfactual | tee solana-skilled-wallet-robust-counterfactual.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: solana-skilled-wallet-robust-counterfactual-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            solana-skilled-wallet-robust-counterfactual.json
            solana-skilled-wallet-robust-counterfactual.log
          if-no-files-found: warn
          retention-days: 30
