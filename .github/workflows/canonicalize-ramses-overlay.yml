name: canonicalize-ramses-overlay
on:
  push:
    branches: [cert/dlmm-machinery-proof-current]
permissions:
  contents: write
jobs:
  canonicalize:
    if: contains(github.event.head_commit.message, '[canonicalize-ramses-overlay]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Regenerate canonical Ramses overlay
        run: |
          RAMSES_SHA="$(python -c 'import json; print(json.load(open("certification/sources.json"))["lanes"]["ramses"]["source_sha"])')"
          WORKTREE="$(mktemp -d)/ramses"
          git fetch origin "$RAMSES_SHA"
          git worktree add --detach "$WORKTREE" "$RAMSES_SHA"
          git -C "$WORKTREE" apply --check "$GITHUB_WORKSPACE/certification/patches/ramses-admission.patch"
          git -C "$WORKTREE" apply --index "$GITHUB_WORKSPACE/certification/patches/ramses-admission.patch"
          git -C "$WORKTREE" diff --binary HEAD > "$GITHUB_WORKSPACE/certification/patches/ramses-admission.patch"
          git diff --check -- certification/patches/ramses-admission.patch
          if git diff --quiet -- certification/patches/ramses-admission.patch; then
            echo "Ramses overlay already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certification/patches/ramses-admission.patch
          git commit -m "[qualification-build] canonicalize Ramses lifecycle repair"
          git push origin HEAD:cert/dlmm-machinery-proof-current
