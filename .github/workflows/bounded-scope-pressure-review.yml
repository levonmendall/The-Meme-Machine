name: Bounded all-scope progress then unchanged pressure
on:
  push:
    branches: [review/stagee19-all-scopes-pressure-20260928]
permissions:
  contents: read
jobs:
  prove-and-pressure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runtime
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: verification
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d3fd7303d214e6fa74a4b1aad46fc648c870bced
          path: runtime
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Assert exact runtime and unchanged canonical gate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d3fd7303d214e6fa74a4b1aad46fc648c870bced
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          git diff --exit-code 661d4e10daefac7e80d9252f14b2cf9f5c1acdad HEAD -- certification/run381_pressure.py certification/pressure_diagnostics.py tests/test_run380_production_pressure.py tests/test_run373_dispatch_throughput.py .github/workflows/non-market-certification.yml .github/workflows/directional-six-regime-nonmarket.yml
          git rev-parse HEAD > "$GITHUB_WORKSPACE/evidence/runtime-sha.txt"
          sha256sum certification/run381_pressure.py certification/pressure_diagnostics.py tests/test_run380_production_pressure.py tests/test_run373_dispatch_throughput.py > "$GITHUB_WORKSPACE/evidence/unchanged-pressure-files.sha256"
          git worktree add --detach "$RUNNER_TEMP/failed-scope-base" 661d4e10daefac7e80d9252f14b2cf9f5c1acdad
      - run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/non-market-lanes"
      - name: Reproduce baseline starvation in actual SQLite and owner
        run: |
          python "$GITHUB_WORKSPACE/verification/certification/bounded_scope_progress_check.py" --source "$RUNNER_TEMP/failed-scope-base" --output "$GITHUB_WORKSPACE/evidence/baseline-progress.json" --expect-starvation > "$GITHUB_WORKSPACE/evidence/baseline-progress.log" 2>&1
      - name: Prove bounded progress for all scopes with restart pins and mixed pressure
        run: |
          python "$GITHUB_WORKSPACE/verification/certification/bounded_scope_progress_check.py" --source "$GITHUB_WORKSPACE/runtime" --output "$GITHUB_WORKSPACE/evidence/repaired-progress.json" > "$GITHUB_WORKSPACE/evidence/repaired-progress.log" 2>&1
      - name: Existing maintenance and preservation regressions
        run: |
          python -m unittest -v tests.test_run373_dispatch_throughput.Run373DispatchThroughputTests.test_run375_commit_batching_amortizes_full_sync_without_relaxing_bounds tests.test_run373_dispatch_throughput.Run373DispatchThroughputTests.test_stagee19_maintenance_pressure_limits_source_batches_to_one_frame tests.test_run381_retention_progress tests.test_run381_maintenance_overlap tests.test_run381_archive_scheduling > "$GITHUB_WORKSPACE/evidence/maintenance-regressions.log" 2>&1
      - name: Ten-minute mature Solana retention and source-clock pressure
        timeout-minutes: 13
        run: |
          mkdir -p "$GITHUB_WORKSPACE/evidence/run381-pressure"
          python -m certification.run381_pressure --measured-contention --output "$GITHUB_WORKSPACE/evidence/run381-pressure" > "$GITHUB_WORKSPACE/evidence/run381-pressure/run.log" 2>&1
      - name: Recheck source immutability
        if: always()
        run: |
          git diff --exit-code HEAD
          test "$(git rev-parse HEAD)" = d3fd7303d214e6fa74a4b1aad46fc648c870bced
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bounded-scope-pressure-d3fd7303-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
