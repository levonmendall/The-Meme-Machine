name: provider-shape-probe
on:
  push:
    branches: [cert/all-market-certification-20260923]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-log-range:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[provider-shape-probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/shape-lanes"
      - name: Probe existing official-public endpoint without credentials or trades
        run: python -m certification.provider_shape_probe --worktrees "$RUNNER_TEMP/shape-lanes" --output provider-shape-evidence
      - name: Preserve every provider outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-shape-${{ github.run_id }}
          path: provider-shape-evidence/
          if-no-files-found: error
          retention-days: 90
