name: Publish exact ce42573 Git object only
on:
  push:
    branches: [recovery/publish-exact-ce42573-20260929]
    paths: ['.github/workflows/publish-exact-ce42573.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: exact-ce42573-publication-only
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: control
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: runtime
          ref: 872360077cd36c415aff97a4c8d0e57a947c0875
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r runtime/requirements.txt
      - name: Restore and publish exact original object; no qualification or promotion
        working-directory: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os,subprocess,urllib.request,urllib.error
          from pathlib import Path
          SHA='ce4257309cb1f6ec68e38d363320edf62d59db7f'
          TREE='276c6d83099cb56aabaaf558e8ad28add2b0529f'
          PARENT='872360077cd36c415aff97a4c8d0e57a947c0875'
          CANONICAL='a775849c940d48bc8f809e99c075e421744bc53f'
          REF='refs/heads/publication/exact-ce42573-20260929'
          REPO='levonmendall/The-Meme-Machine'
          root=Path(os.environ['RUNNER_TEMP'])/'exact-ce42573-publication';root.mkdir()
          def save(name,row): (root/name).write_text(json.dumps(row,indent=2)+'\n')
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def get(path,missing=False):
              request=urllib.request.Request('https://api.github.com/repos/'+REPO+'/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
              except urllib.error.HTTPError as exc:
                  if missing and exc.code==404:return None
                  raise
          def state_guard():
              assert get('git/ref/heads/repair/stagee27-archive-ready-allocation-20260928')['object']['sha']==PARENT
              assert get('git/ref/heads/cert/autonomous-paper-machinery-20260927')['object']['sha']==CANONICAL
              for status in ['in_progress','queued']:
                  value=get('actions/runs?status='+status+'&per_page=100')
                  assert value['total_count']<=100
                  assert all(r['id']==int(os.environ['GITHUB_RUN_ID']) or r['path']=='.github/workflows/ci.yml' for r in value['workflow_runs']),value
              runs=get('actions/runs?head_sha='+SHA+'&per_page=100')
              assert runs['total_count']==0,'candidate_already_has_runs'
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert os.environ['GITHUB_REF']=='refs/heads/recovery/publish-exact-ce42573-20260929'
          assert git('rev-parse','HEAD')==PARENT and not git('status','--porcelain')
          control=Path(os.environ['GITHUB_WORKSPACE'])/'control'
          encoded=(control/'.github/exact-ce42573/candidate.bundle.b64').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(encoded)).encode()+b'\0'+encoded).hexdigest()=='fd30995c3c04cb89028c96508c820566fa571607'
          data=base64.b64decode(b''.join(encoded.split()),validate=True)
          assert hashlib.sha256(data).hexdigest()=='9c9ed1fa35962247c2d6254c8a0bb6872ee4c9137d015da2b94e98354313aae5'
          bundle=root/'exact-candidate.bundle';bundle.write_bytes(data)
          git('bundle','verify',str(bundle));git('fetch',str(bundle),'HEAD');git('checkout','--detach',SHA)
          identity=dict(sha=git('rev-parse','HEAD'),tree=git('rev-parse','HEAD^{tree}'),parent=git('rev-parse','HEAD^'))
          assert identity==dict(sha=SHA,tree=TREE,parent=PARENT) and not git('status','--porcelain')
          changed=set(git('diff','--name-only',PARENT,SHA).splitlines())
          expected={'.github/stagee27/cohort-request.json','certification/profitability_protocol.json','certification/sources.json','meme_machine/solana_evidence_service.py','tests/test_run381_archive_scheduling.py'}
          assert changed==expected
          request=json.loads(Path('.github/stagee27/cohort-request.json').read_text())
          assert request['expected_parent']==PARENT and set(request['reviewed_files'])==expected
          assert request['paper_only'] is True and request['market_authority'] is False
          assert hashlib.sha256(Path('certification/stagee24_qualification_plan.json').read_bytes()).hexdigest()==request['plan_sha256']=='b7ff1c305e6df7eeab2b20b57e6f1e9211a2642dadc893208012d3042858696e'
          subprocess.run(['python','-m','certification.qualification_environment','--output',str(root/'environment.json')],check=True)
          with (root/'git-fsck.log').open('w') as log:subprocess.run(['git','fsck','--full','--no-reflogs'],check=True,stdout=log,stderr=subprocess.STDOUT)
          (root/'commit.raw').write_bytes(subprocess.check_output(['git','cat-file','commit',SHA]))
          save('local-identity.json',identity)
          state_guard()
          existing=get('git/ref/'+REF.removeprefix('refs/'),missing=True)
          assert existing is None or existing['object']['sha']==SHA,'publication_ref_conflict'
          save('publication-intent.json',dict(**identity,ref=REF,control_sha=os.environ['GITHUB_SHA'],run_id=int(os.environ['GITHUB_RUN_ID']),attempt=1,qualification_authority=False,canonical_authority=False,market_authority=False))
          if existing is None:
              encoded_auth=base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
              print('::add-mask::'+encoded_auth,flush=True)
              env=dict(os.environ,GIT_TERMINAL_PROMPT='0',GIT_CONFIG_COUNT='1',GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+encoded_auth)
              result=subprocess.run(['git','push','--porcelain','--force-with-lease='+REF+':','https://github.com/'+REPO+'.git',SHA+':'+REF],env=env,text=True,capture_output=True,timeout=120)
              output=(result.stdout+result.stderr).replace(os.environ['GH_TOKEN'],'[REDACTED]').replace(encoded_auth,'[REDACTED]')
              (root/'push.log').write_text(output)
              save('push-result.json',dict(returncode=result.returncode,attempts=1))
              # Lost responses are reconciled by GET only; never push again.
          remote=get('git/commits/'+SHA)
          assert remote['sha']==SHA and remote['tree']['sha']==TREE and [p['sha'] for p in remote['parents']]==[PARENT]
          assert get('git/ref/'+REF.removeprefix('refs/'))['object']['sha']==SHA
          state_guard()
          save('remote-identity.json',remote)
          save('publication-result.json',dict(**identity,ref=REF,remote_verified=True,runtime_changed=False,cohort_dispatched=False,canonical_promoted=False,market_action=False))
          print(json.dumps(dict(**identity,remote_verified=True,cohort_dispatched=False)),flush=True)
          PY
      - name: Hash publication evidence even on failure
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'exact-ce42573-publication';root.mkdir(exist_ok=True)
          values={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()}
          (root/'SHA256.json').write_text(json.dumps(values,indent=2)+'\n')
          PY
      - name: Preserve exact source and publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-ce42573-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-ce42573-publication/
          if-no-files-found: error
          retention-days: 90
