name: robinhood-ramses-strategy
on:
  push:
    branches: [feat/robinhood-research-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prospective-strategy-sample:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[robinhood-ramses-strategy-sample]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: meme-machine-robinhood-ramses-strategy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Run prospective Ramses strategy sample
        env:
          MM_ROBINHOOD_READ_RPC_URL: ${{ secrets.MM_ROBINHOOD_READ_RPC_URL }}
          MM_ROBINHOOD_DLMM_RPC_URL: ${{ secrets.MM_ROBINHOOD_DLMM_RPC_URL }}
        run: python -m robinhood_research.ramses_strategy_sample
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: robinhood-ramses-strategy-${{ github.sha }}-${{ github.run_id }}
          path: |
            robinhood-ramses-strategy-report.json
            robinhood-ramses-strategy.sqlite
          retention-days: 30
          if-no-files-found: error
