name: Temporary observability operational validation
on:
  push:
    branches:
      - strategy/observability-opportunity-preservation-v1
permissions:
  contents: read
jobs:
  operational-delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.txt
      - name: Run head OPERATIONAL and compare failure identities to base
        shell: bash
        run: |
          set +e
          python -m operational.tests OPERATIONAL > /tmp/head.log 2>&1
          HEAD_RC=$?
          set -e
          git fetch --depth=1 origin b577cc1c67f4d64f887b430f5e933f376b607dc2
          git worktree add --detach /tmp/base b577cc1c67f4d64f887b430f5e933f376b607dc2
          set +e
          (cd /tmp/base && python -m operational.tests OPERATIONAL) > /tmp/base.log 2>&1
          BASE_RC=$?
          set -e
          grep -E '^(FAIL|ERROR): ' /tmp/head.log | sed -E 's/^(FAIL|ERROR): //' | sort -u > /tmp/head.failures || true
          grep -E '^(FAIL|ERROR): ' /tmp/base.log | sed -E 's/^(FAIL|ERROR): //' | sort -u > /tmp/base.failures || true
          echo "=== HEAD summary ==="
          grep -E 'Ran [0-9]+ tests|FAILED \(|^OK' /tmp/head.log | tail -n 3 || true
          echo "=== BASE summary ==="
          grep -E 'Ran [0-9]+ tests|FAILED \(|^OK' /tmp/base.log | tail -n 3 || true
          echo "=== New failure identities ==="
          comm -13 /tmp/base.failures /tmp/head.failures | tee /tmp/new.failures
          echo "=== Resolved baseline failure identities ==="
          comm -23 /tmp/base.failures /tmp/head.failures || true
          echo "HEAD_RC=$HEAD_RC BASE_RC=$BASE_RC"
          if [ -s /tmp/new.failures ]; then
            echo "New OPERATIONAL failure identities detected"
            tail -n 250 /tmp/head.log
            exit 1
          fi
          exit 0
