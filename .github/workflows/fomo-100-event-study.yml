name: fomo-100-event-pump-native-study
on:
  push:
    branches: [research/fomo-100-event-study]
permissions:
  contents: read
jobs:
  study:
    if: contains(github.event.head_commit.message, '[fomo-100-study]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FOMOAPI_KEY: ${{ secrets.FOMOAPI_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - name: Install archive-only analysis dependencies
        run: python -m pip install --disable-pip-version-check requests zstandard
      - name: Run 100-event Pump-native matched Fomo event study
        run: set -o pipefail; python -m tests.fomo_100_event_pump_native_study | tee fomo-100-event-study.log
      - name: Preserve full research evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fomo-100-event-study-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fomo-100-event-pump-native-study.json
            fomo-100-event-study.log
          if-no-files-found: warn
          retention-days: 30
