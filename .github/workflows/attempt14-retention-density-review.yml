name: Verify attempt 14 retention density repair
on:
  push:
    branches: [review/attempt14-retention-density-20260928]
    paths: [.github/workflows/attempt14-retention-density-review.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 95b9691d32fdb70fa6a96c1c513e75353054d8e7
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Focused retention fairness regressions
        run: |
          python -m unittest -v \
            tests.test_run381_retention_progress \
            tests.test_run381_maintenance_overlap \
            tests.test_run381_archive_scheduling
          python -m py_compile \
            meme_machine/solana_evidence_control.py \
            meme_machine/solana_evidence_plane.py \
            meme_machine/solana_evidence_service.py
      - name: Cross prior failure horizon under measured contention
        timeout-minutes: 10
        run: |
          mkdir -p attempt14-review/pressure
          python -m certification.run381_pressure --frames 1400 --measured-contention --output attempt14-review/pressure
      - name: Compute exact prepared Pump and Meteora source identities
        run: |
          rm -rf "$RUNNER_TEMP/hash-worktrees"
          python -m certification.run prepare --worktrees "$RUNNER_TEMP/hash-worktrees"
          python - <<'PYCODE'
          import hashlib,json,subprocess,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'hash-worktrees'
          args=['git','diff','--binary','--full-index','--no-ext-diff','--no-textconv','--no-renames','HEAD']
          result={}
          for lane in ('pump','meteora'):
              diff=subprocess.check_output(args,cwd=root/lane)
              result[lane+'_source_diff_sha256']=hashlib.sha256(diff).hexdigest()
          for name in (
              'meme_machine/solana_evidence_control.py',
              'meme_machine/solana_evidence_plane.py',
              'meme_machine/solana_evidence_service.py',
              'tests/test_run381_retention_progress.py',
          ):
              result[name]=hashlib.sha256(Path(name).read_bytes()).hexdigest()
          Path('attempt14-review/identities.json').write_text(
              json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,sort_keys=True))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: attempt14-retention-density-95b9691
          path: attempt14-review/
          if-no-files-found: warn
          retention-days: 90
