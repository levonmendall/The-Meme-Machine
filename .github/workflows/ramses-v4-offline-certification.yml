name: Ramses v4 offline certification
on:
  push:
    branches:
      - strategy/ramses-viability-v4-20260924

permissions:
  contents: read
  actions: read

jobs:
  offline-certify:
    if: contains(github.event.head_commit.message, '[ramses-v4-offline-cert]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Prepare exact composed lane worktrees
        run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/ramses-v4-offline"
      - name: Verify frozen prospective identity
        run: |
          mkdir -p ramses-v4-offline-evidence
          python -m certification.protocol_freeze --output ramses-v4-offline-evidence/protocol-freeze.json
      - name: Replay preserved Ramses viability evidence
        run: |
          set -o pipefail
          (cd "$RUNNER_TEMP/ramses-v4-offline/ramses" && python -m unittest robinhood_tests.test_ramses_viability_v4_replay -v) 2>&1 | tee ramses-v4-offline-evidence/ramses-v4-replay.log
      - name: Supervisor deterministic suite
        env:
          MM_TEST_LANE_WORKTREES: ${{ runner.temp }}/ramses-v4-offline
        run: |
          set -o pipefail
          python -m unittest discover -s certification/tests -v 2>&1 | tee ramses-v4-offline-evidence/supervisor.log
      - name: Full four-lane deterministic verification
        run: python -m certification.run verify --worktrees "$RUNNER_TEMP/ramses-v4-offline" --output ramses-v4-offline-evidence/gates
      - name: Assert exact integration identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          gate=json.loads(Path("ramses-v4-offline-evidence/gates/deterministic.json").read_text())
          assert gate["passed"] is True
          assert gate["integration_sha"] == os.environ["EXPECTED_SHA"]
          print(json.dumps({
              "certified": True,
              "integration_sha": gate["integration_sha"],
              "source_diff_hashes": gate["source_diff_hashes"],
          }, sort_keys=True))
          PY
      - name: Preserve offline certificate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ramses-v4-offline-certification-${{ github.sha }}-${{ github.run_attempt }}
          path: ramses-v4-offline-evidence/
          if-no-files-found: error
          retention-days: 90
