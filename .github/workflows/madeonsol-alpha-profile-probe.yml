name: madeonsol-alpha-profile-probe
on:
  push:
    branches: [research/solana-skilled-wallet-alpha]
permissions: {contents: read}
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[alpha-profile-probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - run: python -m tests.madeonsol_alpha_profile_probe
