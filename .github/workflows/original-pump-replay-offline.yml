name: Original Pump market replay focused offline checks
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Fixed isolated engineering check group; neither is a release gate
        type: choice
        options: [replay, native-content]
        default: replay
  pull_request:
    paths:
      - 'engineering/diagnostics/replay_original_pump_window.py'
      - 'engineering/diagnostics/replay_concurrent_pump_window.py'
      - 'tests/test_original_pump_window_replay.py'
      - '.github/workflows/original-pump-replay-offline.yml'
permissions:
  contents: read
jobs:
  replay-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.txt
      - name: Check actual pipeline replay and unchanged runtime integrity offline
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope != 'native-content' }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m operational.tests OPERATIONAL --modules \
            tests.test_original_pump_window_replay \
            tests.test_publication_accounting_turn \
            tests.test_solana_history_separation \
            tests.test_managed_capacity_source_guard --verbose
      - name: Check bounded native content and managed storage offline (not release acceptance)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'native-content' }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m operational.tests OPERATIONAL --modules \
            tests.test_managed_log_repair_batches \
            tests.test_archive_full_log_content \
            tests.test_solana_source_drain \
            tests.test_managed_native_pons \
            tests.test_managed_capacity_source_guard --verbose
