name: ramses-factory-cache-seed
on:
  push:
    branches: [repair/ramses-public-factory-call-20260922]
permissions:
  contents: read
jobs:
  seed:
    if: contains(github.event.head_commit.message, '[ramses-cache-seed]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MM_ROBINHOOD_DLMM_RPC_URL: ${{ secrets.MM_ROBINHOOD_DLMM_RPC_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Build authenticated factory inventory seed
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,time
          from urllib.request import Request,urlopen

          endpoint=os.environ['MM_ROBINHOOD_DLMM_RPC_URL']
          factory='0xdcD5F77697914E27f56FD263EF82923C8524AbAc'
          headers={
              'Content-Type':'application/json',
              'Accept':'application/json',
              'User-Agent':'Meme-Machine/1.0 (+https://github.com/levonmendall/The-Meme-Machine)',
          }
          seq=0
          def call(method,params):
              global seq
              seq+=1
              body=json.dumps({'jsonrpc':'2.0','id':seq,'method':method,'params':params}).encode()
              with urlopen(Request(endpoint,data=body,headers=headers),timeout=15) as response:
                  reply=json.loads(response.read(4_000_000))
              if reply.get('error'):
                  raise RuntimeError('rpc_error:'+str(reply['error'].get('code')))
              return reply['result']

          chain=call('eth_chainId',[])
          if int(chain,16)!=4663: raise RuntimeError('wrong_chain')
          frontier=call('eth_getBlockByNumber',['finalized',False])
          block=frontier['number']
          count_raw=call('eth_call',[{'to':factory,'data':'0x4e937c3a'},block])
          count=int(count_raw,16)
          if not 1<=count<=4096: raise RuntimeError('count_boundary')
          # selector for getLBPairAtIndex(uint256) comes from the verified factory ABI.
          # Derive using pycryptodome if available, otherwise use the known verified selector.
          selector='0x4ccb20c0'
          addresses=[]
          for first in range(0,count,20):
              calls=[]
              for index in range(first,min(count,first+20)):
                  data=selector+index.to_bytes(32,'big').hex()
                  seq+=1
                  calls.append({'jsonrpc':'2.0','id':seq,'method':'eth_call',
                                'params':[{'to':factory,'data':data},block]})
              body=json.dumps(calls).encode()
              with urlopen(Request(endpoint,data=body,headers=headers),timeout=20) as response:
                  rows=json.loads(response.read(4_000_000))
              by_id={r['id']:r for r in rows}
              for req in calls:
                  row=by_id[req['id']]
                  if row.get('error'): raise RuntimeError('member_rpc_error:'+str(row['error'].get('code')))
                  raw=row['result']
                  address='0x'+raw[-40:].lower()
                  if int(address,16)==0: raise RuntimeError('zero_address')
                  addresses.append(address)
          if len(addresses)!=count or len(set(addresses))!=count:
              raise RuntimeError('inventory_shape')
          digest=hashlib.sha256(json.dumps(addresses,separators=(',',':')).encode()).hexdigest()
          row={
              'kind':'ramses_all_pool_inventory_cache_v1',
              'chain_id':4663,
              'factory':factory.lower(),
              'factory_runtime_sha256':'f53b61bb1b43c80d7e1a131856224a8598bf746491880931e9d6bfcd5c6e197b',
              'count':count,
              'asof_block':int(block,16),
              'addresses':addresses,
              'addresses_sha256':digest,
              'seeded_at':time.time(),
              'seed_authority':'authenticated_dlmm_rpc_exact_finalized_block',
              'paper_only':True,
          }
          pathlib.Path('robinhood-ramses-all-pool-inventory-cache.json').write_text(
              json.dumps(row,sort_keys=True,separators=(',',':'))+'\n'
          )
          print(json.dumps({'count':count,'block':block,'addresses_sha256':digest},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ramses-factory-cache-seed-${{ github.run_id }}
          path: robinhood-ramses-all-pool-inventory-cache.json
          if-no-files-found: error
          retention-days: 30
