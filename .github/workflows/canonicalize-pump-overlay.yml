name: canonicalize-pump-overlay
on:
  push:
    branches: [repair/solana-alchemy-efficiency]

permissions:
  contents: write

jobs:
  canonicalize:
    if: contains(github.event.head_commit.message, '[canonicalize-pump-overlay]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Regenerate canonical Pump overlay
        run: |
          PUMP_SHA="$(python -c 'import json; print(json.load(open("certification/sources.json"))["lanes"]["pump"]["source_sha"])')"
          WORKTREE="$(mktemp -d)/pump"
          git fetch origin "$PUMP_SHA"
          git worktree add --detach "$WORKTREE" "$PUMP_SHA"
          git -C "$WORKTREE" apply --check "$GITHUB_WORKSPACE/certification/patches/pump-accounting.patch"
          git -C "$WORKTREE" apply --index "$GITHUB_WORKSPACE/certification/patches/pump-accounting.patch"
          git -C "$WORKTREE" diff --binary HEAD > "$GITHUB_WORKSPACE/certification/patches/pump-accounting.patch"
          git diff --check -- certification/patches/pump-accounting.patch
          if git diff --quiet -- certification/patches/pump-accounting.patch; then
            echo "Pump overlay already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certification/patches/pump-accounting.patch
          git commit -m "[qualification-build] canonicalize Pump pressure overlay"
          git push origin HEAD:repair/solana-alchemy-efficiency
