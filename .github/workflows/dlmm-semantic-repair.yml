name: dlmm-semantic-repair
on:
  push:
    branches:
      - research/dlmm-point-in-time-replay
permissions:
  contents: write
jobs:
  repair:
    if: contains(github.event.head_commit.message, '[dlmm-semantic-repair-trigger]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Apply narrow semantic repair
        run: python scripts/repair_dlmm_bin_cross_timestamp.py
      - name: Prove bin-cross timestamp semantics and authentic reference
        run: python -m unittest tests.test_dlmm_tape_extensions tests.test_dlmm_reference -v
      - name: Commit repaired semantics
        run: |
          rm -f scripts/repair_dlmm_bin_cross_timestamp.py .github/workflows/dlmm-semantic-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "[qualification-build] [dlmm-strategy-replay] Repair bin-cross timestamp semantics"
          git push origin HEAD:research/dlmm-point-in-time-replay
