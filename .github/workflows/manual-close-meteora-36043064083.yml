name: manual-close-meteora-36043064083
on:
  push:
    branches: [ops/manual-close-meteora-36043064083-20260924]

permissions:
  contents: write
  actions: write

concurrency:
  group: manual-close-meteora-36043064083
  cancel-in-progress: false

jobs:
  close:
    if: contains(github.event.head_commit.message, '[owner-forced-close]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUNTIME_SHA: 07ec67a2b7967fd3e97c056307967ce1738f6d20
      RUNTIME_REF: cert/single-market-v9-monitored-20260924
      CAMPAIGN_RUN_ID: "36043064083"
      CONTINUATION_LANE: meteora
    steps:
      - name: Stop the automatic continuation chain and select latest complete state
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            mapfile -t active < <(gh api --paginate               "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100"               --jq '.workflow_runs[]
                | select(.path==".github/workflows/position-continuation.yml")
                | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending" or .status=="requested")
                | .id')
            if [ "${#active[@]}" -eq 0 ]; then break; fi
            for run_id in "${active[@]}"; do
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
            done
            sleep 2
          done
          remaining="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100"             --jq '[.workflow_runs[]
              | select(.path==".github/workflows/position-continuation.yml")
              | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending" or .status=="requested")] | length'             | awk '{s+=$1} END{print s+0}')"
          test "$remaining" = "0"
          source_run="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?event=workflow_dispatch&per_page=100"             --jq ".workflow_runs[]
              | select(.path==\".github/workflows/position-continuation.yml\")
              | select(.status==\"completed\" and .conclusion==\"success\")
              | select(.head_sha==\"${RUNTIME_SHA}\" and .head_branch==\"${RUNTIME_REF}\")
              | .id" | head -n 1)"
          test -n "$source_run"
          echo "state_run_id=$source_run" >> "$GITHUB_OUTPUT"
          echo "Latest complete continuation state: $source_run"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RUNTIME_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Restore latest authenticated Meteora continuation artifact
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_RUN_ID: ${{ steps.source.outputs.state_run_id }}
        run: |
          set -euo pipefail
          mapfile -t names < <(gh api --paginate             "repos/${GITHUB_REPOSITORY}/actions/runs/${STATE_RUN_ID}/artifacts?per_page=100"             --jq '.artifacts[].name' | grep -E "^position-continuation-meteora-${STATE_RUN_ID}-[0-9]+$" || true)
          test "${#names[@]}" -eq 1
          mkdir -p manual-close-state
          gh run download "$STATE_RUN_ID" -R "$GITHUB_REPOSITORY" -n "${names[0]}" -D manual-close-state

      - name: Prepare exact original lane source
        run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/manual-close-worktrees"

      - name: Append owner-forced terminal settlement at latest authenticated mark
        env:
          MM_CONTINUATION_LANE_ROOT: ${{ runner.temp }}/manual-close-worktrees/meteora
          STATE_RUN_ID: ${{ steps.source.outputs.state_run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          from certification.position_continuation import (
              _activate_lane_root, _find, _meteora_events, _meteora_open_identity,
          )

          _activate_lane_root()
          from tests import solana_dlmm_independent_v1 as module
          from meme_machine.dlmm_independent_accounting import PaperBook
          from meme_machine.dlmm_tape import VerifiedTape

          root=Path("manual-close-state")
          db_path=_find(root,"solana-dlmm-independent-v1-live.accounting.sqlite3")
          events=_meteora_events(db_path)
          genesis=events[0]["data"]
          identity,entry_event=_meteora_open_identity(events)
          entry_data=entry_event["data"]
          features=entry_data["features"]
          entry=entry_data["entry_state"]
          policy=entry_data["policy"]

          book=PaperBook(
              db_path,
              run_id=genesis["run_id"],
              policy_hash=genesis["policy_hash"],
              capital=int(genesis["capital"]),
          )
          position=module._build_position(entry,features,policy)
          last_lineage=None
          mark_count=0
          for event in events:
              if event.get("identity")!=identity or event.get("action")!="mark":
                  continue
              t=event["data"]["tape"]
              tape=VerifiedTape(
                  t["start_hash"],t["end_hash"],tuple(t["events"]),
                  t["terminal"],t["lineage"],tuple(t.get("terminal_adjustments",())),
              )
              position=module._advance_position(position,tape)
              last_lineage=tape.lineage
              mark_count+=1

          if mark_count < 1:
              raise RuntimeError("owner_forced_close_requires_authenticated_mark")
          final=module._mark(position)
          book.append(identity,"settle",dict(
              mark=final,
              exit_reason="owner_forced_manual_close",
              lineage=last_lineage or module.digest(entry),
              forced=True,
              manual=True,
              natural=False,
              owner_authorized=True,
              source_state_run_id=int(os.environ["STATE_RUN_ID"]),
          ))
          accounting=book.reconcile()
          replay=book.replay_economics(
              module._build_position,module._advance_position,module._mark)
          for key in ("open_positions","pending","unsettled","reserved"):
              if int(accounting.get(key) or 0)!=0:
                  raise RuntimeError("owner_forced_close_not_flat:"+key)
          if accounting.get("reconciled") is not True or replay.get("verified") is not True:
              raise RuntimeError("owner_forced_close_replay_failed")

          result=dict(
              schema="meteora-owner-forced-close-v1",
              lane="meteora",
              status="forced_settled",
              handoff_required=False,
              lifecycle_id=identity,
              reason="owner_forced_manual_close",
              forced_settled=True,
              natural_settled=False,
              owner_authorized=True,
              economic_sample_eligible=False,
              assurance_passed=True,
              conformance="owner_forced_terminal_intervention",
              continuity="latest_authenticated_mark_preserved",
              accounting=accounting,
              accounting_replay=replay,
              terminal_replay_verified=True,
              source_state_run_id=int(os.environ["STATE_RUN_ID"]),
              integration_sha=os.environ["RUNTIME_SHA"],
          )
          (root/"position-continuation-result.json").write_text(
              json.dumps(result,sort_keys=True,indent=2)+"\n")
          print(json.dumps({
              "status":result["status"],
              "lifecycle_id":identity,
              "mark_count":mark_count,
              "realized_pnl_lamports":accounting.get("realized_pnl_lamports"),
              "flat":True,
          },sort_keys=True))
          PY

      - name: Amend original block as forced and ineligible
        run: |
          set -euo pipefail
          base="$(find manual-close-state -type f -name 'prospective-observation.json' -print -quit)"
          test -n "$base"
          python -m certification.prospective_acceptance amend-continuation             --record "$base"             --lane meteora             --state-dir manual-close-state             --continuation-result manual-close-state/position-continuation-result.json             --output manual-close-state/prospective-observation-meteora.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("manual-close-state/prospective-observation-meteora.json")
          row=json.loads(p.read_text())
          lane=row["lanes"]["meteora"]
          lane["forced_settled"]=int(lane.get("forced_settled") or 0)+1
          lane["natural_position_terminal"]=False
          lane["continuation_terminal_status"]="forced_settled"
          lane["manual_intervention"]="owner_forced_manual_close"
          row["block_admission_passed"]=False
          row["manual_intervention"]=True
          row["manual_intervention_reason"]="owner_forced_manual_close"
          update=row.setdefault("continuation_updates",{}).setdefault("meteora",{})
          update.update(
              forced_settlement=True,
              natural_settlement=False,
              manual_owner_intervention=True,
              status="forced_settled",
          )
          p.write_text(json.dumps(row,sort_keys=True,indent=2)+"\n")
          if lane["natural_settled"] != 0:
              raise RuntimeError("forced_close_must_not_gain_natural_settlement_credit")
          if lane["forced_settled"] < 1 or row["block_admission_passed"] is not False:
              raise RuntimeError("forced_close_acceptance_exclusion_failed")
          print(json.dumps({
              "natural_settled":lane["natural_settled"],
              "forced_settled":lane["forced_settled"],
              "block_admission_passed":row["block_admission_passed"],
          },sort_keys=True))
          PY

      - name: Terminalize consumed continuation authority
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_RUN_ID: ${{ steps.source.outputs.state_run_id }}
        run: |
          python - <<'PY'
          import os, time
          from certification.prospective_program import GitHub
          from certification.single_campaign_control import (
              StateStore, configuration, continuation_store,
          )

          api=GitHub()
          config=configuration()
          main=StateStore(api,config).read()
          if (not main or main.get("workflow_run_id")!=int(os.environ["CAMPAIGN_RUN_ID"])
                  or main.get("phase")!="POSITION_CONTINUATION"
                  or main.get("identity",{}).get("integration_sha")!=os.environ["RUNTIME_SHA"]):
              raise RuntimeError("owner_forced_close_parent_state")

          store=continuation_store(api,config,"meteora")
          state=store.read()
          if (not state
                  or state.get("campaign_run_id")!=int(os.environ["CAMPAIGN_RUN_ID"])
                  or state.get("lane")!="meteora"
                  or state.get("identity")!=main.get("identity")
                  or state.get("status") not in ("OPEN","HALTED_UNRESOLVED")):
              raise RuntimeError("owner_forced_close_chain_state")
          if int(state.get("last_state_run_id") or 0)!=int(os.environ["STATE_RUN_ID"]):
              raise RuntimeError("owner_forced_close_stale_state")

          state.update(
              status="SETTLED",
              active_run_id=None,
              last_state_run_id=int(os.environ["STATE_RUN_ID"]),
              forced_manual_close=True,
              forced_manual_close_run_id=int(os.environ["GITHUB_RUN_ID"]),
              forced_manual_close_at=time.time(),
              terminal_reason="owner_forced_manual_close",
          )
          state["history"].append(dict(
              action="owner_forced_manual_close",
              run_id=int(os.environ["GITHUB_RUN_ID"]),
              source_state_run_id=int(os.environ["STATE_RUN_ID"]),
              natural_settlement_credit=False,
          ))
          store.write(state)
          print("Continuation authority terminalized as forced/manual settlement.")
          PY

      - name: Preserve forced-close evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-forced-close-meteora-36043064083-${{ github.run_id }}
          path: manual-close-state/
          if-no-files-found: error
          retention-days: 90
