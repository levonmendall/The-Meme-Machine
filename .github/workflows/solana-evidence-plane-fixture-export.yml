name: solana-evidence-plane-fixture-export-offline
on:
  push:
    branches: [repair/solana-evidence-plane-v1-20260925]
    paths:
      - certification/export_solana_retained.py
      - .github/workflows/solana-evidence-plane-fixture-export.yml
permissions:
  contents: read
  actions: read
jobs:
  export-completed-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Extract digest-pinned retained Solana evidence only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m certification.export_solana_retained
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: solana-retained-evidence-subset
          path: solana-retained-export
          if-no-files-found: error
          retention-days: 30
