name: solana-evidence-plane-fixture-export-offline
on:
  push:
    branches: [repair/solana-evidence-plane-v1-20260925]
    paths:
      - certification/repackage_solana_export.py
      - .github/workflows/solana-evidence-plane-fixture-export.yml
permissions:
  contents: read
  actions: read
jobs:
  export-completed-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Extract digest-pinned retained Solana evidence only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m certification.repackage_solana_export
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: solana-retained-transfer-0
          path: solana-retained-transfer/part-0.bin
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: solana-retained-transfer-1
          path: solana-retained-transfer/part-1.bin
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: solana-retained-transfer-2
          path: solana-retained-transfer/part-2.bin
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: solana-retained-transfer-3
          path: solana-retained-transfer/part-3.bin
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: solana-retained-transfer-receipt
          path: solana-retained-transfer/receipt.json
          if-no-files-found: error
          retention-days: 30
