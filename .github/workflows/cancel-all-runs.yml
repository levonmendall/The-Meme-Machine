name: cancel-all-runs
on:
  push:
    branches: [repair/frozen-campaign-handoff]
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    if: contains(github.event.head_commit.message, '[cancel-campaign-stale]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel only verified superseded campaign diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, pathlib, time, urllib.request
          targets = {
              35570800018: "f63e1e7abf87f17e0babc16ec4436aa6bebb3078",
              35571312143: "bd2f08ef22790cdc092e917fc8a08b24ed232ff1",
          }
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28"}
          base = "https://api.github.com/repos/" + os.environ["REPOSITORY"] + "/actions/runs/"
          evidence = []
          for run_id, sha in targets.items():
              url = base + str(run_id)
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  row = json.load(response)
              if row["head_sha"] != sha or row["head_branch"] != "repair/frozen-campaign-handoff" or row["name"] != "paper-milestone":
                  raise SystemExit("cancellation_identity_mismatch")
              with urllib.request.urlopen(urllib.request.Request(url + "/artifacts", headers=headers)) as response:
                  artifacts = json.load(response)
              record = dict(run_id=run_id, sha=sha, before=row["status"],
                            artifacts=artifacts, reason="accidental legacy read-only shadow qualification from documentation/build commit; superseded by frozen four-lane campaign; consumes provider capacity and has no paper lifecycle authority")
              with urllib.request.urlopen(urllib.request.Request(url + "/jobs?per_page=100", headers=headers)) as response:
                  jobs=json.load(response)
              live=[j for j in jobs['jobs'] if j['name']!='test' and j['status']!='completed']
              if any(j['name']!='live-diagnostic' for j in live):raise SystemExit('unexpected_live_job_do_not_cancel')
              record['jobs_before']=jobs
              pathlib.Path("campaign-cancellations.json").write_text(json.dumps([*evidence,record],indent=2))
              if row["status"] != "completed":
                  with urllib.request.urlopen(urllib.request.Request(url + "/cancel", headers=headers, method="POST")) as response:
                      record["cancel_response"] = response.status
              evidence.append(record)
              pathlib.Path("campaign-cancellations.json").write_text(json.dumps(evidence, indent=2))
              print(json.dumps({k:v for k,v in record.items() if k not in ("artifacts","pre_cancel_snapshot")}))
          PY
      - name: Preserve cancellation audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: campaign-cancellations-${{ github.run_id }}
          path: campaign-cancellations.json
          retention-days: 90
