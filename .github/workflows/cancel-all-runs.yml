name: cancel-all-runs
on:
  push:
    branches: [repair/frozen-campaign-handoff]
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    if: contains(github.event.head_commit.message, '[cancel-campaign-stale]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel only verified superseded campaign diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, pathlib, time, urllib.request
          targets = {
              35563114670: "c4572e18d078222fe05d6df9eec55d62dfc59f41",
          }
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28"}
          base = "https://api.github.com/repos/" + os.environ["REPOSITORY"] + "/actions/runs/"
          evidence = []
          for run_id, sha in targets.items():
              url = base + str(run_id)
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  row = json.load(response)
              if row["head_sha"] != sha or row["head_branch"] != "repair/frozen-campaign-handoff" or row["name"] != "four-lane-certification":
                  raise SystemExit("cancellation_identity_mismatch")
              with urllib.request.urlopen(urllib.request.Request(url + "/artifacts", headers=headers)) as response:
                  artifacts = json.load(response)
              record = dict(run_id=run_id, sha=sha, before=row["status"],
                            artifacts=artifacts, reason="stop failed superseded hour after Pons already exited unexpectedly with retained unresolved exposure; require every still-running lane flat with no outstanding qualification before cancellation; preserve all artifacts and exact unresolved Pons accounting")
              if row["status"] != "completed":
                  checks_url = "https://api.github.com/repos/" + os.environ["REPOSITORY"] + "/commits/" + sha + "/check-runs?per_page=100"
                  with urllib.request.urlopen(urllib.request.Request(checks_url, headers=headers)) as response:
                      checks = json.load(response)
                  check = next(c for c in checks["check_runs"] if c["name"] == "four-lane-live-hourly")
                  body = check["output"]["text"].strip()
                  snapshot = json.loads(body.removeprefix("```json").removesuffix("```").strip())
                  flat = snapshot.get("elapsed_seconds") is not None and 0 <= time.time()-snapshot.get("observed_at",0)<45
                  pons = snapshot["lanes"]["pons"]
                  flat = flat and pons.get("exit_code")==0 and pons.get("unexpected_exit") is True and pons.get("health")=="exited"
                  record["already_exited_unresolved_pons"] = pons.get("cohort_accounting")
                  for lane, state in snapshot["lanes"].items():
                      if lane=="pons":continue
                      flat = flat and state.get("open_positions") == 0 and state.get("accounting_reconciled") is True
                      funnel = state.get("funnel") or {}
                      qualified = funnel.get("qualified",funnel.get("unique_qualified",0))
                      flat = flat and qualified == state.get("natural_settled",0)
                      book = state.get("cohort_accounting") or state.get("native_accounting") or {}
                      flat = flat and not book.get("reserved",0) and not book.get("pending",0)
                      for asset in (book.get("by_quote_asset") or {}).values():
                          flat = flat and not asset.get("open_positions",0) and not asset.get("committed",0)
                  record["pre_cancel_snapshot"] = snapshot
                  pathlib.Path("campaign-cancellations.json").write_text(json.dumps([record], indent=2))
                  if not flat:raise SystemExit("not_proven_flat_do_not_cancel")
                  with urllib.request.urlopen(urllib.request.Request(url + "/cancel", headers=headers, method="POST")) as response:
                      record["cancel_response"] = response.status
              evidence.append(record)
              pathlib.Path("campaign-cancellations.json").write_text(json.dumps(evidence, indent=2))
              print(json.dumps({k:v for k,v in record.items() if k not in ("artifacts","pre_cancel_snapshot")}))
          PY
      - name: Preserve cancellation audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: campaign-cancellations-${{ github.run_id }}
          path: campaign-cancellations.json
          retention-days: 90
