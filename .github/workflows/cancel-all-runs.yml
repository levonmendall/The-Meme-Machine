name: cancel-all-runs
on:
  push:
    branches: [repair/frozen-campaign-handoff]
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    if: contains(github.event.head_commit.message, '[cancel-campaign-stale]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel exact superseded workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, pathlib, time, urllib.request
          run_id=35660810946
          sha="acc8240ef967daeeba04a8bb309038f33c9d2a02"
          expected_branch="repair/frozen-campaign-handoff"
          expected_name="paper-milestone"
          base="https://api.github.com/repos/"+os.environ["REPOSITORY"]
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"}
          def api(path,method="GET"):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers,method=method),timeout=30) as response:
                  data=response.read()
                  return json.loads(data) if data else {"status":response.status}
          path="/actions/runs/"+str(run_id)
          row=api(path)
          if row["head_sha"]!=sha or row["head_branch"]!=expected_branch or row["name"]!=expected_name:
              raise SystemExit("exact_stop_identity_mismatch")
          record={"run_id":run_id,"sha":sha,"before":row["status"],
                  "reason":"explicit user cancellation: obsolete continuation-v1 live diagnostic blocks profitability-v1 four-lane contention gate"}
          record["artifacts_before"]=api(path+"/artifacts")
          pathlib.Path("campaign-cancellations.json").write_text(json.dumps([record],indent=2))
          if row["status"]!="completed":
              record["cancel"]=api(path+"/cancel","POST")
          for _ in range(30):
              row=api(path)
              record["after"]=row["status"];record["conclusion"]=row["conclusion"]
              if row["status"]=="completed":break
              time.sleep(2)
          record["artifacts_after"]=api(path+"/artifacts")
          pathlib.Path("campaign-cancellations.json").write_text(json.dumps([record],indent=2))
          print(json.dumps({k:v for k,v in record.items() if not k.startswith("artifacts")}),flush=True)
          PY
      - name: Preserve cancellation audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: campaign-cancellations-${{ github.run_id }}
          path: campaign-cancellations.json
          retention-days: 90
          if-no-files-found: error
