name: cancel-all-runs
on:
  push:
    branches: [repair/frozen-campaign-handoff]
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    if: contains(github.event.head_commit.message, '[cancel-campaign-stale]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel exact queued Ramses research replays
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, pathlib, time, urllib.request
          targets=[
              dict(run_id=35673378778,sha="e5c0c810dd34976f04acf82abf55203137ba205f",
                   branch="research/ramses-strategy-finalization-v2",name="ramses-strategy-final-exact-replay",
                   reason="clear queued Robinhood RPC research before repaired natural Ramses machinery campaign"),
              dict(run_id=35673027429,sha="2543554dd3d4945cb6a8512161270da0c57e447a",
                   branch="research/ramses-exact-replay-sharded-v1",name="ramses-quiet-mint-sharded-replay",
                   reason="clear queued Robinhood RPC research before repaired natural Ramses machinery campaign"),
          ]
          base="https://api.github.com/repos/"+os.environ["REPOSITORY"]
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"}
          def api(path,method="GET"):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers,method=method),timeout=30) as response:
                  data=response.read()
                  return json.loads(data) if data else {"status":response.status}
          records=[]
          for target in targets:
              path="/actions/runs/"+str(target["run_id"]);row=api(path)
              if row["head_sha"]!=target["sha"] or row["head_branch"]!=target["branch"] or row["name"]!=target["name"]:
                  raise SystemExit("exact_stop_identity_mismatch")
              rec={k:target[k] for k in ("run_id","sha","reason")};rec["before"]=row["status"]
              rec["artifacts_before"]=api(path+"/artifacts")
              if row["status"]!="completed":rec["cancel"]=api(path+"/cancel","POST")
              records.append(rec)
          pathlib.Path("campaign-cancellations.json").write_text(json.dumps(records,indent=2))
          for _ in range(30):
              done=True
              for rec in records:
                  row=api("/actions/runs/"+str(rec["run_id"]))
                  rec["after"]=row["status"];rec["conclusion"]=row["conclusion"]
                  done=done and row["status"]=="completed"
              pathlib.Path("campaign-cancellations.json").write_text(json.dumps(records,indent=2))
              if done:break
              time.sleep(2)
          for rec in records:rec["artifacts_after"]=api("/actions/runs/"+str(rec["run_id"])+"/artifacts")
          pathlib.Path("campaign-cancellations.json").write_text(json.dumps(records,indent=2))
          print(json.dumps([{k:v for k,v in rec.items() if not k.startswith("artifacts")} for rec in records]),flush=True)
          PY
      - name: Preserve cancellation audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: campaign-cancellations-${{ github.run_id }}
          path: campaign-cancellations.json
          retention-days: 90
          if-no-files-found: error
