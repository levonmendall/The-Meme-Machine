name: cancel-all-runs
on:
  push:
    branches: [repair/solana-alchemy-efficiency]

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    if: github.event.head_commit.message == '[cancel-runs]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel every active workflow run in this repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error

          token=os.environ["GH_TOKEN"]
          repo=os.environ["REPOSITORY"]
          current=int(os.environ["CURRENT_RUN_ID"])
          headers={
              "Accept":"application/vnd.github+json",
              "Authorization":f"Bearer {token}",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"meme-machine-cancel-all",
          }
          active={"queued","in_progress","waiting","pending","requested"}

          def request(url, method="GET"):
              req=urllib.request.Request(url,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      body=response.read()
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  body=exc.read()
                  return exc.code, json.loads(body) if body else None

          base=f"https://api.github.com/repos/{repo}/actions/runs"
          for _ in range(12):
              status,payload=request(base+"?per_page=100")
              if status != 200:
                  raise SystemExit(f"list_runs_failed:{status}")
              rows=[r for r in payload["workflow_runs"]
                    if r.get("status") in active and int(r["id"]) != current]
              if not rows:
                  break
              for row in rows:
                  run_id=int(row["id"])
                  code,_=request(f"{base}/{run_id}/cancel","POST")
                  print(json.dumps({"cancel":run_id,"status":row.get("status"),
                                    "response":code},sort_keys=True),flush=True)
                  if code not in (202,409):
                      raise SystemExit(f"cancel_failed:{run_id}:{code}")
              time.sleep(2)

          # Cancel this one-shot run last so the repository is left with zero active runs.
          code,_=request(f"{base}/{current}/cancel","POST")
          print(json.dumps({"self_cancel":current,"response":code},sort_keys=True),flush=True)
          if code not in (202,409):
              raise SystemExit(f"self_cancel_failed:{code}")
          time.sleep(30)
          PY
