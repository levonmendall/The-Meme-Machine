name: cancel-all-runs
on:
  push:
    branches: [repair/frozen-campaign-handoff]
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    if: contains(github.event.head_commit.message, '[cancel-campaign-stale]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Preserve completed superseded smoke and prevent its successor
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,pathlib,time,urllib.request
          run_id=35575632874
          sha='dbeef7e872944b352d00c2da2f8a055fe9896c70'
          base='https://api.github.com/repos/'+os.environ['REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def api(path,method='GET'):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers,method=method),timeout=30) as r:
                  return r.status,json.load(r) if method=='GET' else None
          record={'run_id':run_id,'sha':sha,'reason':'superseded: live stream omitted ordinary finalized logs, preventing the existing negative-only PumpSwap admission screen; allow smoke drain and preserve artifact, then cancel only before successor starts'}
          deadline=time.monotonic()+1200
          while time.monotonic()<deadline:
              _,run=api('/actions/runs/'+str(run_id))
              if run['head_sha']!=sha or run['head_branch']!='repair/frozen-campaign-handoff' or run['name']!='four-lane-certification':raise SystemExit('identity_mismatch')
              _,jobs=api('/actions/runs/'+str(run_id)+'/jobs?per_page=100')
              _,artifacts=api('/actions/runs/'+str(run_id)+'/artifacts')
              record.update(status=run['status'],jobs=jobs,artifacts=artifacts,observed_at=time.time())
              pathlib.Path('campaign-cancellations.json').write_text(json.dumps(record,indent=2))
              if run['status']=='completed':
                  print(json.dumps({'run':run_id,'status':'already_completed','conclusion':run['conclusion']}));break
              smoke=next((j for j in jobs['jobs'] if j['name']=='concurrent-smoke'),None)
              artifact=next((a for a in artifacts['artifacts'] if a['name'].startswith('four-lane-certification-')),None)
              if smoke and smoke['status']=='completed' and artifact and not artifact['expired']:
                  successor=next((j for j in jobs['jobs'] if j['name']=='hourly-campaign'),None)
                  if successor and successor['status']=='in_progress':
                      raise SystemExit('successor_already_started_do_not_cancel')
                  _,checks=api('/commits/'+sha+'/check-runs?per_page=100')
                  if any(c['name']=='four-lane-live-hourly' for c in checks['check_runs']):
                      raise SystemExit('hourly_process_check_exists_do_not_cancel')
                  record['guard']='completed_smoke_artifact_retained_no_started_hourly_job_or_live_hourly_check'
                  record['cancel_response']=api('/actions/runs/'+str(run_id)+'/cancel','POST')[0]
                  pathlib.Path('campaign-cancellations.json').write_text(json.dumps(record,indent=2))
                  print(json.dumps({'run':run_id,'sha':sha,'artifact':artifact['id'],'digest':artifact.get('digest'),'guard':record['guard'],'cancel_response':record['cancel_response']}))
                  break
              time.sleep(5)
          else:raise SystemExit('smoke_not_complete_no_cancellation')
          PY
      - name: Preserve cancellation audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: campaign-cancellations-${{ github.run_id }}
          path: campaign-cancellations.json
          retention-days: 90
