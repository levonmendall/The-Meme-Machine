name: inspect-postrun-pressure-context
on:
  push:
    branches: [repair/v10-postrun-provider-pressure-20260924]

permissions:
  contents: read

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[inspect-postrun-pressure]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Prepare exact runtime trees
        run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/postrun-pressure"
      - name: Print exact repair anchors
        run: |
          set -euo pipefail
          pons="$RUNNER_TEMP/postrun-pressure/pons"
          pump="$RUNNER_TEMP/postrun-pressure/pump"
          meteora="$RUNNER_TEMP/postrun-pressure/meteora"
          echo '=== PONS provider.py ==='
          grep -n -A70 -B12 'def _http(self, method, params)' "$pons/robinhood_research/provider.py" | head -n 110
          echo '=== PONS topology fallback ==='
          grep -n -A110 -B20 'class ObservationFallbackRpc' "$pons/robinhood_research/provider_topology.py"
          echo '=== PONS pacer ==='
          grep -n -A80 -B10 'class ProviderPacer' "$pons/robinhood_research/provider_topology.py"
          echo '=== PUMP signatures ==='
          grep -R -n -A16 -B8 'getSignaturesForAddress' "$pump/meme_machine" "$pump/tests" | head -n 260
          echo '=== METEORA window/reconstruction ==='
          grep -R -n -A18 -B8 -E 'pending_at_observation_close|campaign_window_insufficient_preentry_time|reconstruction_incomplete|trigger_evidence_requested' "$meteora/tests" "$meteora/meme_machine" | head -n 320
