name: focused-postrun-provider-pressure-cert
on:
  push:
    branches: [repair/v10-postrun-provider-pressure-20260924]

permissions:
  contents: read

jobs:
  focused:
    if: contains(github.event.head_commit.message, '[focused-provider-pressure-cert]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Root shared-governor regressions
        run: python -m unittest -v certification.tests.test_governor_method_pressure
      - name: Prepare exact lane trees
        run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/postrun-provider-pressure"
      - name: Pons adaptive public-log regressions
        working-directory: ${{ runner.temp }}/postrun-provider-pressure/pons
        run: |
          python -m unittest -v \
            robinhood_tests.test_public_log_429_adaptive \
            robinhood_tests.test_provider_topology \
            robinhood_tests.test_discovery_capacity
      - name: Verify pinned Pons diff identity
        working-directory: ${{ runner.temp }}/postrun-provider-pressure/pons
        run: |
          set -euo pipefail
          git diff --binary --full-index --no-ext-diff --no-textconv --no-renames HEAD > /tmp/pons.diff
          actual="$(sha256sum /tmp/pons.diff | awk '{print $1}')"
          test "$actual" = "d11bfe346004d8fc027d3344146e6c4962cab7485f1bcd3e68d60968c9fee143"
          git diff --check HEAD
