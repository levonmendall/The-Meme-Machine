name: inspect-postrun-pressure-context
on:
  push:
    branches: [repair/v10-postrun-provider-pressure-20260924]

permissions:
  contents: read

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[inspect-pons-429-context]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/pons-429-context"
      - name: Exact Pons 429 anchors
        run: |
          p="$RUNNER_TEMP/pons-429-context/pons"
          echo '=== provider 1-125 ==='
          sed -n '1,125p' "$p/robinhood_research/provider.py"
          echo '=== topology 125-190 ==='
          sed -n '125,190p' "$p/robinhood_research/provider_topology.py"
          echo '=== topology 360-480 ==='
          sed -n '360,480p' "$p/robinhood_research/provider_topology.py"
          echo '=== topology tests ==='
          grep -R -n 'ObservationFallbackRpc\|ProviderPacer' "$p/robinhood_tests" || true
