name: derive-pons-429-repair
on:
  push:
    branches: [repair/v10-postrun-provider-pressure-20260924]

permissions:
  contents: read

jobs:
  derive:
    if: contains(github.event.head_commit.message, '[derive-pons-429]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Prepare exact repaired runtime trees
        run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/pons-429-repair"
      - name: Focused Pons provider regressions
        working-directory: ${{ runner.temp }}/pons-429-repair/pons
        run: |
          python -m unittest -v \
            robinhood_tests.test_public_log_429_adaptive \
            robinhood_tests.test_provider_topology \
            robinhood_tests.test_discovery_capacity
      - name: Derive exact Pons source diff identity
        working-directory: ${{ runner.temp }}/pons-429-repair/pons
        run: |
          set -euo pipefail
          git diff --binary --full-index --no-ext-diff --no-textconv --no-renames HEAD > /tmp/pons.diff
          printf 'PONS_SOURCE_DIFF_SHA256='
          sha256sum /tmp/pons.diff | awk '{print $1}'
          git diff --check HEAD
