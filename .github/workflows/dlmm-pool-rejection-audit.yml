name: dlmm-pool-rejection-audit
on:
  push:
    branches:
      - research/dlmm-top-roi-wallet-evaluation
permissions:
  contents: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[dlmm-pool-audit]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Audit unchanged DLMM pool eligibility rules
        run: python -m tests.dlmm_pool_rejection_audit
      - name: Preserve pool rejection audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-pool-rejection-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: dlmm-pool-rejection-audit.json
          if-no-files-found: warn
          retention-days: 30
