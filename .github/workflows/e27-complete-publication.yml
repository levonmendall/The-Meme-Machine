name: E27 complete exact-source publication preparation
on:
  push:
    branches: [recovery/stagee25-github-native-publication-20260928]
    paths: ['.github/stagee27/complete-publication-trigger.txt']
permissions:
  contents: write
  actions: read
concurrency:
  group: e27-complete-publication
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: control
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: runtime
          ref: fdeee2721d2bb63e0ff3234328b06936257493b1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r runtime/requirements.txt
      - name: Prepare one reviewed candidate; no ref promotion and no dispatch
        working-directory: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$GITHUB_WORKSPACE/control/.github/stagee27/prepare_complete_candidate.py"
      - name: Preserve every preflight result and exact candidate package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e27-complete-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e27-complete-publication/
          if-no-files-found: error
          retention-days: 90
