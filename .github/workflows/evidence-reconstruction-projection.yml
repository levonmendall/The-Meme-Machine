name: evidence-reconstruction-projection
on:
  push:
    branches: [repair/evidence-reconstruction-20260924]
permissions:
  contents: read
  actions: read
jobs:
  project:
    if: contains(github.event.head_commit.message, '[reconstruction-projection]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Project completed immutable evidence without market access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m certification.reconstruction_artifact_projection
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reconstruction-projection-${{ github.run_id }}
          path: reconstruction-projection/
          if-no-files-found: error
          retention-days: 90
