name: v9-launch-guard-diagnostic
on:
  push:
    branches: [repair/v9-launch-guard-reauthorization-20260924]
permissions:
  contents: read
jobs:
  test:
    if: contains(github.event.head_commit.message, '[v9-guard-test]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Guard and one-shot regression
        run: >-
          python -m unittest
          certification.tests.test_guard
          certification.tests.test_single_campaign_control -v
      - name: Frozen protocol authority
        run: python -m certification.protocol_freeze --output v9-guard-protocol-freeze.json
