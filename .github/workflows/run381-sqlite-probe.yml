name: Run 381 focused SQLite and maintenance repair
on:
  push:
    branches: [analysis/run381-sqlite-lifetime-20260927]
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.txt
      - name: Prove preserved implementations fail by assertion, not setup errors
        run: |
          python -m py_compile tests/test_run381_retention_progress.py tests/test_run381_maintenance_overlap.py
          git show 674b4a1e8efb9576c31f4815b57fce395706369d:meme_machine/solana_evidence_plane.py > meme_machine/solana_evidence_plane.py
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.loadTestsFromName('tests.test_run381_retention_progress.RetentionProgressTests.test_interrupted_begin_cannot_leave_an_open_write_transaction')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun==1 and len(result.failures)==1 and not result.errors, 'expected exactly one behavioral assertion failure'
          PY
          git restore --source=HEAD -- meme_machine/solana_evidence_plane.py
          git show 674b4a1e8efb9576c31f4815b57fce395706369d:meme_machine/solana_evidence_service.py > meme_machine/solana_evidence_service.py
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.loadTestsFromName('tests.test_run381_maintenance_overlap')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun==1 and len(result.failures)==1 and not result.errors, 'expected exactly one behavioral assertion failure'
          PY
          git restore --source=HEAD -- meme_machine/solana_evidence_service.py
      - name: Repaired deterministic regressions and interruption matrix
        run: |
          python -m unittest tests.test_run381_retention_progress tests.test_run381_repair_pagination tests.test_run381_maintenance_overlap tests.test_run379_production_pressure -q
          python -m certification.run381_sqlite_probe
