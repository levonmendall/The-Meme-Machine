name: Run 381 focused integration bindings
on:
  push:
    branches: [analysis/run381-sqlite-lifetime-20260927]
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.txt
      - name: Readiness and full-certificate regression gates
        run: python -m unittest certification.tests.test_final_acceptance certification.tests.test_run381_storage_readiness -v
      - name: Verify exact composed source and frozen six-regime policy bindings
        run: |
          python -m certification.run prepare --worktrees "$RUNNER_TEMP/run381-integrated" > "$RUNNER_TEMP/run381-prepare.log" 2>&1
          python - <<'PY'
          import json,os
          from pathlib import Path
          from certification.run import source_integrity
          print('VERIFIED_SOURCE_IDENTITIES',json.dumps(source_integrity(Path(os.environ['RUNNER_TEMP'])/'run381-integrated'),sort_keys=True))
          PY
          python -m certification.protocol_freeze --output "$RUNNER_TEMP/run381-protocol.json"
