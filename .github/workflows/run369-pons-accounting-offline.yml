name: Run 369 Pons accounting offline certification
on:
  push:
    branches: [repair/run369-pons-accounting-20260925]
permissions:
  contents: read
jobs:
  certify-accounting-offline:
    if: contains(github.event.head_commit.message, '[run369-pons-accounting-cert]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/accounting-lanes"
      - name: Root deterministic suite and resource bounds
        run: |
          mkdir -p accounting-certification
          set -o pipefail
          python -m unittest discover -v 2>&1 | tee accounting-certification/root.log
          python -m tests.resource_check > accounting-certification/root-resource.json
      - name: Supervisor and accounting with prepared lane sources
        env:
          MM_TEST_LANE_WORKTREES: ${{ runner.temp }}/accounting-lanes
        run: |
          set -o pipefail
          python -m unittest discover -s certification/tests -v 2>&1 | tee accounting-certification/supervisor.log
      - name: Full deterministic non-market certification
        run: python -m certification.robinhood.certify --worktrees "$RUNNER_TEMP/accounting-lanes" --output accounting-certification/full
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: run369-pons-accounting-offline
          path: accounting-certification/
          if-no-files-found: error
          retention-days: 90
# No secrets, external provider probes, market entrypoints, deployment or dispatch.
