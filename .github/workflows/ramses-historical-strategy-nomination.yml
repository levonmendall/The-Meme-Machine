name: ramses-historical-strategy-nomination
on:
  push:
    branches: [research/ramses-dlmm-historical-market-v1]
permissions:
  actions: read
  contents: read
jobs:
  nominate:
    if: contains(github.event.head_commit.message, '[ramses-nominate]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Download latest complete Ramses index artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_id="$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100"             --jq '.artifacts[] | select(.expired == false and (.name | startswith("ramses-historical-index-"))) | [.created_at, (.id|tostring)] | @tsv'             | sort -r | head -1 | cut -f2)"
          test -n "$artifact_id"
          gh api "repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" > /tmp/index.zip
          mkdir -p /tmp/index
          unzip -q /tmp/index.zip -d /tmp/index
          cp /tmp/index/ramses-historical-index-data.json.gz .
          cp /tmp/index/ramses-historical-index-summary.json .
          echo "RAMSES_INDEX_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
      - run: python -m py_compile robinhood_research/ramses_historical_strategy_nomination.py
      - run: python -m robinhood_research.ramses_historical_strategy_nomination
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ramses-historical-nominations-${{ github.run_id }}
          path: |
            ramses-historical-strategy-nominations.json
            ramses-historical-index-summary.json
          if-no-files-found: error
          retention-days: 90
