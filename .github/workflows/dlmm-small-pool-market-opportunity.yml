name: dlmm-small-pool-market-opportunity
on:
  push:
    branches:
      - research/dlmm-small-pool-profitability
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dlmm-small-pool-market]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Wallet-independent market-study regression gate
        run: python -m unittest tests.test_dlmm_small_pool_market_opportunity -v
      - name: Restore volatility checkpoint when snapshot-compatible
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: dlmm-small-pool-market-*
          path: /tmp/prior
          merge-multiple: true
      - name: Reuse prior checkpoint only if exact snapshot signature matches later
        run: |
          candidate="$(find /tmp/prior -name dlmm-small-pool-market-volatility-checkpoint.json -type f -print -quit 2>/dev/null || true)"
          if [ -n "$candidate" ]; then
            cp "$candidate" dlmm-small-pool-market-volatility-checkpoint.json
          fi
      - name: Run wallet-independent TVL / age / volatility opportunity study
        run: python -m tests.dlmm_small_pool_market_opportunity
      - name: Preserve pool-first study
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-small-pool-market-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dlmm-small-pool-market-opportunity.json
            dlmm-small-pool-market-volatility-checkpoint.json
          if-no-files-found: warn
          retention-days: 90
