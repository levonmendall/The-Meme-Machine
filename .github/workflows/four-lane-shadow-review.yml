name: four-lane-shadow-review
on:
  push:
    branches: [research/four-lane-shadow-registration, cert/four-lane-capacity-v2, repair/four-lane-acquisition]
permissions:
  actions: read
  contents: read
jobs:
  inspect-retained-failure:
    if: contains(github.event.head_commit.message, '[shadow-evidence]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Research and reporting regressions
        run: python -m unittest discover -s certification/tests -v
      - name: Score retained observations without market access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m certification.review_retained --artifact-id 10598344530 --sha256 987bf96aea3917717ae6f93b1bb5e45de84e86cd1fdf5892553adaa152971f31 --output retained-analysis
      - name: Preserve full source telemetry and separate research results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retained-four-lane-analysis-${{ github.run_id }}
          path: retained-analysis/
          if-no-files-found: error
          retention-days: 90
