name: Pons event-driven PAPER offline proof
on:
  push:
    branches: [testing/pons-event-paper-20261009]
permissions:
  contents: read
jobs:
  pons-event-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.txt
      - name: New event-coverage and PAPER shadow tests
        run: python -m unittest -v tests.test_pons_held_quote_wakeup tests.test_pons_held_paper_shadow
      - name: Pons current and Survivor native risk regression
        run: python -m unittest -v tests.lanes.pons.test_pons_selective_continuation tests.lanes.pons.test_pons_postgrad_survivor tests.lanes.pons.test_pons_finalization tests.test_exceptional_winner_candidate
