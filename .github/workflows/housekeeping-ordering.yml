name: Housekeeping ordering tests and final matched pair (PAPER only)
on:
  push:
    branches: [diagnostics/housekeeping-ordering-20261001]
    paths: ['diagnostics/housekeeping-ordering/execution-request.json']
permissions:
  contents: read
concurrency:
  group: housekeeping-ordering-one-pair
  cancel-in-progress: false
jobs:
  matched-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
      MM_REAL_IPC_TESTS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Static prefix, unchanged source and historical evidence verification
        run: |
          python -m py_compile diagnostics/housekeeping-ordering/harness.py diagnostics/housekeeping-ordering/prepare.py diagnostics/housekeeping-ordering/check.py diagnostics/housekeeping-ordering/pair.py diagnostics/housekeeping-ordering/analyze.py diagnostics/housekeeping-ordering/test_housekeeping_ordering.py
          python diagnostics/housekeeping-ordering/prepare.py --root "$RUNNER_TEMP/housekeeping-ordering"
      - name: Focused deterministic safety and regression gate
        run: python diagnostics/housekeeping-ordering/check.py --root "$RUNNER_TEMP/housekeeping-ordering"
      - name: One matched .165 control then treatment only after passing tests
        run: python diagnostics/housekeeping-ordering/pair.py --root "$RUNNER_TEMP/housekeeping-ordering"
      - name: Analyze captured obligations and timing, then hard stop
        if: always()
        run: python diagnostics/housekeeping-ordering/analyze.py --root "$RUNNER_TEMP/housekeeping-ordering"
      - name: Preserve complete bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: housekeeping-ordering-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/housekeeping-ordering/
            !${{ runner.temp }}/housekeeping-ordering/**/runtime/**
            !${{ runner.temp }}/housekeeping-ordering/worktrees/**
          if-no-files-found: error
          retention-days: 90
