name: evidence-completion-repair-validation
on:
  push:
    branches: [repair/evidence-completion-bottlenecks-20260921]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Supervisor regressions
        run: python -m unittest discover -s certification/tests -v
      - name: Prepare exact repaired lane worktrees
        run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/evidence-completion-worktrees"
      - name: Emit exact overlay blob hashes
        run: |
          for lane in pump meteora pons ramses; do
            echo "OVERLAY_INDEX_BEGIN $lane"
            git -C "$RUNNER_TEMP/evidence-completion-worktrees/$lane" diff --binary HEAD | grep -E '^(diff --git|index )' || true
            echo "OVERLAY_INDEX_END $lane"
          done
      - name: Full deterministic lane suites and resource gates
        run: python -m certification.run verify --worktrees "$RUNNER_TEMP/evidence-completion-worktrees" --output certification-gates
