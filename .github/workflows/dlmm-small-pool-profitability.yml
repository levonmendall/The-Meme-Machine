name: dlmm-small-pool-profitability
on:
  push:
    branches:
      - research/dlmm-small-pool-profitability
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  screen:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dlmm-small-pool-study]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Small-pool regression gate
        run: python -m unittest tests.test_dlmm_small_pool_profitability -v
      - name: Restore prior compatible screen checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f dlmm-small-pool-screen-checkpoint.json
          mapfile -t ids < <(
            gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false and (.name | startswith("dlmm-small-pool-screen-"))) | [.created_at, (.id|tostring)] | @tsv' \
              | sort -r | cut -f2
          )
          for id in "${ids[@]}"; do
            rm -rf /tmp/small-pool-screen && mkdir -p /tmp/small-pool-screen
            if gh api "repos/${{ github.repository }}/actions/artifacts/${id}/zip" > /tmp/small-pool-screen.zip \
                && unzip -q /tmp/small-pool-screen.zip -d /tmp/small-pool-screen; then
              candidate="$(find /tmp/small-pool-screen -name dlmm-small-pool-screen-checkpoint.json -type f -print -quit)"
              if [ -n "$candidate" ]; then
                cp "$candidate" dlmm-small-pool-screen-checkpoint.json
                echo "Restored screen checkpoint from artifact ${id}"
                break
              fi
            fi
          done
      - name: Screen frozen 200-wallet cohort at reduced Meteora rate
        run: python -m tests.dlmm_small_pool_screen
      - name: Preserve small-pool screen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-small-pool-screen-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dlmm-small-pool-screen.json
            dlmm-small-pool-screen-checkpoint.json
          if-no-files-found: warn
          retention-days: 90

  context:
    needs: screen
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
      DLMM_SMALL_POOL_WORKERS: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Download this run's frozen-cohort screen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "${GITHUB_RUN_ID}" \
            -n "dlmm-small-pool-screen-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -D .
      - name: Restore latest complete profitable-operator artifacts
        id: operator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          found=0
          mapfile -t ids < <(
            gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false and (.name | startswith("dlmm-profitable-operator-ranking-"))) | [.created_at, (.id|tostring)] | @tsv' \
              | sort -r | cut -f2
          )
          for id in "${ids[@]}"; do
            rm -rf /tmp/operator-artifact && mkdir -p /tmp/operator-artifact
            if ! gh api "repos/${{ github.repository }}/actions/artifacts/${id}/zip" > /tmp/operator.zip; then
              continue
            fi
            if ! unzip -q /tmp/operator.zip -d /tmp/operator-artifact; then
              continue
            fi
            ranking="$(find /tmp/operator-artifact -name dlmm-profitable-operator-ranking.json -type f -print -quit)"
            deep="$(find /tmp/operator-artifact -name dlmm-profitable-operator-deep-reconstruction.json -type f -print -quit)"
            if [ -z "$ranking" ] || [ -z "$deep" ]; then
              continue
            fi
            cp "$ranking" dlmm-profitable-operator-ranking.json
            cp "$deep" dlmm-profitable-operator-deep-reconstruction.json
            if python - <<'PY'
          import json
          cohort="0f03841ae3f54d2a7cc93567c430e7349b0282a5e13da2fa238975a43405da6b"
          r=json.load(open("dlmm-profitable-operator-ranking.json"))
          d=json.load(open("dlmm-profitable-operator-deep-reconstruction.json"))
          assert r.get("kind")=="dlmm_profitable_operator_ranking_v1"
          assert d.get("kind")=="dlmm_profitable_operator_deep_reconstruction_v1"
          assert r.get("cohort_hash")==cohort==d.get("cohort_hash")
          assert d.get("status")=="deep_reconstruction_complete_rule_derivation_not_yet_frozen"
          PY
            then
              echo "Using complete operator artifact ${id}"
              found=1
              break
            fi
          done
          echo "found=${found}" >> "$GITHUB_OUTPUT"
      - name: Restore prior TVL-context checkpoint
        if: steps.operator.outputs.found == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f dlmm-small-pool-profitability-checkpoint.json
          mapfile -t ids < <(
            gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false and (.name | startswith("dlmm-small-pool-profitability-"))) | [.created_at, (.id|tostring)] | @tsv' \
              | sort -r | cut -f2
          )
          for id in "${ids[@]}"; do
            rm -rf /tmp/small-pool-context && mkdir -p /tmp/small-pool-context
            if gh api "repos/${{ github.repository }}/actions/artifacts/${id}/zip" > /tmp/small-pool-context.zip \
                && unzip -q /tmp/small-pool-context.zip -d /tmp/small-pool-context; then
              candidate="$(find /tmp/small-pool-context -name dlmm-small-pool-profitability-checkpoint.json -type f -print -quit)"
              if [ -n "$candidate" ]; then
                cp "$candidate" dlmm-small-pool-profitability-checkpoint.json
                break
              fi
            fi
          done
      - name: Validate direct Alchemy topology
        if: steps.operator.outputs.found == '1'
        run: python -m tests.dlmm_alchemy_provider
      - name: Reconstruct entry TVL and stratify final profitable operators
        if: steps.operator.outputs.found == '1'
        run: |
          python -m tests.dlmm_small_pool_profitability \
            --ranking dlmm-profitable-operator-ranking.json \
            --deep dlmm-profitable-operator-deep-reconstruction.json
      - name: Record pending final operator artifact
        if: steps.operator.outputs.found != '1'
        run: |
          python - <<'PY'
          import json
          screen=json.load(open("dlmm-small-pool-screen.json"))
          body={
            "kind":"dlmm_small_pool_profitability_study_v1",
            "status":"screen_complete_waiting_for_final_after_cost_operator_artifact",
            "cohort_hash":screen["cohort_hash"],
            "provisional_eligible_wallet_count":screen["provisional_eligible_wallet_count"],
            "current_50000_tvl_execution_gate_changed":False,
            "note":"No complete deep profitable-operator artifact was available; entry-TVL outcome comparison was not guessed or run on provisional labels."
          }
          open("dlmm-small-pool-profitability.json","w").write(json.dumps(body,indent=2)+"\n")
          print(json.dumps(body,sort_keys=True))
          PY
      - name: Preserve small-pool study
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-small-pool-profitability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dlmm-small-pool-profitability.json
            dlmm-small-pool-profitability-checkpoint.json
            dlmm-small-pool-screen.json
          if-no-files-found: warn
          retention-days: 90
