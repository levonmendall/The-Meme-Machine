name: dlmm-small-pool-profitability
on:
  push:
    branches:
      - research/dlmm-small-pool-profitability
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  screen:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dlmm-small-pool-study]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Small-pool regression gate
        run: python -m unittest tests.test_dlmm_small_pool_profitability -v
      - name: Restore prior screen checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f dlmm-small-pool-screen-checkpoint.json
          mapfile -t ids < <(
            gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false and (.name | startswith("dlmm-small-pool-screen-"))) | [.created_at, (.id|tostring)] | @tsv' \
              | sort -r | cut -f2
          )
          for id in "${ids[@]}"; do
            rm -rf /tmp/small-pool-screen && mkdir -p /tmp/small-pool-screen
            if gh api "repos/${{ github.repository }}/actions/artifacts/${id}/zip" > /tmp/small-pool-screen.zip \
                && unzip -q /tmp/small-pool-screen.zip -d /tmp/small-pool-screen; then
              candidate="$(find /tmp/small-pool-screen -name dlmm-small-pool-screen-checkpoint.json -type f -print -quit)"
              if [ -n "$candidate" ]; then
                cp "$candidate" dlmm-small-pool-screen-checkpoint.json
                break
              fi
            fi
          done
      - name: Screen frozen cohort for gross-profitable operators
        run: python -m tests.dlmm_small_pool_screen
      - name: Preserve small-pool screen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-small-pool-screen-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dlmm-small-pool-screen.json
            dlmm-small-pool-screen-checkpoint.json
          if-no-files-found: warn
          retention-days: 90

  context:
    needs: screen
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
      DLMM_SMALL_POOL_WORKERS: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Download this run's independent screen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${GITHUB_RUN_ID}" \
            -n "dlmm-small-pool-screen-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -D .
      - name: Restore prior TVL-context checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f dlmm-small-pool-profitability-checkpoint.json
          mapfile -t ids < <(
            gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false and (.name | startswith("dlmm-small-pool-profitability-"))) | [.created_at, (.id|tostring)] | @tsv' \
              | sort -r | cut -f2
          )
          for id in "${ids[@]}"; do
            rm -rf /tmp/small-pool-context && mkdir -p /tmp/small-pool-context
            if gh api "repos/${{ github.repository }}/actions/artifacts/${id}/zip" > /tmp/small-pool-context.zip \
                && unzip -q /tmp/small-pool-context.zip -d /tmp/small-pool-context; then
              candidate="$(find /tmp/small-pool-context -name dlmm-small-pool-profitability-checkpoint.json -type f -print -quit)"
              if [ -n "$candidate" ]; then
                cp "$candidate" dlmm-small-pool-profitability-checkpoint.json
                break
              fi
            fi
          done
      - name: Small-pool regression gate
        run: python -m unittest tests.test_dlmm_small_pool_profitability -v
      - name: Validate direct Alchemy topology
        run: python -m tests.dlmm_alchemy_provider
      - name: Reconstruct entry TVL, age and volatility independently
        run: python -m tests.dlmm_small_pool_profitability --screen dlmm-small-pool-screen.json
      - name: Preserve independent small-pool study
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-small-pool-profitability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dlmm-small-pool-profitability.json
            dlmm-small-pool-profitability-checkpoint.json
            dlmm-small-pool-screen.json
          if-no-files-found: warn
          retention-days: 90
