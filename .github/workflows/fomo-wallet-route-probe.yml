name: fomo-wallet-route-probe
on:
  push:
    branches: [research/fomo-top-wallet-lifecycle-study]
permissions:
  contents: read
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[wallet-route-probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FOMOAPI_KEY: ${{ secrets.FOMOAPI_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - run: python -m tests.fomo_wallet_route_probe | tee fomo-wallet-route-probe.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fomo-wallet-route-probe-${{ github.run_id }}
          path: |
            fomo-wallet-route-probe.json
            fomo-wallet-route-probe.log
          retention-days: 7
