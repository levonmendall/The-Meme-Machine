name: lifecycle-clock-certification
on:
  push:
    branches: [repair/lifecycle-clock-decoupling-20260923]
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Integration timing and continuation tests
        run: |
          python -m py_compile certification/lifecycle_timing.py certification/position_continuation.py certification/worker.py certification/run.py
          python -m unittest discover -s certification/tests -v
      - name: Prepare exact four-lane composition
        run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/lifecycle-clock-worktrees"
      - name: Full deterministic four-lane verification
        run: python -m certification.run verify --worktrees "$RUNNER_TEMP/lifecycle-clock-worktrees" --output lifecycle-clock-gates
      - name: Preserve deterministic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifecycle-clock-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: lifecycle-clock-gates/
          if-no-files-found: warn
          retention-days: 90
