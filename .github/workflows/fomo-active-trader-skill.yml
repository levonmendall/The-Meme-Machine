name: fomo-active-trader-skill
on:
  push:
    branches: [research/fomo-active-trader-skill]
permissions:
  contents: read
jobs:
  audit:
    if: contains(github.event.head_commit.message, '[fomo-skill-pilot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      FOMOAPI_KEY: ${{ secrets.FOMOAPI_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - name: Audit active FOMO trader realized outcomes
        run: set -o pipefail; python -m tests.fomo_active_trader_skill | tee fomo-active-trader-skill.log
      - name: Preserve report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fomo-active-trader-skill-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fomo-active-trader-skill.json
            fomo-active-trader-skill.log
          if-no-files-found: warn
          retention-days: 30
