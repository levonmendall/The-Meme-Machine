name: E22 bounded retention service qualification and canonical promotion
on:
  push:
    branches: [review/stagee-coordinated-20260928]
permissions:
  contents: read
  actions: read
concurrency:
  group: stagee-coordinated-review
  cancel-in-progress: false
env:
  AUTHORING_BASE: 4e08bd2a3d00a61f1313650bb48fb1955905a3d6
  REVIEWED_BASE: 23f06ed84e5b5e2d4efd074618ab44ae7ed58011
  PLAN_SHA256: 268849f509d1f81ae61571dcf870ea0eb46683cc742b6bd96051df49986d82f3
jobs:
  bind-operational-identities:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      runtime: ${{ steps.publish.outputs.runtime }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4e08bd2a3d00a61f1313650bb48fb1955905a3d6
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Refresh only operational source identities against reviewed baseline
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$AUTHORING_BASE"
          python -c 'import os; from certification.cleanup_recovery import frozen_inputs,plan_hash; assert frozen_inputs(); assert plan_hash()==os.environ["PLAN_SHA256"]'
          git worktree add --detach "$RUNNER_TEMP/reviewed-base" "$REVIEWED_BASE"
          (cd "$RUNNER_TEMP/reviewed-base" && python -m certification.run prepare --worktrees "$RUNNER_TEMP/baseline-lanes") > evidence/baseline-prepare.log 2>&1
          python -m certification.run prepare --worktrees "$RUNNER_TEMP/candidate-lanes" > evidence/candidate-prepare-before-refresh.log 2>&1
          python -m certification.build_consistency refresh \
            --worktrees "$RUNNER_TEMP/candidate-lanes" \
            --baseline-worktrees "$RUNNER_TEMP/baseline-lanes" \
            --output evidence/refresh.json
          python - <<'PY'
          import json,subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed=={'certification/sources.json','certification/profitability_protocol.json'}, changed
          row=json.load(open('evidence/refresh.json'))
          assert row['passed'] is True and row['policies_changed'] is False
          PY
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git add certification/sources.json certification/profitability_protocol.json
          git commit -m "Rebind operational identities for bounded retention service grant"
      - name: Verify complete committed candidate before publication
        id: publish
        run: |
          set -euo pipefail
          RUNTIME="$(git rev-parse HEAD)"
          test "$(git show -s --format=%P "$RUNTIME")" = "$AUTHORING_BASE"
          rm -rf "$RUNNER_TEMP/verify-lanes"
          python -m certification.run prepare --worktrees "$RUNNER_TEMP/verify-lanes" > evidence/candidate-prepare-after-refresh.log 2>&1
          python -m certification.build_consistency verify --worktrees "$RUNNER_TEMP/verify-lanes" --expected-sha "$RUNTIME" --output evidence/build-preflight.json
          git diff --exit-code HEAD
          git push origin "$RUNTIME:refs/heads/repair/stagee22-retention-service-grant-20260928"
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$RUNTIME" > evidence/runtime-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e22-service-authoring-${{ github.run_id }}
          path: evidence/
          retention-days: 90
          if-no-files-found: error

  focused-preflight:
    needs: bind-operational-identities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_RUNTIME: ${{ needs.bind-operational-identities.outputs.runtime }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.bind-operational-identities.outputs.runtime }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify assembled identity and bounded-service regressions
        env:
          MM_TEST_LANE_WORKTREES: ${{ runner.temp }}/e22-lanes
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_RUNTIME"
          python -c 'import os; from certification.cleanup_recovery import frozen_inputs,plan_hash; assert frozen_inputs(); assert plan_hash()==os.environ["PLAN_SHA256"]'
          python -m certification.run prepare --worktrees "$RUNNER_TEMP/e22-lanes" > evidence/prepare.log 2>&1
          python -m certification.build_consistency verify --worktrees "$RUNNER_TEMP/e22-lanes" --expected-sha "$EXPECTED_RUNTIME" --output evidence/build-preflight.json
          python -m unittest -v \
            tests.test_stagee21_retention_access_path \
            tests.test_run381_retention_progress \
            tests.test_run381_maintenance_overlap \
            tests.test_run381_archive_scheduling \
            tests.test_run381_archive_canonical \
            tests.test_solana_evidence_retention \
            tests.test_checkpoint_handoff \
            tests.test_archive_pipeline \
            tests.test_run379_transport_backpressure \
            tests.test_stagee19_maintenance_batch_fairness \
            certification.tests.test_build_consistency \
            certification.tests.test_cleanup_recovery \
            certification.tests.test_autonomous_policy_preservation \
            certification.tests.test_combined_pressure \
            certification.tests.test_final_acceptance > evidence/focused.log 2>&1
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e22-service-preflight-${{ github.run_id }}
          path: evidence/
          retention-days: 90
          if-no-files-found: error

  fixed-trial:
    needs: [bind-operational-identities, focused-preflight]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        trial: [combined-1, combined-2, combined-3, recovery-1]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_RUNTIME: ${{ needs.bind-operational-identities.outputs.runtime }}
      TRIAL: ${{ matrix.trial }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.bind-operational-identities.outputs.runtime }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Fresh-runner identity and frozen-plan verification
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EXPECTED_RUNTIME"
          python -c 'import os; from certification.cleanup_recovery import frozen_inputs,plan_hash; assert frozen_inputs(); assert plan_hash()==os.environ["PLAN_SHA256"]'
          python -m certification.run prepare --worktrees "$RUNNER_TEMP/e22-lanes" > evidence/prepare.log 2>&1
          python -m certification.build_consistency verify --worktrees "$RUNNER_TEMP/e22-lanes" --expected-sha "$EXPECTED_RUNTIME" --output evidence/build-preflight.json
      - name: Execute exactly one preregistered trial without retry
        run: |
          set +e
          python -u -m certification.cleanup_recovery --trial "$TRIAL" --output "evidence/$TRIAL" > "evidence/$TRIAL.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "evidence/$TRIAL-exit-code.txt"
          test "$(git rev-parse HEAD)" = "$EXPECTED_RUNTIME"
          git diff --exit-code HEAD
          if [ -f "evidence/$TRIAL/trial.json" ]; then cat "evidence/$TRIAL/trial.json"; fi
          if [ -f "evidence/$TRIAL.log" ]; then tail -n 3 "evidence/$TRIAL.log"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e22-service-${{ matrix.trial }}-${{ github.run_id }}
          path: evidence/
          retention-days: 90
          if-no-files-found: error

  fixed-cohort-acceptance:
    needs: [bind-operational-identities, fixed-trial]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPECTED_RUNTIME: ${{ needs.bind-operational-identities.outputs.runtime }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.bind-operational-identities.outputs.runtime }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: e22-service-*
          path: ${{ runner.temp }}/fixed-artifacts
      - name: Aggregate every fixed trial; require all four
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m certification.cleanup_recovery \
            --aggregate "$RUNNER_TEMP/fixed-artifacts" \
            --expected-sha "$EXPECTED_RUNTIME" \
            --output evidence/fixed-cohort.json
          python - <<'PY'
          import json
          row=json.load(open('evidence/fixed-cohort.json'))
          assert row['passed'] is True
          assert len(row['trials'])==4 and all(x['passed'] for x in row['trials'])
          print(json.dumps(row,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e22-service-fixed-acceptance-${{ github.run_id }}
          path: evidence/
          retention-days: 90
          if-no-files-found: error

  complete-verification:
    needs: [bind-operational-identities, fixed-cohort-acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_RUNTIME: ${{ needs.bind-operational-identities.outputs.runtime }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.bind-operational-identities.outputs.runtime }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Full generic deterministic suite
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m unittest discover -v > evidence/generic.log 2>&1
      - name: Complete native and six-regime verification
        env:
          MM_TEST_LANE_WORKTREES: ${{ runner.temp }}/final-lanes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_RUNTIME"
          python -m certification.run prepare --worktrees "$RUNNER_TEMP/final-lanes" > evidence/prepare.log 2>&1
          python -m certification.build_consistency verify --worktrees "$RUNNER_TEMP/final-lanes" --expected-sha "$EXPECTED_RUNTIME" --output evidence/build-preflight.json
          python -m certification.non_market --worktrees "$RUNNER_TEMP/final-lanes" --output evidence/native > evidence/native.log 2>&1
          python -m certification.directional_acceptance --worktrees "$RUNNER_TEMP/final-lanes" --output evidence/six-regime
          python -m certification.build_consistency verify --worktrees "$RUNNER_TEMP/final-lanes" --expected-sha "$EXPECTED_RUNTIME" --output evidence/final-build-preflight.json
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e22-service-complete-verification-${{ github.run_id }}
          path: evidence/
          retention-days: 90
          if-no-files-found: error

  canonical-promotion:
    needs: [bind-operational-identities, complete-verification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      EXPECTED_RUNTIME: ${{ needs.bind-operational-identities.outputs.runtime }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.bind-operational-identities.outputs.runtime }}
          fetch-depth: 0
          persist-credentials: true
      - name: Publish exact verified tree to canonical Phase E branch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_RUNTIME"
          git diff --exit-code HEAD
          git fetch origin refs/heads/cert/autonomous-paper-machinery-20260927
          CERT_PARENT="$(git rev-parse FETCH_HEAD)"
          TREE="$(git rev-parse "$EXPECTED_RUNTIME^{tree}")"
          git config user.name OpenAI
          git config user.email noreply@openai.com
          CERT_SHA="$(printf '%s\n' '[non-market-cert] Certify bounded retention service after fixed-cohort recovery proof' | git commit-tree "$TREE" -p "$CERT_PARENT" -p "$EXPECTED_RUNTIME")"
          test "$(git rev-parse "$CERT_SHA^{tree}")" = "$TREE"
          test "$(git show -s --format=%P "$CERT_SHA")" = "$CERT_PARENT $EXPECTED_RUNTIME"
          git push origin "$CERT_SHA:refs/heads/cert/autonomous-paper-machinery-20260927"
          printf 'runtime=%s\ncanonical=%s\nparent=%s\n' "$EXPECTED_RUNTIME" "$CERT_SHA" "$CERT_PARENT"
