name: Coordinated Stage E repair and interaction proof
on:
  push:
    branches: [review/stagee-coordinated-20260928]
permissions:
  contents: read
concurrency:
  group: stagee-coordinated-review
  cancel-in-progress: false
jobs:
  source-preservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: df11d7eedf6a8d6f4d2f2f60372c5f065dedcb90
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact source and pinned lane history without execution
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = df11d7eedf6a8d6f4d2f2f60372c5f065dedcb90
          mkdir -p /tmp/stagee-source
          git bundle create /tmp/stagee-source/runtime.bundle --all
          git bundle verify /tmp/stagee-source/runtime.bundle
          git rev-parse HEAD > /tmp/stagee-source/runtime-sha.txt
          sha256sum /tmp/stagee-source/runtime.bundle > /tmp/stagee-source/bundle.sha256
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stagee-source-df11d7ee
          path: /tmp/stagee-source/
          retention-days: 90
          if-no-files-found: error
