name: E22 exact-source preservation
on:
  push:
    branches: [review/stagee-coordinated-20260928]
permissions:
  contents: read
concurrency:
  group: stagee-coordinated-review
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3b5c56b724c23f2ce3f8ef4a7e9fe63c6bf129e1
          fetch-depth: 0
          persist-credentials: false
      - name: Export reviewed predecessor without execution or mutation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3b5c56b724c23f2ce3f8ef4a7e9fe63c6bf129e1
          mkdir -p /tmp/e22-source
          git bundle create /tmp/e22-source/runtime.bundle --all HEAD
          git bundle verify /tmp/e22-source/runtime.bundle
          git rev-parse HEAD > /tmp/e22-source/runtime-sha.txt
          sha256sum /tmp/e22-source/runtime.bundle > /tmp/e22-source/bundle.sha256
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e22-source-3b5c56b7
          path: /tmp/e22-source/
          retention-days: 90
          if-no-files-found: error
