name: Coordinated Stage E repair and interaction proof
on:
  push:
    branches: [review/stagee-coordinated-20260928]
permissions:
  contents: read
concurrency:
  group: stagee-coordinated-review
  cancel-in-progress: false
env:
  EXPECTED_RUNTIME: a4ce08bb19cc01f315bd64f6dd90004fa17243d9
jobs:
  publish-reviewed-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: df11d7eedf6a8d6f4d2f2f60372c5f065dedcb90
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact reviewed Git objects and publish one atomic repair commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          parts=('fae413fe6c0bc9dc4662c453c5706255beca126d','dc32b5cfffe05a0e96a59a0616945b82f953882f','7c8413ec77abbf6a76019d31ec5fbd46adf2f9ef')
          data=b''
          for sha in parts:
              request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:row=json.load(response)
              assert row['encoding']=='base64'
              part=base64.b64decode(row['content'])
              assert hashlib.sha1(b'blob '+str(len(part)).encode()+b'\0'+part).hexdigest()==sha
              data+=part
          assert len(data)==8627
          assert hashlib.sha256(data).hexdigest()=='5a5a4d087946192119626ec6b313896b93769432dd15f138ae24fb710cf8e8f0'
          Path('/tmp/checkpoint-repair.bundle').write_bytes(data)
          PY
          git bundle verify /tmp/checkpoint-repair.bundle
          git fetch /tmp/checkpoint-repair.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_RUNTIME"
          test "$(git show -s --format=%P "$EXPECTED_RUNTIME")" = df11d7eedf6a8d6f4d2f2f60372c5f065dedcb90
          test "$(git rev-parse "$EXPECTED_RUNTIME^{tree}")" = 6468452c2c6c2d56f383f4a4cfa6237fe2dd2ac7
          test "$(git ls-remote origin refs/heads/repair/stagee19-batch-maintenance-fairness-20260928 | cut -f1)" = df11d7eedf6a8d6f4d2f2f60372c5f065dedcb90
          git diff --stat df11d7eedf6a8d6f4d2f2f60372c5f065dedcb90 "$EXPECTED_RUNTIME"
          git push origin "$EXPECTED_RUNTIME:refs/heads/repair/stagee19-batch-maintenance-fairness-20260928"
  focused-proof:
    needs: publish-reviewed-source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a4ce08bb19cc01f315bd64f6dd90004fa17243d9
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify the already-published exact candidate before expensive gates
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_RUNTIME"
          git rev-parse HEAD > evidence/runtime-sha.txt
          python -c 'import sys,sqlite3,websockets; print(sys.version,sqlite3.sqlite_version,websockets.__version__)' > evidence/runtime-versions.txt
          python -m certification.run prepare --worktrees "$RUNNER_TEMP/stagee-candidate-lanes" > evidence/candidate-prepare.log 2>&1
          python -m certification.build_consistency verify --worktrees "$RUNNER_TEMP/stagee-candidate-lanes" --expected-sha "$EXPECTED_RUNTIME" --output evidence/build-preflight.json
      - name: Compare actual old and new SQLite archive methods
        run: python -m certification.archive_snapshot_probe --output evidence/archive-snapshot-proof.json > evidence/archive-snapshot-proof.log 2>&1
      - name: Coupled machinery checkpoint-liveness and build-rejection regressions
        env:
          MM_TEST_LANE_WORKTREES: ${{ runner.temp }}/stagee-candidate-lanes
        run: |
          python -m unittest -v tests.test_checkpoint_handoff tests.test_coordinated_database tests.test_run381_retention_progress tests.test_run381_maintenance_overlap tests.test_run381_archive_scheduling tests.test_run381_archive_canonical tests.test_solana_evidence_retention tests.test_run379_transport_backpressure tests.test_stagee19_maintenance_batch_fairness tests.test_run373_dispatch_throughput.Run373DispatchThroughputTests.test_run375_commit_batching_amortizes_full_sync_without_relaxing_bounds certification.tests.test_build_consistency certification.tests.test_combined_pressure certification.tests.test_final_acceptance certification.tests.test_run379_worker_policy > evidence/focused-regressions.log 2>&1
      - name: Final exact-source immutability
        if: always()
        run: |
          git diff --exit-code HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_RUNTIME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stagee-focused-a4ce08bb-${{ github.run_attempt }}
          path: evidence/
          retention-days: 90
          if-no-files-found: error
  pressure-proof:
    needs: focused-proof
    strategy:
      fail-fast: false
      matrix:
        profile: [original, combined]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a4ce08bb19cc01f315bd64f6dd90004fa17243d9
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify exact candidate identity on this isolated runner
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_RUNTIME"
          python -m certification.run prepare --worktrees "$RUNNER_TEMP/stagee-candidate-lanes" > evidence/candidate-prepare.log 2>&1
          python -m certification.build_consistency verify --worktrees "$RUNNER_TEMP/stagee-candidate-lanes" --expected-sha "$EXPECTED_RUNTIME" --output evidence/build-preflight.json
      - name: Original unchanged mature pressure gate
        if: matrix.profile == 'original'
        timeout-minutes: 13
        run: python -m certification.run381_pressure --measured-contention --output evidence/run381-pressure > evidence/run381-pressure.log 2>&1
      - name: Combined mature backlog reader checkpoint and urgent work
        if: matrix.profile == 'combined'
        timeout-minutes: 15
        run: python -m certification.combined_pressure --output evidence/combined-pressure > evidence/combined-pressure.log 2>&1
      - name: Final exact-source immutability
        if: always()
        run: |
          git diff --exit-code HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_RUNTIME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stagee-${{ matrix.profile }}-a4ce08bb-${{ github.run_attempt }}
          path: evidence/
          retention-days: 90
          if-no-files-found: error
  joined-proof:
    needs: focused-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a4ce08bb19cc01f315bd64f6dd90004fa17243d9
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify exact prepared runtime and protocol
        run: |
          mkdir -p evidence
          python -m certification.run prepare --worktrees "$RUNNER_TEMP/stagee-candidate-lanes" > evidence/candidate-prepare.log 2>&1
          python -m certification.build_consistency verify --worktrees "$RUNNER_TEMP/stagee-candidate-lanes" --expected-sha "$EXPECTED_RUNTIME" --output evidence/build-preflight.json
      - name: Joined eight-day PAPER campaign and recovery provider gates
        env:
          PYTHONPATH: ${{ github.workspace }}
          MM_TEST_LANE_WORKTREES: ${{ runner.temp }}/stagee-candidate-lanes
        run: |
          python -m certification.joined_soak --sources "$RUNNER_TEMP/stagee-candidate-lanes" --root "$RUNNER_TEMP/joined-soak" > evidence/joined-soak.log 2>&1
          cp "$RUNNER_TEMP/joined-soak/result.json" evidence/joined-soak.json
          python -m certification.joined_acceptance --sources "$RUNNER_TEMP/stagee-candidate-lanes" --soak "$RUNNER_TEMP/joined-soak" --output evidence/joined
      - name: Preserve native predecessors and source immutability
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/joined-soak" ]; then tar -C "$RUNNER_TEMP" -czf evidence/joined-native-predecessors.tar.gz joined-soak; fi
          git diff --exit-code HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_RUNTIME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stagee-joined-a4ce08bb-${{ github.run_attempt }}
          path: evidence/
          retention-days: 90
          if-no-files-found: error
