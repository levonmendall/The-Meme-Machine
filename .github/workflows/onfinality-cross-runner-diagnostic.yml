name: onfinality-cross-runner-diagnostic
on:
  push:
    branches:
      - research/dlmm-top-roi-wallet-evaluation
permissions:
  contents: read

jobs:
  macos:
    if: contains(github.event.head_commit.message, '[onfinality-cross-runner]')
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Cold and spaced OnFinality public probes on macOS runner
        run: python -m tests.onfinality_429_diagnostic
      - name: Preserve cross-runner diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onfinality-cross-runner-${{ github.run_id }}-${{ github.run_attempt }}
          path: onfinality-429-diagnostic.json
          if-no-files-found: warn
          retention-days: 30
