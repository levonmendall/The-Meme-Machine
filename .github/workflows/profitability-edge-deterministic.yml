name: profitability-edge-deterministic
on:
  pull_request:
    branches: [cert/profitability-persistence-edge-v1]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  compose-and-verify:
    if: contains(github.event.pull_request.title, '[edge-overlay-deterministic]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Rebase Pump and Pons operational overlays onto edge sources
        run: |
          set -euo pipefail
          for LANE in pump pons; do
            if [ "$LANE" = pump ]; then
              PATCH="pump-accounting.patch"
            else
              PATCH="pons-cohort-capital.patch"
            fi
            SHA="$(python -c "import json; print(json.load(open('certification/sources.json'))['lanes']['$LANE']['source_sha'])")"
            ROOT="$(mktemp -d)"
            WT="$ROOT/$LANE"
            git fetch origin "$SHA"
            git worktree add --detach "$WT" "$SHA"
            if ! git -C "$WT" apply --3way --index "$GITHUB_WORKSPACE/certification/patches/$PATCH"; then
              if [ "$LANE" != pump ]; then
                echo "::group::$LANE overlay conflicts"
                git -C "$WT" status --short
                git -C "$WT" diff --cc || true
                echo "::endgroup::"
                exit 1
              fi
              python - "$WT/tests/pump_acceleration_natural_prospective.py" <<'PY'
          import pathlib,sys
          path=pathlib.Path(sys.argv[1])
          text=path.read_text()
          parts=[]
          cursor=0
          index=0
          while True:
              start=text.find("<<<<<<< ours\n",cursor)
              if start<0:
                  parts.append(text[cursor:])
                  break
              parts.append(text[cursor:start])
              middle=text.find("=======\n",start)
              end=text.find(">>>>>>> theirs\n",middle)
              if middle<0 or end<0:
                  raise SystemExit("malformed_pump_merge_conflict")
              ours=text[start+len("<<<<<<< ours\n"):middle]
              theirs=text[middle+len("=======\n"):end]
              if index==0:
                  theirs="\n".join(
            line for line in theirs.splitlines()
            if not line.startswith("FROZEN_POLICY_HASH=")
                  )+"\n"
                  resolved=ours+theirs
              elif index==1:
                  resolved=theirs.replace(
            "global ACCOUNTING,PIPELINE",
            "global ACCOUNTING,PIPELINE,FILL_PERSISTENCE_CONTEXT",
            1,
                  )
              elif index==2:
                  resolved=theirs
              elif index==3:
                  resolved=ours+theirs
              else:
                  raise SystemExit(f"unexpected_pump_conflict_{index}")
              parts.append(resolved)
              cursor=end+len(">>>>>>> theirs\n")
              index+=1
          if index!=4:
              raise SystemExit(f"expected_4_pump_conflicts_got_{index}")
          merged="".join(parts)
          old='buyer_growth=flow["buyer_growth"],net_buy_share_bps=flow["net_buy_share_bps"],'
          new=('buyer_growth=flow["buyer_growth"],'
               'repeat_buyer_clusters=flow["repeat_buyer_clusters"],'
               'repeat_buy_share_bps=flow["repeat_buy_share_bps"],'
               'net_buy_share_bps=flow["net_buy_share_bps"],')
          if old in merged:
              merged=merged.replace(old,new,1)
          path.write_text(merged)
          PY
              git -C "$WT" add tests/pump_acceleration_natural_prospective.py
              if test -n "$(git -C "$WT" diff --name-only --diff-filter=U)"; then
                git -C "$WT" status --short
                exit 1
              fi
              git -C "$WT" diff --check
            fi
            git -C "$WT" diff --binary HEAD > "$GITHUB_WORKSPACE/certification/patches/$PATCH.next"
            mv "$GITHUB_WORKSPACE/certification/patches/$PATCH.next" "$GITHUB_WORKSPACE/certification/patches/$PATCH"
            git worktree remove --force "$WT"
            rm -rf "$ROOT"
          done
          git diff --check -- certification/patches/pump-accounting.patch certification/patches/pons-cohort-capital.patch
      - name: Supervisor deterministic suite
        run: python -m unittest discover -s certification/tests -v
      - name: Build exact isolated lane worktrees
        run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/edge-worktrees"
      - name: Full lane suites and resource gates
        run: python -m certification.run verify --worktrees "$RUNNER_TEMP/edge-worktrees" --output certification-edge-gates
      - name: Preserve canonical rebased overlays on the PR head
        run: |
          if git diff --quiet -- certification/patches/pump-accounting.patch certification/patches/pons-cohort-capital.patch; then
            echo "Operational overlays already canonical for the edge sources."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certification/patches/pump-accounting.patch certification/patches/pons-cohort-capital.patch
          git commit -m "[qualification-build] canonicalize profitability persistence edge overlays"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
