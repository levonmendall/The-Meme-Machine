name: solana-dlmm-support-census
# rerun: 2
on:
  push:
    branches:
      - research/solana-dlmm-independent-v1
permissions:
  contents: read
jobs:
  census:
    if: contains(github.event.head_commit.message, '[solana-dlmm-support-census]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate Solana route
        run: python -m tests.dlmm_alchemy_provider
      - name: Census exact rejected configurations
        run: python -m tests.solana_dlmm_support_census
      - name: Preserve census
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: solana-dlmm-support-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: solana-dlmm-support-census.json
          if-no-files-found: warn
          retention-days: 30
