name: Read-only autonomous PAPER WAL diagnostic
on:
  push:
    branches: [review/autonomous-paper-evidence-a60326b]
    paths: [.github/workflows/autonomous-paper-evidence-review.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 72cbb01b036384f106c916fbd8981c45bef7a192
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Reproduce checkpoint WAL reuse on exact failed source without providers
        run: |
          cat > "$RUNNER_TEMP/wal_probe.py" <<'PYCODE'
          import asyncio,json,time
          from pathlib import Path
          from unittest.mock import patch
          from meme_machine.solana_evidence_plane import EvidenceWriter
          from certification.run381_pressure import run
          native=EvidenceWriter.checkpoint
          calls=0
          def checkpoint(path):
              global calls
              start=time.monotonic();result=native(path);calls+=1
              print(json.dumps(dict(checkpoint=calls,result=result,seconds=time.monotonic()-start,
                  db=Path(path).stat().st_size,wal=Path(str(path)+'-wal').stat().st_size)),flush=True)
              return result
          if __name__=='__main__':
              with patch.object(EvidenceWriter,'checkpoint',checkpoint):
                  asyncio.run(run(1000,'diagnostic',measured_contention=True,diagnostics=True))
          PYCODE
          mkdir diagnostic
          PYTHONPATH=. python "$RUNNER_TEMP/wal_probe.py" > diagnostic/run.log 2>&1
          python - <<'PYCODE'
          import json
          from pathlib import Path
          r=json.loads(Path('diagnostic/result.json').read_text())
          print(json.dumps({k:r[k] for k in ['passed','failure','hot_peak','lag_peak','storage_maintenance','diagnostics']},indent=2))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wal-diagnostic-72cbb01
          path: diagnostic/
          if-no-files-found: error
          retention-days: 90
