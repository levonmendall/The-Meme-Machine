name: Read-only df7b376 failed smoke evidence review
on:
  push:
    branches: [review/autonomous-paper-evidence-a60326b]
    paths: [.github/workflows/autonomous-paper-evidence-review.yml]
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_RUN: '36381533967'
      EVIDENCE_ARTIFACT: '10953267409'
      EVIDENCE_NAME: autonomous-paper-autonomous-paper-df7b376-20260927-0-36381533967-native
      EVIDENCE_DIGEST: sha256:64f9aa9888f6535bd46b4a39ba932ee83499807d0c8c30c5c9bc010f502a120d
      EVIDENCE_SHA: df7b376230a2cea0b9e6377662d7e5f2c3e66067
      EVIDENCE_SIZE: '1497744910'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: df7b376230a2cea0b9e6377662d7e5f2c3e66067
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify immutable failed smoke and extract service-failure evidence
        run: |
          python - <<'PYCODE'
          import os,json,hashlib,zipfile
          from pathlib import Path,PurePosixPath
          from urllib.request import Request,build_opener,urlopen
          from urllib.error import HTTPError
          from certification.prospective_program import GitHub,NoRedirect
          api=GitHub();run_id=int(os.environ['EVIDENCE_RUN'])
          run=api.request('GET',f'actions/runs/{run_id}')
          if run['head_sha']!=os.environ['EVIDENCE_SHA']:raise ValueError('review_source_identity')
          items=[a for a in api.pages(f'actions/runs/{run_id}/artifacts','artifacts')
                 if a['name']==os.environ['EVIDENCE_NAME']]
          if len(items)!=1 or items[0].get('expired'):raise ValueError('review_artifact_missing')
          item=items[0]
          if item['id']!=int(os.environ['EVIDENCE_ARTIFACT']) or item['size_in_bytes']!=int(os.environ['EVIDENCE_SIZE']):
              raise ValueError('review_exact_failure_size')
          if item['digest']!=os.environ['EVIDENCE_DIGEST']:raise ValueError('review_artifact_identity')
          req=Request(item['archive_download_url'],headers={'Authorization':'Bearer '+api.token})
          try:response=build_opener(NoRedirect).open(req,timeout=30)
          except HTTPError as exc:
              if exc.code not in (301,302,303,307,308):raise
              response=urlopen(exc.headers['Location'],timeout=60)
          archive_path=Path(os.environ['RUNNER_TEMP'])/'failed-smoke.zip'
          h=hashlib.sha256();size=0
          with response,archive_path.open('wb') as out:
              while block:=response.read(1024*1024):
                  size+=len(block)
                  if size>item['size_in_bytes']:raise ValueError('review_transport_size')
                  h.update(block);out.write(block)
          if size!=item['size_in_bytes'] or 'sha256:'+h.hexdigest()!=item['digest']:
              raise ValueError('review_transport_digest')
          root=Path('reviewed-evidence');root.mkdir()
          suffixes=('evidence-process.log','process.log','service.log','status.json','health.json',
                    'telemetry.json','window-review.json','market-assurance.json','result.json',
                    'error.json','stream-state.json','stream_state.json','evidence-liveness.json',
                    'evidence_liveness.json','terminal-reconciliation.json','diagnostics.json')
          selected=[];inventory=[];total=0
          with zipfile.ZipFile(archive_path) as z:
              for info in z.infolist():
                  inventory.append({'path':info.filename,'bytes':info.file_size})
                  low=info.filename.lower()
                  exact=any(info.filename==s or info.filename.endswith('/'+s) for s in suffixes)
                  keyed=any(k in low for k in ('solana','evidence','stream','wal','checkpoint','gap','retention')) and low.endswith(('.json','.log','.txt'))
                  if not (exact or keyed):continue
                  path=PurePosixPath(info.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in info.filename:raise ValueError('review_artifact_path')
                  if info.file_size>16*1024**2:continue
                  if total+info.file_size>64*1024**2:continue
                  raw=z.read(info);total+=len(raw)
                  target=root/path;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(raw)
                  selected.append({'path':info.filename,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
          result={'run_id':run_id,'source_sha':run['head_sha'],'artifact_id':item['id'],
                  'artifact_digest':item['digest'],'selected':selected,'inventory':inventory,
                  'read_only':True,'provider_calls':0,'market_authority':False}
          (root/'review-index.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print(json.dumps({k:result[k] for k in result if k!='inventory'},sort_keys=True))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reviewed-smoke-10953267409
          path: reviewed-evidence/
          if-no-files-found: error
          retention-days: 90
