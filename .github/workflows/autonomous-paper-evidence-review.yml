name: Read-only autonomous PAPER checkpoint comparison
on:
  push:
    branches: [review/autonomous-paper-evidence-a60326b]
    paths: [.github/workflows/autonomous-paper-evidence-review.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 518e8573d72150941a688b45c52b76e5fdac8e74
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compare unchanged measured pressure with WAL allocation reuse
        run: |
          cat > "$RUNNER_TEMP/wal_compare.py" <<'PYCODE'
          import asyncio,json,time,sqlite3,sys
          from contextlib import closing
          from pathlib import Path
          from unittest.mock import patch
          from meme_machine.solana_evidence_plane import EvidenceWriter
          from certification.run381_pressure import run
          import certification.pressure_diagnostics as diagnostics
          classify=diagnostics.statement_class
          def statement_class(sql):
              if sql.startswith('PRAGMA wal_checkpoint'):return 'checkpoint_'+sql.split('(')[1][:-1]
              if sql=='BEGIN IMMEDIATE':return 'writer_begin'
              return classify(sql)
          mode=None;calls=0
          def checkpoint(path):
              global calls
              start=time.monotonic()
              with closing(sqlite3.connect(Path(path).resolve().as_uri()+'?mode=rw',uri=True,isolation_level=None,timeout=0)) as db:
                  first=db.execute('PRAGMA wal_checkpoint(PASSIVE)').fetchone()
                  result=db.execute('PRAGMA wal_checkpoint('+mode+')').fetchone()
              calls+=1
              if calls%10==0:
                  print(json.dumps(dict(checkpoint=calls,mode=mode,passive=first,result=result,
                      seconds=time.monotonic()-start,db=Path(path).stat().st_size,
                      wal=Path(str(path)+'-wal').stat().st_size)),flush=True)
              return result
          if __name__=='__main__':
              mode=sys.argv[1]
              assert mode in ('TRUNCATE','RESTART')
              with patch.object(EvidenceWriter,'checkpoint',checkpoint),patch.object(diagnostics,'statement_class',statement_class):
                  asyncio.run(run(1000,'diagnostic/'+mode,measured_contention=True,diagnostics=True))
          PYCODE
          mkdir -p diagnostic/TRUNCATE diagnostic/RESTART
          PYTHONPATH=. python "$RUNNER_TEMP/wal_compare.py" TRUNCATE > diagnostic/TRUNCATE/run.log 2>&1
          PYTHONPATH=. python "$RUNNER_TEMP/wal_compare.py" RESTART > diagnostic/RESTART/run.log 2>&1
          python - <<'PYCODE'
          import json
          from pathlib import Path
          for mode in ['TRUNCATE','RESTART']:
              r=json.loads(Path('diagnostic',mode,'result.json').read_text())
              print(mode,json.dumps({k:r[k] for k in ['passed','failure','hot_peak','lag_peak','elapsed','oldest_hot_age_peak','oldest_retained_age_peak']}))
              print(mode,json.dumps(r['diagnostics']['sql']))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wal-reset-comparison-518e857
          path: diagnostic/
          if-no-files-found: error
          retention-days: 90
