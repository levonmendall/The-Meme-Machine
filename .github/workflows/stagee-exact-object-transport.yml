name: Preserve exact Stage E Git objects only
on:
  push:
    branches: [transport/stagee-exact-objects-20260930]
    paths: ['.github/stagee-object-transport/request.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: stagee-exact-object-transport
  cancel-in-progress: false
jobs:
  preserve-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify and preserve exact objects without running candidate code
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exact-object-evidence"
          python3 .github/stagee-object-transport/restore_objects.py
      - name: Preserve transport evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-object-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-object-evidence/
          if-no-files-found: warn
          retention-days: 90
