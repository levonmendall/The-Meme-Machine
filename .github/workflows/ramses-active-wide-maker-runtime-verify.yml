name: ramses-active-wide-maker-runtime-verify
on:
  push:
    branches: [strategy/ramses-active-wide-maker-v3-runtime]
permissions:
  contents: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[ramses-active-wide-runtime-verify]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify v3 specification and compile promoted runtime
        run: |
          python - <<'PY'
          import json
          p=json.load(open("RAMSES_ACTIVE_WIDE_MAKER_REBALANCE_V3.json"))
          assert p["kind"]=="ramses_active_wide_maker_rebalance_v3"
          assert p["paper_only"] is True
          assert p["allocation_authority"] is False
          assert p["validation_boundary"]["minimum_eligible_rebalances_before_strategy_promotion"]==20
          assert p["validation_boundary"]["minimum_distinct_pools"]==5
          PY
          python -m py_compile             robinhood_research/ramses_active_wide_maker.py             robinhood_research/ramses_strategy.py             robinhood_research/ramses_universe.py             robinhood_research/ramses_costs.py             robinhood_research/ramses_all_pool_lifecycle.py
      - name: Emit canonical Ramses policy and file identities
        run: |
          python - <<'PY'
          from robinhood_research.ramses_strategy import POLICY_HASH
          print("RAMSES_POLICY_HASH="+POLICY_HASH)
          PY
          sha256sum robinhood_research/ramses_strategy.py RAMSES_ACTIVE_WIDE_MAKER_REBALANCE_V3.json .github/workflows/robinhood-ramses-extended.yml
      - name: Ramses source-policy deterministic suite
        run: |
          python -m unittest -v             robinhood_tests.test_ramses_active_wide_maker             robinhood_tests.test_ramses_strategy             robinhood_tests.test_ramses_universe             robinhood_tests.test_ramses_costs             robinhood_tests.test_ramses_strategy_isolation
      - name: Note operational overlay boundary
        run: |
          echo "Full lifecycle/provider-admission regressions run after canonical ramses-admission.patch composition."
