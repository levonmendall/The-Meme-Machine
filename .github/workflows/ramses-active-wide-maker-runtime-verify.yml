name: ramses-active-wide-maker-runtime-verify
on:
  push:
    branches: [strategy/ramses-active-wide-maker-v3-runtime]
permissions:
  contents: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[ramses-active-wide-runtime-verify]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify v3 specification and compile promoted runtime
        run: |
          python - <<'PY'
          import json
          p=json.load(open("RAMSES_ACTIVE_WIDE_MAKER_REBALANCE_V3.json"))
          assert p["kind"]=="ramses_active_wide_maker_rebalance_v3"
          assert p["paper_only"] is True
          assert p["allocation_authority"] is False
          assert p["validation_boundary"]["minimum_eligible_rebalances_before_strategy_promotion"]==20
          assert p["validation_boundary"]["minimum_distinct_pools"]==5
          PY
          python -m py_compile             robinhood_research/ramses_active_wide_maker.py             robinhood_research/ramses_strategy.py             robinhood_research/ramses_universe.py             robinhood_research/ramses_costs.py             robinhood_research/ramses_all_pool_lifecycle.py
      - name: Full Robinhood deterministic suite
        run: python -m unittest discover -s robinhood_tests -v
