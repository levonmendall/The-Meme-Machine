name: Bounded archive-overlap design gates (PAPER ONLY)
on:
  push:
    branches: [diagnostics/bounded-archive-overlap-20260930]
    paths: ['diagnostics/bounded-archive-overlap/execution-request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: bounded-archive-overlap-gates
  cancel-in-progress: false
jobs:
  design-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
      MM_REAL_IPC_TESTS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify pinned ZIP and run only the short resource allocation boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: python diagnostics/bounded-archive-overlap/bootstrap.py "$RUNNER_TEMP/bounded-overlap-gates"
      - name: Preserve gate result and exact proposed source; no pressure workloads
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bounded-overlap-gates-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bounded-overlap-gates/
            !${{ runner.temp }}/bounded-overlap-gates/**/runtime/**
            !${{ runner.temp }}/bounded-overlap-gates/reference-worktree/**
            !${{ runner.temp }}/bounded-overlap-gates/treatment-worktree/**
          if-no-files-found: error
          retention-days: 90
