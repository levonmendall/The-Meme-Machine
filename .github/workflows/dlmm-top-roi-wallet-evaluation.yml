name: dlmm-top-roi-wallet-evaluation
on:
  push:
    branches:
      - research/dlmm-top-roi-wallet-evaluation
permissions:
  contents: read

jobs:
  discovery:
    if: contains(github.event.head_commit.message, '[dlmm-top-roi-discovery]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: dlmm-alchemy-solana-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: ROI evaluation regression gate
        run: python -m unittest tests.test_dlmm_top_roi_wallet_evaluation -v
      - name: Validate OnFinality-primary / Alchemy-rescue Solana topology
        env:
          MM_ONFINALITY_SOLANA_RPC_URL: ${{ secrets.MM_ONFINALITY_SOLANA_RPC_URL }}
          MM_ONFINALITY_SOLANA_WS_URL: ${{ secrets.MM_ONFINALITY_SOLANA_WS_URL }}
          MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
        run: python -m tests.dlmm_alchemy_provider
      - name: Discover broader active LP wallet cohort without PnL reads
        env:
          MM_ONFINALITY_SOLANA_RPC_URL: ${{ secrets.MM_ONFINALITY_SOLANA_RPC_URL }}
          MM_ONFINALITY_SOLANA_WS_URL: ${{ secrets.MM_ONFINALITY_SOLANA_WS_URL }}
          MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
        run: python -m tests.dlmm_top_roi_wallet_evaluation discover
      - name: Preserve pre-PnL discovery
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-top-roi-wallet-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: dlmm-top-roi-wallet-discovery.json
          if-no-files-found: warn
          retention-days: 90

  analysis:
    if: contains(github.event.head_commit.message, '[dlmm-top-roi-analysis]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: ROI evaluation regression gate
        run: python -m unittest tests.test_dlmm_top_roi_wallet_evaluation -v
      - name: Analyze only committed frozen ROI cohort
        run: python -m tests.dlmm_top_roi_wallet_evaluation analyze --cohort DLMM_TOP_ROI_WALLET_COHORT_V1.json
      - name: Preserve ROI analysis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-top-roi-wallet-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: dlmm-top-roi-wallet-analysis.json
          if-no-files-found: warn
          retention-days: 90
