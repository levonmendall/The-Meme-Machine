name: dlmm-live-host-fee-proof
on:
  push:
    branches:
      - research/dlmm-point-in-time-replay
permissions:
  contents: read
jobs:
  proof:
    if: contains(github.event.head_commit.message, '[dlmm-live-host-fee-proof]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: solana-public-rpc-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Host-fee regressions
        run: python -m unittest tests.test_dlmm_host_fee_accounting tests.test_dlmm_dense_acquisition tests.test_dlmm_endpoint_fresh -v
      - name: Current JUP-SOL finalized host-fee proof
        env:
          MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
        run: python -m tests.dlmm_live_host_fee_proof --window-seconds 12
      - name: Preserve host-fee proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-live-host-fee-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: dlmm-live-host-fee-proof.json
          if-no-files-found: warn
          retention-days: 30
