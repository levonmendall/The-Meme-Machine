name: v9-handoff-continuation-diagnostic
on:
  push:
    branches: [repair/v9-meteora-handoff-position-continuation-20260924]
permissions:
  contents: read
jobs:
  test:
    if: contains(github.event.head_commit.message, '[v9-handoff-test]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/lanes"
      - name: Focused handoff and one-shot continuation tests
        env:
          MM_TEST_LANE_WORKTREES: ${{ runner.temp }}/lanes
        run: >-
          python -m unittest
          certification.tests.test_terminal_reconciliation
          certification.tests.test_position_continuation
          certification.tests.test_single_campaign_control -v
