name: pump-supply-probe
on:
  push:
    branches:
      - proof/market-native-active-paper
permissions:
  contents: read
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[pump-supply-probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: solana-public-rpc-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Capture exact failed mint supply semantics
        run: python -m tests.pump_supply_probe
      - name: Preserve exact supply probe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pump-supply-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: pump-supply-probe.json
          if-no-files-found: warn
          retention-days: 30
