name: E23 overlap witness repair
on:
  push:
    branches: [repair/e23-overlap-witness-20260928]
permissions:
  contents: read
concurrency:
  group: e23-overlap-witness
  cancel-in-progress: false
jobs:
  recover-interrupted-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recover exact interrupted candidate without executing or promoting it
        run: |
          set -euo pipefail
          mkdir -p /tmp/e23-recovered
          cp .github/e23-recovery/interrupted-candidate.bundle /tmp/e23-recovered/candidate.bundle
          sha256sum /tmp/e23-recovered/candidate.bundle > /tmp/e23-recovered/bundle.sha256
          git bundle verify /tmp/e23-recovered/candidate.bundle
          git fetch /tmp/e23-recovered/candidate.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = f25160bfabfe4613019d6376695d8666d34a8457
          git merge-base --is-ancestor e26df014846d3289f6fc061888d7f0fe7111b47f FETCH_HEAD
          git diff e26df014846d3289f6fc061888d7f0fe7111b47f FETCH_HEAD > /tmp/e23-recovered/recovered.patch
          git show -s --format=fuller FETCH_HEAD > /tmp/e23-recovered/commit.txt
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e23-recovered-interrupted-candidate
          path: /tmp/e23-recovered/
          retention-days: 90
          if-no-files-found: error
