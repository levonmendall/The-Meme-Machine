name: finalize-alchemy-optimization
# deterministic recomposition attempt 2
on:
  push:
    branches:
      - cert/non-market-e2e-20260922

permissions:
  contents: write
  actions: read

concurrency:
  group: finalize-alchemy-optimization
  cancel-in-progress: false

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[finalize-alchemy-optimization]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: bash certification/finalize_alchemy_optimization.sh
