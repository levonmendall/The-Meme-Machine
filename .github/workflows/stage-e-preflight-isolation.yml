name: Lane C focused preflight isolation (PAPER ONLY)
on:
  push:
    branches: [repair/stage-e-preflight]
    paths:
      - .github/workflows/stage-e-preflight-isolation.yml
      - diagnostics/stage-e-preflight/execution-request.json
permissions:
  contents: read
  actions: read
concurrency:
  group: lane-c-preflight-isolation
  cancel-in-progress: false
jobs:
  focused:
    # Lane C stopped: frozen qualification input conflict. Retained for evidence only.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
      MM_REAL_IPC_TESTS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Bind the unchanged production tree and first attempt
        env:
          LANE_C_EVIDENCE: ${{ runner.temp }}/lane-c-preflight
        run: |
          mkdir -p "$LANE_C_EVIDENCE"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          base = 'dc08f9064cf5e37b63f383f52aa709d0afc1723f'
          git = lambda *a: subprocess.check_output(['git', *a], text=True).strip()
          request = json.loads(Path('diagnostics/stage-e-preflight/execution-request.json').read_text())
          assert request['mode'] in ('baseline', 'corrected')
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
          assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
          assert git('rev-parse', 'HEAD^') == request['expected_parent']
          assert not git('status', '--porcelain')
          changed = git('diff', '--name-only', base, 'HEAD').splitlines()
          allowed_tests = {'tests/test_run379_production_pressure.py','tests/test_run380_production_pressure.py','tests/test_run373_dispatch_throughput.py','tests/evidence_fixture_clock.py'}
          assert all(p.startswith('diagnostics/stage-e-preflight/') or p == '.github/workflows/stage-e-preflight-isolation.yml' or (request['mode']=='corrected' and p in allowed_tests) for p in changed)
          row = dict(base_sha=base, base_tree=git('rev-parse', base+'^{tree}'), sha=git('rev-parse', 'HEAD'), tree=git('rev-parse', 'HEAD^{tree}'), changed=changed, mode=request['mode'], paper_only=True)
          Path(os.environ['LANE_C_EVIDENCE'], 'identity.json').write_text(json.dumps(row, indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('LANE_C_EVIDENCE='+os.environ['LANE_C_EVIDENCE']+'\n')
          print('LANE_C_IDENTITY '+json.dumps(row, sort_keys=True))
          PY
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify frozen runtime environment
        run: |
          python - <<'PY'
          import json, os, platform, sqlite3, websockets
          from pathlib import Path
          row = dict(python=platform.python_version(), sqlite=sqlite3.sqlite_version, websockets=websockets.__version__, os=platform.platform())
          assert row['python'] == '3.12.14'
          assert row['sqlite'] == '3.45.1'
          assert row['websockets'] == '17.1'
          Path(os.environ['LANE_C_EVIDENCE'], 'environment.json').write_text(json.dumps(row, indent=2)+'\n')
          print('LANE_C_ENVIRONMENT '+json.dumps(row))
          PY
      - name: Preserve the original preflight and all skip reasons
        env:
          GH_TOKEN: ${{ github.token }}
        run: python diagnostics/stage-e-preflight/recover_original.py
      - name: Run the three exact focused cases first
        run: |
          set -o pipefail
          python diagnostics/stage-e-preflight/focused.py 2>&1 | tee "$LANE_C_EVIDENCE/focused.log"
      - name: Deterministic original contract reproductions
        if: always()
        run: python diagnostics/stage-e-preflight/contract_probe.py
      - name: Verify translated fixture bytes against the native decoders
        if: always()
        run: python diagnostics/stage-e-preflight/fixture_clock_probe.py
      - name: Hash bounded evidence
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['LANE_C_EVIDENCE'])
          rows = {p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.iterdir()) if p.is_file()}
          (root/'SHA256.json').write_text(json.dumps(rows, indent=2)+'\n')
          print('LANE_C_EVIDENCE_HASHES '+json.dumps(rows, sort_keys=True))
          PY
      - name: Preserve failure evidence without retry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lane-c-preflight-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lane-c-preflight/
          if-no-files-found: error
          retention-days: 90
