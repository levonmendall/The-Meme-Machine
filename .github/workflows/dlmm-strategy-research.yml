name: dlmm-strategy-research
on:
  push:
    branches:
      - research/dlmm-point-in-time-replay
permissions:
  contents: read
jobs:
  point-in-time-replay:
    if: contains(github.event.head_commit.message, '[dlmm-strategy-replay]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Research and tape-extension regressions
        run: python -m unittest tests.test_dlmm_tape_extensions tests.test_dlmm_strategy_point_in_time tests.test_dlmm_strategy_high_activity -v
      - name: Highest-activity finalized DLMM strategy replay
        run: python -m tests.dlmm_strategy_high_activity_stonk --cycles 1 --window-seconds 12
      - name: Preserve research report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-strategy-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: dlmm-strategy-report.json
          if-no-files-found: warn
          retention-days: 30
