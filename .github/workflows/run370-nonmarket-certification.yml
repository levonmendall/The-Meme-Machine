name: Run 370 Solana capacity non-market certification
on:
  push:
    branches: [repair/run370-solana-evidence-capacity-20260925]
permissions:
  contents: read
  actions: read
jobs:
  deterministic:
    if: contains(github.event.head_commit.message, '[non-market-cert]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MM_REAL_IPC_TESTS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/run370-lanes"
      - name: Solana architecture including real Unix IPC
        run: python -m certification.solana_evidence_architecture_gate --worktrees "$RUNNER_TEMP/run370-lanes" --output run370-evidence/architecture
      - name: Offline Run 370 pressure and retention headroom
        run: |
          python -m certification.run370_pressure --runtime "$GITHUB_WORKSPACE" --seconds 2000 --dense --output run370-evidence/pressure.json
          python - <<'PY'
          import json
          r=json.load(open('run370-evidence/pressure.json'))
          assert r['bounded_with_headroom'] and r['completed_seconds']==2000
          assert r['provider_calls']==0 and r['failure'] is None
          assert r['samples'][-1]['counters']['stream_reconnects']==17
          assert r['samples'][-1]['counters']['expired_candidate_interests']==22
          assert r['local_reads']['pump']>100 and r['local_reads']['meteora']>100
          assert r['samples'][-1]['counters']['pump.foreground_historical_rpc_calls']==0
          assert r['samples'][-1]['counters']['meteora.historical_reconstruction_rpc_calls']==0
          PY
      - name: Preserve offline success and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: run370-capacity-${{ github.sha }}
          path: run370-evidence/
          retention-days: 90
  certify:
    needs: deterministic
    uses: ./.github/workflows/non-market-certification.yml
    secrets: inherit
