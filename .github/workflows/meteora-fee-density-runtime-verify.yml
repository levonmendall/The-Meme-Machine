name: meteora-fee-density-runtime-verify
on:
  push:
    branches: [strategy/meteora-fee-density-v1-runtime]
permissions:
  contents: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[meteora-fee-density-runtime-verify]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify frozen profitability policy and emit canonical digest
        run: |
          python - <<'PY'
          import hashlib,json
          path="SOLANA_DLMM_INDEPENDENT_V1.json"
          p=json.load(open(path))
          assert p["revision"]=="2.0-profitability-fee-density-v1"
          assert p["execution_certification"]["profitability_authority"] is True
          assert p["execution_certification"]["machinery_proof_only"] is False
          assert p["qualification"]["min_authenticated_fee_density_24h_pct"]==5.0
          assert p["qualification"]["min_two_way_balance"]==0.25
          assert p["range"]["intended_holding_seconds"]==14400
          assert p["range"]["max_holding_seconds"]==86400
          assert p["range"]["total_width_bound_bins"]==[52,100]
          assert p["execution_certification"]["strategy2_continuity_required"] is True
          p["execution_certification"]["policy_hash"]=None
          body=json.dumps(p,sort_keys=True,separators=(",",":")).encode()
          digest=hashlib.sha256(body).hexdigest()
          assert p["execution_certification"]["policy_hash"] is None
          actual=json.load(open(path))["execution_certification"]["policy_hash"]
          assert actual==digest,(actual,digest)
          print("METEORA_POLICY_HASH="+digest)
          print("METEORA_FILE_SHA256="+hashlib.sha256(open(path,"rb").read()).hexdigest())
          PY
          python -m py_compile tests/solana_dlmm_independent_v1.py meme_machine/dlmm.py meme_machine/dlmm_paper.py meme_machine/dlmm_tape.py
      - name: Meteora strategy and changed-path deterministic suite
        run: |
          python -m unittest -v             tests.test_solana_dlmm_independent_v1             tests.test_dlmm             tests.test_dlmm_bin_array_neutral             tests.test_dlmm_endpoint_fresh             tests.test_dlmm_liquidity_reset             tests.test_dlmm_safe_token2022             tests.test_dlmm_signature_boundary             tests.test_dlmm_tape_extensions
      - name: Note integration-wide gate boundary
        run: |
          echo "Complete tests/ discovery remains mandatory after canonical Meteora operational overlay composition."
      - name: Resource gates
        run: |
          python -m tests.resource_check
          python -m tests.dlmm_resource_check
