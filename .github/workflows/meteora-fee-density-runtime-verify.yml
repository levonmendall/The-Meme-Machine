name: meteora-fee-density-runtime-verify
on:
  push:
    branches: [strategy/meteora-fee-density-profitability-v1]
permissions:
  contents: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[meteora-fee-density-runtime-verify]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify frozen fee-density policy
        run: |
          python - <<'PY'
          import json
          p=json.load(open("SOLANA_DLMM_INDEPENDENT_V1.json"))
          assert p["kind"]=="solana_dlmm_fee_density_profitability_v1"
          assert p["profitability_authority"] is True
          assert p["range"]["intended_holding_seconds"]==14400
          assert p["range"]["max_holding_seconds"]==86400
          assert p["range"]["total_width_bound_bins"]==[52,100]
          assert p["position"]["max_local_liquidity_fraction_bps"]==100
          assert p["qualification"]["min_two_way_balance"]==0.25
          assert p["qualification"]["require_two_x_cost_stress_positive"] is True
          assert "candidate-specific" in p["qualification"]["live_fee_density_threshold"]
          PY
          python -m py_compile tests/solana_dlmm_independent_v1.py meme_machine/dlmm.py meme_machine/dlmm_paper.py meme_machine/dlmm_tape.py
      - name: Meteora source-policy deterministic suite
        run: |
          python -m unittest -v \
            tests.test_solana_dlmm_independent_v1 \
            tests.test_dlmm_safe_token2022 \
            tests.test_dlmm_signature_boundary \
            tests.test_dlmm_tape_extensions \
            tests.test_provider_retry
      - name: DLMM resource gate
        run: python tests/dlmm_resource_check.py
      - name: Note operational overlay boundary
        run: |
          echo "The complete Solana suite is integration-gated because the raw Strategy2 source predates canonical checkpoint/tape repair overlays."
