name: Native-v3 A signed allocation preflight (PAPER ONLY)
on:
  create:
permissions:
  contents: read
jobs:
  host-inspection:
    if: github.event.ref_type == 'branch' && github.event.ref == 'preflight/native-v3-a-signed-20261003T112100Z'
    runs-on: [self-hosted, linux, x64, meme-machine-stage-e-observer]
    timeout-minutes: 10
    steps:
      - name: Read immutable approved executable
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f480c6b4f7a8442fd148c7ed61bcc4447edaefca
          path: native-v3-approved-20261003T112100Z
          fetch-depth: 1
          persist-credentials: false
      - name: Read separate nonmaterial evidence collector
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: native-v3-preflight-20261003T112100Z
          fetch-depth: 1
          persist-credentials: false
      - name: Fresh read-only host inspection; no trial or source launch
        id: inspect
        shell: sh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          MM_APPROVED_REPOSITORY: ${{ github.workspace }}/native-v3-approved-20261003T112100Z
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          manifest=Path('/mnt/volume_nyc1_1790918115030/meme-machine-observer-v2-7a516a6a/fresh-environment.json')
          identity=json.loads(manifest.read_bytes())
          executable=identity['python_executable']
          if hashlib.sha256(Path(executable).read_bytes()).hexdigest()!=identity['python_executable_hash']:
              raise SystemExit('preserved_Python_executable_changed')
          collector=Path(os.environ['GITHUB_WORKSPACE'])/'native-v3-preflight-20261003T112100Z/diagnostics/stage-e-native-v3-a-preflight-20261003T112100Z/collect_host.py'
          os.execv(executable,[executable,'-I','-B',str(collector)])
          PY
      - name: Preserve only preflight evidence
        if: always() && steps.inspect.outputs.evidence_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-v3-a-host-20261003T112100Z-${{ github.run_id }}-1
          path: ${{ steps.inspect.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 90
          overwrite: false
