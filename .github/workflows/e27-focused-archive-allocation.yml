name: E27 focused archive allocation verification
on:
  push:
    branches: [recovery/stagee25-github-native-publication-20260928]
    paths:
      - '.github/stagee27/focused-trigger.txt'
permissions:
  contents: read
concurrency:
  group: e27-focused-archive-allocation
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 20b2787616b8c65ac49fd7229a415545deb74588
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify exact focused candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 20b2787616b8c65ac49fd7229a415545deb74588
      - name: Focused archive and retention regressions
        run: |
          python -m unittest -v             tests.test_run381_archive_scheduling             tests.test_run381_maintenance_overlap             tests.test_run381_retention_progress             tests.test_retention_outcomes             certification.tests.test_lifecycle_capacity
