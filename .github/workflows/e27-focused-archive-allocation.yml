name: E27 focused archive allocation verification
on:
  push:
    branches: [recovery/stagee25-github-native-publication-20260928]
    paths:
      - '.github/stagee27/focused-trigger.txt'
permissions:
  contents: read
  actions: read
concurrency:
  group: e27-focused-archive-allocation
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fdeee2721d2bb63e0ff3234328b06936257493b1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify exact focused candidate and narrow diff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e27-focused"
          test "$(git rev-parse HEAD)" = fdeee2721d2bb63e0ff3234328b06936257493b1
          test "$(git rev-parse HEAD^{tree})" = c579871a07ea751cc39ff980fb7b25161a4e7bf5
          test "$(git rev-parse HEAD^)" = 20b2787616b8c65ac49fd7229a415545deb74588
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only HEAD^ HEAD)" = tests/test_run381_archive_scheduling.py
          git diff --ignore-all-space --exit-code HEAD^ HEAD
          git fsck --full --no-reflogs > "$RUNNER_TEMP/e27-focused/git-fsck.txt" 2>&1
          git show -s --format='%H%n%T%n%P' HEAD > "$RUNNER_TEMP/e27-focused/identity.txt"
          git diff HEAD^ HEAD > "$RUNNER_TEMP/e27-focused/test-discovery.patch"
          git show HEAD^:tests/test_run381_archive_scheduling.py > "$RUNNER_TEMP/e27-focused/original-test.py"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Require E27 regression discovery without executing from stdin
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, unittest
          from pathlib import Path
          modules = [
              'tests.test_run381_archive_scheduling',
              'tests.test_run381_maintenance_overlap',
              'tests.test_run381_retention_progress',
              'tests.test_retention_outcomes',
              'certification.tests.test_lifecycle_capacity',
          ]
          suite = unittest.defaultTestLoader.loadTestsFromNames(modules)
          def flatten(item):
              if isinstance(item, unittest.TestSuite):
                  for child in item:
                      yield from flatten(child)
              else:
                  yield item.id()
          ids = list(flatten(suite))
          target = 'tests.test_run381_archive_scheduling.ArchiveReceiptRetryTests.test_ready_archive_receipt_finishes_slices_before_fresh_retention_grant'
          assert ids.count(target) == 1, ('required E27 regression not discovered exactly once', ids)
          assert len(ids) == 47, ('unexpected focused inventory', len(ids))
          (Path(os.environ['RUNNER_TEMP'])/'e27-focused'/'inventory.json').write_text(json.dumps(ids, indent=2)+'\n')
          print('REQUIRED_E27_REGRESSION_DISCOVERED:', target)
          PY
      - name: Focused archive and retention regressions using native unittest
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_run381_archive_scheduling \
            tests.test_run381_maintenance_overlap \
            tests.test_run381_retention_progress \
            tests.test_retention_outcomes \
            certification.tests.test_lifecycle_capacity \
            2>&1 | tee "$RUNNER_TEMP/e27-focused/focused-tests.log"
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'e27-focused'
          text=(root/'focused-tests.log').read_text()
          assert re.search(r'^Ran 47 tests in ',text,re.M), text
          assert re.search(r'^OK\s*$',text,re.M), text
          assert not re.search(r'\bskipped\b',text,re.I), text
          (root/'result.json').write_text(json.dumps(dict(candidate='fdeee2721d2bb63e0ff3234328b06936257493b1',tests_run=47,failures=0,errors=0,skipped=0,successful=True),indent=2)+'\n')
          PY
      - name: Preserve source and evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e27-focused"
          curl --fail --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/levonmendall/The-Meme-Machine/actions/jobs/109257783725/logs' \
            > "$RUNNER_TEMP/e27-focused/original-focused-job.log"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/e27-focused/exact-candidate-source.tar.gz"
          git bundle create "$RUNNER_TEMP/e27-focused/exact-candidate.bundle" HEAD
          cd "$RUNNER_TEMP/e27-focused"
          sha256sum * > SHA256SUMS
      - name: Upload exact-candidate focused evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e27-focused-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e27-focused/
          if-no-files-found: error
          retention-days: 90
