name: Autonomous PAPER Phase A offline pressure diagnosis
on:
  push:
    branches: [repair/autonomous-paper-runtime-20260927]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pressure:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[phase-a-compare]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify observer semantics, read budget and bounded instrumentation
        run: |
          python -m unittest tests.test_pressure_observer_io tests.test_pressure_diagnostics certification.tests.test_run381_contention_profile -v
      - name: Indexed observer at unchanged full source-clock pressure
        run: |
          python -m certification.pressure_observer_compare --variant indexed --output pressure-indexed > pressure-indexed.log 2>&1
      - name: Legacy observer on the identical runner and runtime
        if: always()
        run: |
          python -m certification.pressure_observer_compare --variant legacy --output pressure-legacy > pressure-legacy.log 2>&1
      - name: Preserve bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-a-pressure-${{ github.sha }}
          path: |
            pressure-indexed/
            pressure-indexed.log
            pressure-legacy/
            pressure-legacy.log
          if-no-files-found: error
          retention-days: 90
  durability:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[phase-a-durability]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify bounded durability injection and conserved health fields
        run: python -m unittest tests.test_pressure_durability_probe tests.test_pressure_diagnostics tests.test_pressure_observer_io -v
      - name: Existing health commits at observed durable latency
        run: python -m certification.pressure_durability_compare --variant legacy --output durability-legacy > durability-legacy.log 2>&1
      - name: Atomic health publication prototype on the identical runner
        if: always()
        run: python -m certification.pressure_durability_compare --variant batched --output durability-batched > durability-batched.log 2>&1
      - name: Preserve latency comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-a-durability-${{ github.sha }}
          path: |
            durability-legacy/
            durability-legacy.log
            durability-batched/
            durability-batched.log
          if-no-files-found: error
          retention-days: 90
