name: Autonomous PAPER Phase A offline pressure diagnosis
on:
  push:
    branches: [repair/autonomous-paper-runtime-20260927]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pressure:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[phase-a-diagnostic]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Record fresh-runner pressure diagnostics
        run: |
          python -m certification.run381_pressure --measured-contention --diagnostics --output pressure-before > pressure-before.log 2>&1
      - name: Reproduce preceding resource-gate filesystem workload
        if: always()
        run: |
          python -m certification.run prepare --worktrees "$RUNNER_TEMP/phase-a-lanes"
          (cd "$RUNNER_TEMP/phase-a-lanes/pump" && python -m tests.resource_check) > pump-resource.json
          (cd "$RUNNER_TEMP/phase-a-lanes/meteora" && python -m tests.resource_check) > meteora-resource.json
          (cd "$RUNNER_TEMP/phase-a-lanes/meteora" && python -m tests.dlmm_resource_check) > meteora-dlmm-resource.json
      - name: Record same-runner pressure after resource workload
        if: always()
        run: |
          python -m certification.run381_pressure --measured-contention --diagnostics --output pressure-after > pressure-after.log 2>&1
      - name: Preserve bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-a-pressure-${{ github.sha }}
          path: |
            pressure-before/
            pressure-before.log
            pressure-after/
            pressure-after.log
            *-resource.json
          if-no-files-found: error
          retention-days: 90
