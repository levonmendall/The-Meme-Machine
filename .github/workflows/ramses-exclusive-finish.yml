name: ramses-exclusive-finish
on:
  push:
    branches: [research/ramses-branch-b-certification-v1]
permissions:
  actions: write
  contents: read

jobs:
  cancel-all:
    if: contains(github.event.head_commit.message, '[ramses-exclusive-finish]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Force-cancel every other active or queued workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, time
          repo=os.environ["REPOSITORY"]
          current=int(os.environ["CURRENT_RUN"])
          active_states=("in_progress","queued","waiting","pending","requested")

          def gh(path, method="GET"):
              cmd=["gh","api"]
              if method!="GET":
                  cmd += ["-X",method]
              cmd.append(path)
              raw=subprocess.check_output(cmd,text=True)
              return json.loads(raw) if raw.strip() else {}

          def active_runs():
              found={}
              for state in active_states:
                  for page in range(1,11):
                      data=gh(f"repos/{repo}/actions/runs?status={state}&per_page=100&page={page}")
                      rows=data.get("workflow_runs",[])
                      for row in rows:
                          rid=int(row["id"])
                          if rid!=current and row.get("status") in active_states:
                              found[rid]=row
                      if len(rows)<100:
                          break
                  else:
                      raise SystemExit("active_run_pagination_bound:"+state)
              return list(found.values())

          cancelled={}
          for _ in range(60):
              rows=active_runs()
              if not rows:
                  print(json.dumps({"status":"clear","cancelled":list(cancelled.values())},sort_keys=True))
                  raise SystemExit(0)
              for row in rows:
                  rid=int(row["id"])
                  cancelled.setdefault(rid,{
                      "id":rid,"name":row.get("name"),"head_branch":row.get("head_branch"),
                      "head_sha":row.get("head_sha"),"before":row.get("status"),
                  })
                  try:
                      gh(f"repos/{repo}/actions/runs/{rid}/force-cancel","POST")
                  except subprocess.CalledProcessError:
                      refreshed=gh(f"repos/{repo}/actions/runs/{rid}")
                      if refreshed.get("status")!="completed":
                          raise
              time.sleep(3)
          raise SystemExit("active_runs_remain:"+json.dumps([
              {"id":r["id"],"name":r["name"],"status":r["status"]}
              for r in active_runs()
          ],sort_keys=True))
          PY
