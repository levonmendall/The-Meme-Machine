name: Run 379 preserved evidence review
on:
  push:
    branches: [analysis/run379-preserved-evidence-20260926]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Review digest-pinned archived evidence without provider credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_RUN_ID: '36275141922'
          REVIEW_SHA: 350e9c647cefbee7aa5e40fd7b84810ae5232b07
          REVIEW_PHASE: smoke
        run: python -m certification.run379_preserved_review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: run379-preserved-evidence-review
          path: frozen-review/
          retention-days: 90
          if-no-files-found: error
