name: Managed native capacity focused offline regressions
on:
  pull_request:
    paths:
      - '.github/workflows/managed-capacity-offline.yml'
      - 'meme_machine/operational/managed_*.py'
      - 'meme_machine/lanes/pons/provider_topology.py'
      - 'tests/test_managed_*.py'
      - 'tests/test_robinhood_payg.py'
      - 'operational/managed-capacity/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  affected-native-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.txt
      - name: Exercise bounded generation, native decode, replay and provider failures offline
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m operational.tests FAST --verbose --modules \
            tests.test_managed_capacity_evidence tests.test_managed_capacity_workload \
            tests.test_managed_native_pump tests.test_managed_native_pons tests.test_robinhood_payg \
            tests.test_managed_log_repair_batches tests.test_bounded_provider_preflight \
            tests.test_continuous_paper tests.test_final_acquisition tests.test_governor_clock_domain \
            tests.test_managed_pons_survivor tests.test_managed_pump_qualification \
            tests.test_managed_pump_discovery_publication tests.test_solana_history_separation \
            tests.test_managed_capacity_source_guard tests.test_native_audit_source_guard \
            tests.test_robinhood_usd_valuation tests.test_integrated_startup_rehearsal \
            tests.test_solana_source_drain tests.test_source_drain_preservation \
            tests.test_source_handler_recovery tests.test_source_pool_cooperative_stop \
            tests.test_native_startup_lifecycle tests.test_startup_history_cancellation \
            tests.test_sqlite_failure_attribution tests.test_pons_protection_revision \
            tests.test_archive_full_log_content tests.test_solana_selective_evidence \
            tests.test_candidate_commit_batches tests.test_buffered_prejoin_recovery \
            tests.test_solana_source_intake.SourceIntakeTests
          python -m operational.tests OPERATIONAL --verbose --modules \
            tests.lanes.pons.test_provider_topology \
            tests.test_governor_method_pressure tests.test_reserved_evidence_priority tests.test_solana_read_rpc \
            tests.test_solana_source_intake.LiveIntakeBoundaryTests
