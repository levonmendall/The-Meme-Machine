name: frozen-campaign-deterministic-build
on:
  push:
    branches: [repair/frozen-campaign-handoff]
permissions:
  contents: write
jobs:
  tests:
    if: contains(github.event.head_commit.message, '[frozen-repair-build]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/frozen-worktrees"
      - name: Reconstruct implementation and verify canonical frozen overlays
        run: python -m certification.frozen_repair_build apply "$RUNNER_TEMP/frozen-worktrees"
      - name: Supervisor and integrity regressions
        run: |
          set -o pipefail
          python -m unittest discover -s certification/tests -v 2>&1 | tee frozen-repair-gates/supervisor.log
      - name: Complete lane suites and resource gates
        run: python -m certification.run verify --worktrees "$RUNNER_TEMP/frozen-worktrees" --output frozen-repair-gates
      - name: Publish verified Git blobs for explicit candidate composition
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m certification.frozen_repair_build publish
      - name: Preserve all deterministic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frozen-repair-gates-${{ github.run_id }}
          path: |
            frozen-repair-gates/
            certification/patches/
          if-no-files-found: error
          retention-days: 90
