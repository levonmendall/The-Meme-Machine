name: smoke-tail-repair-derive
on:
  push:
    branches: [repair/v10-smoke-tail-20260924]

permissions:
  contents: read

jobs:
  derive:
    if: contains(github.event.head_commit.message, '[derive-smoke-tail]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Prepare exact repaired lane composition
        run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/smoke-tail-lanes"
      - name: Focused Pump smoke-tail tests
        working-directory: ${{ runner.temp }}/smoke-tail-lanes/pump
        run: python -m unittest -v tests.test_pump_smoke_tail tests.test_pump_campaign_tail_drain
      - name: Derive exact Pump source diff identity
        working-directory: ${{ runner.temp }}/smoke-tail-lanes/pump
        run: |
          set -euo pipefail
          git diff --binary --full-index --no-ext-diff --no-textconv --no-renames HEAD > /tmp/pump.diff
          printf 'PUMP_SOURCE_DIFF_SHA256='
          sha256sum /tmp/pump.diff | awk '{print $1}'
          git diff --check HEAD
