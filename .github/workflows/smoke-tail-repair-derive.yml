name: smoke-tail-repair-derive
on:
  push:
    branches: [repair/v10-smoke-tail-20260924]

permissions:
  contents: read

jobs:
  derive:
    if: contains(github.event.head_commit.message, '[inspect-smoke-tail-context]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Temporarily prepare the prior v10 Pump composition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('certification/sources.json')
          row=json.loads(p.read_text())
          patches=row['lanes']['pump']['overlay_patches']
          row['lanes']['pump']['overlay_patches']=[
              x for x in patches if not x.endswith('pump-smoke-flat-tail.patch')]
          p.write_text(json.dumps(row,indent=2)+'\n')
          PY
          python -m certification.run prepare --worktrees "$RUNNER_TEMP/smoke-tail-context"
      - name: Print exact Pump repair anchors
        working-directory: ${{ runner.temp }}/smoke-tail-context/pump
        run: |
          set -euo pipefail
          f=tests/pump_acceleration_natural_prospective.py
          grep -n -A18 -B10 'def _retire_postgrad' "$f"
          grep -n -A18 -B8 'def main' "$f" | head -n 80
          grep -n -A14 -B8 "operational_configuration.*dict" "$f"
          grep -n -A22 -B10 'while int(time.time())<end' "$f"
          grep -n -A14 -B8 'Natural post-graduation and second-leg entries' "$f"
