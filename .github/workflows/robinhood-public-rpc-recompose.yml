name: robinhood-public-rpc-recompose
on:
  push:
    branches: [repair/robinhood-public-rpc-403-20260922]
permissions:
  contents: read
jobs:
  recompose:
    if: contains(github.event.head_commit.message, '[public-rpc-recompose]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Recompose exact Pons and Ramses overlays
        run: |
          set -euo pipefail
          git fetch origin df095444af5d0566ca16d5ff24ed9d3d76f6d070 e8060eb71877296e55e98659252b9c34aa3c9308
          git worktree add --detach "$RUNNER_TEMP/pons" df095444af5d0566ca16d5ff24ed9d3d76f6d070
          git worktree add --detach "$RUNNER_TEMP/ramses" e8060eb71877296e55e98659252b9c34aa3c9308
          git -C "$RUNNER_TEMP/pons" apply --index "$GITHUB_WORKSPACE/certification/patches/pons-cohort-capital.patch"
          git -C "$RUNNER_TEMP/ramses" apply --index "$GITHUB_WORKSPACE/certification/patches/ramses-admission.patch"
          PONS_HASH="$(git -C "$RUNNER_TEMP/pons" diff --binary HEAD | sha256sum | awk '{print $1}')"
          RAMSES_HASH="$(git -C "$RUNNER_TEMP/ramses" diff --binary HEAD | sha256sum | awk '{print $1}')"
          printf '{"pons":"%s","ramses":"%s"}\n' "$PONS_HASH" "$RAMSES_HASH" | tee robinhood-public-rpc-recompose.json
      - name: Run Robinhood provider regressions on both patched lane trees
        run: |
          (cd "$RUNNER_TEMP/pons" && python -m unittest robinhood_tests.test_provider -v)
          (cd "$RUNNER_TEMP/ramses" && python -m unittest robinhood_tests.test_provider -v)
      - name: Exercise patched official-public transport from hosted runner
        run: |
          for lane in pons ramses; do
            (
              cd "$RUNNER_TEMP/$lane"
              python - <<'PY'
          import json
          from robinhood_research.provider_topology import public_diagnostic_rpc
          rpc=public_diagnostic_rpc(limit=4,per_scope=4,retries=0)
          rpc.verify_chain()
          frontier=rpc.call('eth_getBlockByNumber',['finalized',False],scope='repair_preflight')
          assert isinstance(frontier,dict) and isinstance(frontier.get('hash'),str)
          print(json.dumps({'result':'PASS','provider':rpc.telemetry(),'frontier':frontier['number']},sort_keys=True))
          PY
            )
          done
      - name: Preserve recomposition evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: robinhood-public-rpc-recompose-${{ github.run_id }}
          path: robinhood-public-rpc-recompose.json
          if-no-files-found: error
          retention-days: 30
