name: Stage E native v2 paper deterministic qualification
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        type: string
        required: true
      plan_hash:
        type: string
        required: true
      input_manifest_hash:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  qualification_v2:
    uses: ./.github/workflows/stagee-native-qualification-v2-reusable.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
      plan_hash: ${{ inputs.plan_hash }}
      input_manifest_hash: ${{ inputs.input_manifest_hash }}
