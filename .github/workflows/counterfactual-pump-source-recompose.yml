name: counterfactual-pump-source-recompose
on:
  push:
    branches: [strategy/counterfactual-replay-v1-20260924]
permissions:
  contents: write
jobs:
  recompose:
    if: contains(github.event.head_commit.message, '[rebase-counterfactual-pump-source]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Recompose revised Pump as pinned source
        run: python tools/rebase_counterfactual_pump_source.py
      - name: Commit exact source composition
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A certification/sources.json certification/profitability_protocol.json \
            certification/patches/counterfactual-replay-pump-v1.patch
          git diff --cached --check
          git commit -m "Pin replay-supported Pump source and recertify [non-market-cert]"
          git push origin HEAD:strategy/counterfactual-replay-v1-20260924
