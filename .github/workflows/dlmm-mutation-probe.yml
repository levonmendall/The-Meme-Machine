name: dlmm-mutation-probe
on:
  push:
    branches:
      - research/dlmm-point-in-time-replay
permissions:
  contents: read
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[dlmm-mutation-probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: dlmm-solana-roi-alchemy-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate Alchemy Solana route
        env:
          SOLANA_ROI_ALCHEMY_API_KEY: ${{ secrets.SOLANA_ROI_ALCHEMY_API_KEY }}
        run: python -m tests.dlmm_alchemy_provider
      - name: Capture bounded finalized USELESS mutation interval
        env:
          SOLANA_ROI_ALCHEMY_API_KEY: ${{ secrets.SOLANA_ROI_ALCHEMY_API_KEY }}
        run: python -m tests.dlmm_mutation_probe --wait-seconds 20
      - name: Preserve mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-mutation-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: dlmm-mutation-probe.json
          if-no-files-found: warn
          retention-days: 30
