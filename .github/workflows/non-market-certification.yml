name: Stage E observer self-hosted identity only
run-name: Observer host identity ${{ inputs.expected_sha }}
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: meme-machine-stage-e-observer
  cancel-in-progress: false
jobs:
  observer-host-identity:
    if: github.run_attempt == 1
    runs-on: [self-hosted, linux, x64, meme-machine-stage-e-observer]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify actual host and mounted volume before preparation
        env:
          OBSERVER_EXPECTED_SHA: ${{ inputs.expected_sha }}
          OBSERVER_IDENTITY_OUTPUT: ${{ runner.temp }}/stage-e-observer-host-identity-${{ github.run_id }}
        run: python3 -I -B diagnostics/stage-e-observer-v2-self-hosted/inspect_host.py
      - name: Preserve host inspection only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: observer-host-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage-e-observer-host-identity-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 90
