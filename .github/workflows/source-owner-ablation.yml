name: Matched source-owner ablation (PAPER diagnostic only)
on:
  push:
    branches: [diagnostics/source-owner-ablation-20260930]
    paths: ['diagnostics/source-owner-ablation/execution-request.json']
permissions:
  contents: read
concurrency:
  group: source-owner-ablation-one-pair
  cancel-in-progress: false
jobs:
  matched-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      MM_REAL_IPC_TESTS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Static prefix, unchanged source and historical evidence verification
        run: |
          python -m py_compile diagnostics/source-owner-ablation/harness.py diagnostics/source-owner-ablation/prepare.py diagnostics/source-owner-ablation/pair.py diagnostics/source-owner-ablation/analyze.py
          python diagnostics/source-owner-ablation/prepare.py --root "$RUNNER_TEMP/source-owner-ablation"
      - name: One control then one treatment on this runner, with no retry
        run: python diagnostics/source-owner-ablation/pair.py --root "$RUNNER_TEMP/source-owner-ablation"
      - name: Analyze captured obligations and timing, then hard stop
        if: always()
        run: python diagnostics/source-owner-ablation/analyze.py --root "$RUNNER_TEMP/source-owner-ablation"
      - name: Preserve complete bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-owner-ablation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-owner-ablation/
            !${{ runner.temp }}/source-owner-ablation/**/runtime/**
          if-no-files-found: error
          retention-days: 90
