name: Fresh Stage-E causal isolation (PAPER diagnostic only)
on:
  push:
    branches: [diagnostics/stage-e-fresh-causal-isolation]
    paths: ['diagnostics/stage-e-fresh-causal-isolation/execution-request.json']
permissions:
  contents: read
concurrency:
  group: stage-e-fresh-causal-isolation
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
      MM_REAL_IPC_TESTS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize durable provenance
        run: |
          mkdir -p "$RUNNER_TEMP/stage-e"
          git rev-parse HEAD HEAD^{tree} dc08f9064cf5e37b63f383f52aa709d0afc1723f > "$RUNNER_TEMP/stage-e/git-identity.txt"
          cp diagnostics/stage-e-fresh-causal-isolation/*.md "$RUNNER_TEMP/stage-e/"
          cp diagnostics/stage-e-fresh-causal-isolation/*.py "$RUNNER_TEMP/stage-e/"
          cp diagnostics/stage-e-fresh-causal-isolation/execution-request.json "$RUNNER_TEMP/stage-e/"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test ! -f diagnostics/stage-e-fresh-causal-isolation/ASTRA_GATE.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify unchanged production and diagnostic arithmetic
        run: |
          python -m py_compile diagnostics/stage-e-fresh-causal-isolation/harness.py diagnostics/stage-e-fresh-causal-isolation/finalize.py
          python diagnostics/stage-e-fresh-causal-isolation/harness.py --selfcheck
          python - <<'PY'
          import importlib.util,json,os
          from pathlib import Path
          p=Path('diagnostics/stage-e-fresh-causal-isolation/harness.py')
          spec=importlib.util.spec_from_file_location('fresh_diag',p);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          root=Path(os.environ['RUNNER_TEMP'])/'stage-e'
          (root/'identity.json').write_text(json.dumps(m.identity(),indent=2)+'\n')
          (root/'environment.json').write_text(json.dumps(m.environment(),indent=2)+'\n')
          request=json.loads(Path('diagnostics/stage-e-fresh-causal-isolation/execution-request.json').read_text())
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('VALIDATE_ONLY='+str(request['validate_only']).lower()+'\n')
          print('ENVIRONMENT '+json.dumps(m.environment()),flush=True)
          PY
      - name: Required deterministic checks (validation request only)
        if: env.VALIDATE_ONLY == 'true'
        run: |
          set -euo pipefail
          python -m unittest discover -v > "$RUNNER_TEMP/stage-e/unittest.log" 2>&1
          tail -n 5 "$RUNNER_TEMP/stage-e/unittest.log"
          python -m tests.resource_check > "$RUNNER_TEMP/stage-e/resource-check.log" 2>&1
          cat "$RUNNER_TEMP/stage-e/resource-check.log"
      - name: Execute one predeclared material variant, with no retry
        if: env.VALIDATE_ONLY == 'false'
        run: |
          set -euo pipefail
          python diagnostics/stage-e-fresh-causal-isolation/harness.py \
            --request diagnostics/stage-e-fresh-causal-isolation/execution-request.json \
            --output "$RUNNER_TEMP/stage-e/variant"
      - name: Hash and summarize bounded evidence even on failure
        if: always()
        run: python diagnostics/stage-e-fresh-causal-isolation/finalize.py --root "$RUNNER_TEMP/stage-e"
      - name: Preserve every execution's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage-e-fresh-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stage-e/
            !${{ runner.temp }}/stage-e/**/runtime/**
          if-no-files-found: error
          retention-days: 90
