name: solana-alpha-wallet-cohort
on:
  push:
    branches: [research/solana-skilled-wallet-alpha]
permissions: {contents: read}
jobs:
  cohort:
    if: contains(github.event.head_commit.message, '[alpha-cohort]')
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - run: python -m tests.solana_alpha_wallet_cohort | tee solana-alpha-wallet-cohort.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: solana-alpha-wallet-cohort-${{ github.run_id }}
          path: |
            solana-alpha-wallet-cohort.json
            solana-alpha-wallet-cohort.log
          retention-days: 7
