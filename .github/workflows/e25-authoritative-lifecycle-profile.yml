name: E25 authoritative lifecycle profile
on:
  push:
    branches: [recovery/stagee25-github-native-publication-20260928]
    paths:
      - '.github/stagee25/profile-trigger.txt'
permissions:
  contents: read
  actions: read
concurrency:
  group: e25-authoritative-lifecycle-profile-final
  cancel-in-progress: false
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 91a77a59f2f8c12f74bd6581e33f59e9446cab21
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 91a77a59f2f8c12f74bd6581e33f59e9446cab21
          test "$(git rev-parse HEAD^{tree})" = 83280acd7c2fd4ce5d20d387668595d8fee8e798
      - name: Install frozen dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check 'websockets==17.1'
      - name: Frozen environment preflight
        run: python -m certification.qualification_environment --output "$RUNNER_TEMP/profile/environment.json"
      - name: Run diagnostic extended lifecycle profile
        timeout-minutes: 35
        run: |
          mkdir -p "$RUNNER_TEMP/profile"
          python -m certification.maintenance_qualification             --trial recovery-1 --output "$RUNNER_TEMP/profile/recovery-1"
      - name: Preserve diagnostic profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e25-authoritative-lifecycle-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/profile/
          if-no-files-found: error
          retention-days: 90
