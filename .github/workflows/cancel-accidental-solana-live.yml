name: cancel-accidental-solana-live
on:
  push:
    branches: [strategy/meteora-fee-density-profitability-v1]
permissions:
  contents: read
jobs:
  cancel-slot:
    if: contains(github.event.head_commit.message, '[cancel-accidental-solana-live]')
    runs-on: ubuntu-24.04
    concurrency:
      group: solana-public-rpc-live
      cancel-in-progress: true
    steps:
      - run: echo "Claimed Solana live concurrency slot to cancel superseded pending/running live diagnostic."
