name: four-lane-dlmm-profitability-verify
on:
  push:
    branches: [cert/four-lane-dlmm-profitability-v1]
permissions:
  contents: write
jobs:
  compose-and-verify:
    if: contains(github.event.head_commit.message, '[four-lane-dlmm-profitability-verify]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify promotion boundaries
        run: |
          python - <<'PY'
          import json
          p=json.load(open("certification/sources.json"))
          m=p["lanes"]["meteora"];r=p["lanes"]["ramses"]
          assert m["execution_certification"]["profitability_authority"] is True
          assert m["execution_certification"]["authenticated_fee_density"]["minimum_24h_percent"]==5.0
          assert m["execution_certification"]["strategy2_continuity_required"] is True
          assert r["execution_certification"]["profitability_authority"] is True
          assert r["validation_boundary"]["minimum_eligible_rebalances"]==20
          assert r["validation_boundary"]["minimum_distinct_pools"]==5
          assert r["validation_boundary"]["consumed_historical_holdout_reuse"] is False
          PY
      - name: Rebase existing Meteora and Ramses operational overlays
        run: |
          set -euo pipefail
          for LANE in meteora ramses; do
            SHA="$(python -c "import json; print(json.load(open('certification/sources.json'))['lanes']['$LANE']['source_sha'])")"
            if [ "$LANE" = meteora ]; then PATCH="meteora-checkpoint.patch"; else PATCH="ramses-admission.patch"; fi
            ROOT="$(mktemp -d)"
            WT="$ROOT/$LANE"
            git fetch origin "$SHA"
            git worktree add --detach "$WT" "$SHA"
            if git -C "$WT" apply --check "$GITHUB_WORKSPACE/certification/patches/$PATCH"; then
              git -C "$WT" apply --index "$GITHUB_WORKSPACE/certification/patches/$PATCH"
            else
              echo "::group::$LANE three-way overlay rebase"
              set +e
              git -C "$WT" apply --3way --index "$GITHUB_WORKSPACE/certification/patches/$PATCH"
              CODE=$?
              set -e
              if [ "$LANE" = meteora ] && test "$(git -C "$WT" diff --name-only --diff-filter=U)" = "tests/solana_dlmm_independent_v1.py"; then
                python "$GITHUB_WORKSPACE/certification/resolve_dlmm_profit_overlay.py" meteora "$WT/tests/solana_dlmm_independent_v1.py"
                git -C "$WT" add tests/solana_dlmm_independent_v1.py
                CODE=0
              fi
              if [ "$LANE" = ramses ] && test "$(git -C "$WT" diff --name-only --diff-filter=U)" = "robinhood_research/ramses_universe.py"; then
                python "$GITHUB_WORKSPACE/certification/resolve_dlmm_profit_overlay.py" ramses "$WT/robinhood_research/ramses_universe.py"
                git -C "$WT" add robinhood_research/ramses_universe.py
                CODE=0
              fi
              if [ "$CODE" -ne 0 ] || test -n "$(git -C "$WT" diff --name-only --diff-filter=U)"; then
                git -C "$WT" status --short
                git -C "$WT" diff --cc || true
                echo "::endgroup::"
                exit 31
              fi
              echo "::endgroup::"
            fi
            git -C "$WT" diff --check
            git -C "$WT" diff --binary HEAD > "$GITHUB_WORKSPACE/certification/patches/$PATCH.next"
            mv "$GITHUB_WORKSPACE/certification/patches/$PATCH.next" "$GITHUB_WORKSPACE/certification/patches/$PATCH"
            git worktree remove --force "$WT"
            rm -rf "$ROOT"
          done
          git diff --check -- certification/patches/meteora-checkpoint.patch certification/patches/ramses-admission.patch
      - name: Persist canonical rebased overlays
        run: |
          if git diff --quiet -- certification/patches/meteora-checkpoint.patch certification/patches/ramses-admission.patch; then
            echo "DLMM operational overlays already canonical for promoted sources."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add certification/patches/meteora-checkpoint.patch certification/patches/ramses-admission.patch
            git commit -m "[qualification-build] canonicalize DLMM profitability overlays"
            git push origin HEAD:cert/four-lane-dlmm-profitability-v1
          fi
      - name: Supervisor deterministic suite
        run: python -m unittest discover -s certification/tests -v
      - name: Build exact isolated lane worktrees
        run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/dlmm-profit-worktrees"
      - name: Full four-lane deterministic suites and resource gates
        run: |
          set +e
          python -m certification.run verify --worktrees "$RUNNER_TEMP/dlmm-profit-worktrees" --output certification-dlmm-profit-gates
          CODE=$?
          if [ "$CODE" -ne 0 ]; then
            for LOG in certification-dlmm-profit-gates/*-gate-*.log; do
              echo "::group::$LOG"
              cat "$LOG"
              echo "::endgroup::"
            done
          fi
          exit "$CODE"
      - name: Preserve deterministic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: four-lane-dlmm-profitability-gates
          path: certification-dlmm-profit-gates/
          if-no-files-found: warn
          retention-days: 90
