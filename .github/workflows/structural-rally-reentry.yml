name: Structural rally reentry offline regression
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'meme_machine/runtime/rally_cycles.py'
      - 'meme_machine/runtime/survivor_risk.py'
      - 'meme_machine/runtime/survivor_history.py'
      - 'meme_machine/runtime/policy_compatibility.py'
      - 'meme_machine/paper_policy_revision.py'
      - 'meme_machine/lanes/pump/pumpswap_survivor.py'
      - 'meme_machine/lanes/pump/pumpswap_survivor_runtime.py'
      - 'meme_machine/lanes/pons/pons_postgrad_survivor.py'
      - 'meme_machine/lanes/pons/pons_survivor_runtime.py'
      - 'tests/test_structural_rally_reentry.py'
      - '.github/workflows/structural-rally-reentry.yml'
permissions:
  contents: read
jobs:
  focused-rally:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile changed strategy paths
        run: |
          python -m compileall -q meme_machine/runtime/rally_cycles.py meme_machine/runtime/survivor_risk.py meme_machine/runtime/survivor_history.py meme_machine/runtime/policy_compatibility.py meme_machine/paper_policy_revision.py meme_machine/lanes/pump/pumpswap_survivor.py meme_machine/lanes/pump/pumpswap_survivor_runtime.py meme_machine/lanes/pons/pons_postgrad_survivor.py meme_machine/lanes/pons/pons_survivor_runtime.py tests/test_structural_rally_reentry.py
      - name: Run focused guarded PAPER-only offline tests
        env:
          MM_MODE: PAPER
        run: |
          python -m operational.tests FAST --modules \
            tests.test_structural_rally_reentry \
            tests.lanes.pump.test_pumpswap_survivor \
            tests.lanes.pons.test_pons_postgrad_survivor \
            tests.test_current_survivor_independence \
            tests.test_paper_policy_compatibility
          python -m operational.tests OPERATIONAL --modules \
            tests.test_survivor_commit \
            tests.test_sleeve_prefix_recovery
