name: ramses-historical-lp-signal-join
on:
  push:
    branches: [research/ramses-dlmm-historical-market-v1]
permissions:
  actions: read
  contents: read
jobs:
  join:
    if: contains(github.event.head_commit.message, '[ramses-lp-signal-join]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Download latest indexed history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          aid="$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name | startswith("ramses-historical-index-")) and (.name | contains("summary") | not) and (.name | contains("probe") | not) and (.size_in_bytes > 1000000)) | [.created_at, (.id|tostring)] | @tsv' | sort -r | head -1 | cut -f2)"
          test -n "$aid"
          gh api "repos/${{ github.repository }}/actions/artifacts/$aid/zip" > /tmp/index.zip
          unzip -q /tmp/index.zip -d /tmp/index
          cp /tmp/index/ramses-historical-index-data.json.gz .
      - name: Download corrected LP outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          aid="$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name | startswith("ramses-historical-lp-outcomes-"))) | [.created_at, (.id|tostring)] | @tsv' | sort -r | head -1 | cut -f2)"
          test -n "$aid"
          gh api "repos/${{ github.repository }}/actions/artifacts/$aid/zip" > /tmp/lp.zip
          unzip -q /tmp/lp.zip -d /tmp/lp
          cp /tmp/lp/ramses-historical-lp-outcomes.json .
      - run: python -m robinhood_research.ramses_historical_lp_signal_join
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ramses-historical-lp-signal-join-${{ github.run_id }}
          path: ramses-historical-lp-signal-join.json
          retention-days: 90
