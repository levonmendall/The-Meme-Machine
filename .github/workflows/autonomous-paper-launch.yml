name: Autonomous PAPER external launch request
on:
  push:
    branches: [launch/autonomous-paper-v1]
permissions:
  contents: write
  actions: write
concurrency:
  group: autonomous-paper-market
  cancel-in-progress: false
jobs:
  request:
    if: contains(github.event.head_commit.message, '[autonomous-paper-request]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Read the explicit external request without executing its text
        id: request
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from certification.autonomous_launch import request
          from certification.single_campaign_control import first_attempt
          first_attempt(os.environ['GITHUB_RUN_ATTEMPT'])
          value=request(json.loads(Path('.github/autonomous-paper-launch-request.json').read_text()))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              for key,value in value.items():
                  output.write(f'{key}={value}\n')
          PY
      - name: Use only the exact runtime source named in the request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.request.outputs.runtime_sha }}
          persist-credentials: false
      - name: Verify the real dispatch contract and consume one request before POST
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_OPERATION: ${{ steps.request.outputs.operation }}
          REQUEST_RUNTIME_SHA: ${{ steps.request.outputs.runtime_sha }}
          REQUEST_RUNTIME_REF: ${{ steps.request.outputs.runtime_ref }}
          REQUEST_CAMPAIGN_ID: ${{ steps.request.outputs.campaign_id }}
          REQUEST_CERTIFICATION_RUN_ID: ${{ steps.request.outputs.certification_run_id }}
          REQUEST_REVIEWED_ARTIFACT_DIGEST: ${{ steps.request.outputs.reviewed_artifact_digest }}
          REQUEST_MAXIMUM_NORMAL_WINDOWS: ${{ steps.request.outputs.maximum_normal_windows }}
        run: python -m certification.autonomous_launch --output autonomous-launch-receipt.json
      - name: Preserve launch or read-only control-plane receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: autonomous-launch-${{ github.run_id }}-${{ github.run_attempt }}
          path: autonomous-launch-receipt.json
          if-no-files-found: warn
          retention-days: 90
