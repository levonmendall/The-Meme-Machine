name: ramses-public-lp-skill-analysis
on:
  push:
    branches: [research/ramses-public-lp-skill-v1]
permissions:
  actions: read
  contents: read
jobs:
  analyze:
    if: contains(github.event.head_commit.message, '[ramses-lp-skill]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Download latest corrected fee decomposition
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          aid="$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100"             --jq '.artifacts[] | select(.expired == false and (.name | startswith("ramses-historical-fee-decomposition-")) and (.size_in_bytes > 50000)) | [.created_at, (.id|tostring)] | @tsv'             | sort -r | head -1 | cut -f2)"
          test -n "$aid"
          gh api "repos/${{ github.repository }}/actions/artifacts/$aid/zip" > /tmp/decomp.zip
          unzip -p /tmp/decomp.zip ramses-historical-fee-decomposition.json > ramses-historical-fee-decomposition.json
      - run: python -m py_compile robinhood_research/ramses_public_lp_skill_analysis.py
      - run: python -m robinhood_research.ramses_public_lp_skill_analysis
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ramses-public-lp-skill-${{ github.run_id }}
          path: ramses-public-lp-skill-analysis.json
          if-no-files-found: warn
          retention-days: 90
