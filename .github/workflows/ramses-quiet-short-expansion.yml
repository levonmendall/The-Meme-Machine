name: ramses-quiet-short-expansion
on:
  push:
    branches: [research/ramses-quiet-escalation-v1]
permissions:
  actions: read
  contents: read
jobs:
  replay:
    if: contains(github.event.head_commit.message, '[ramses-short-expand]')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: ramses-quiet-short-expansion
      cancel-in-progress: false
    env:
      MM_ROBINHOOD_READ_RPC_URL: ${{ secrets.MM_ROBINHOOD_READ_RPC_URL }}
      MM_ROBINHOOD_DLMM_RPC_URL: ${{ secrets.MM_ROBINHOOD_DLMM_RPC_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify equivalent fast historical log retrieval
        run: python -m unittest robinhood_tests.test_ramses_historical_fast_logs -v
      - name: Download complete Ramses indexed history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          aid="$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100"             --jq '.artifacts[] | select(.expired == false and (.name | startswith("ramses-historical-index-")) and (.name | contains("summary") | not) and (.name | contains("probe") | not) and (.size_in_bytes > 1000000)) | [.created_at, (.id|tostring)] | @tsv'             | sort -r | head -1 | cut -f2)"
          test -n "$aid"
          gh api "repos/${{ github.repository }}/actions/artifacts/$aid/zip" > /tmp/index.zip
          mkdir -p /tmp/index
          unzip -q /tmp/index.zip -d /tmp/index
          cp /tmp/index/ramses-historical-index-data.json.gz .
      - name: Download frozen Branch-A decision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          aid="$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100"             --jq '.artifacts[] | select(.expired == false and (.name | startswith("ramses-quiet-branch-decision-"))) | [.created_at, (.id|tostring)] | @tsv'             | sort -r | head -1 | cut -f2)"
          test -n "$aid"
          gh api "repos/${{ github.repository }}/actions/artifacts/$aid/zip" > /tmp/decision.zip
          unzip -p /tmp/decision.zip ramses-quiet-branch-decision.json > ramses-quiet-branch-decision.json
      - run: python -m py_compile robinhood_research/ramses_quiet_short_expansion.py
      - run: python -m robinhood_research.ramses_quiet_short_expansion
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ramses-quiet-short-expansion-${{ github.run_id }}
          path: ramses-quiet-short-expansion.json
          if-no-files-found: warn
          retention-days: 90
