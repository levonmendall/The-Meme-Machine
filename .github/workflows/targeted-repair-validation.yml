name: targeted-repair-validation
on:
  workflow_dispatch:
    inputs:
      lane:
        description: Localized repair lane or control plane
        required: true
        type: choice
        options: [pump, pons, meteora, ramses, control]
permissions:
  contents: read
  actions: read
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Prepare exact-source worktrees
        if: inputs.lane != 'control'
        run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/targeted-lanes"
      - name: Run bounded repair regressions
        env:
          LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          case "$LANE" in
            pump)
              (cd "$RUNNER_TEMP/targeted-lanes/pump" && python -m unittest tests.test_solana_evidence_broker tests.test_evidence_consumers tests.test_pump_acceleration_history tests.test_market_scope_efficiency -v)
              ;;
            pons)
              (cd "$RUNNER_TEMP/targeted-lanes/pons" && python -m unittest robinhood_tests.test_pons_partial_accounting robinhood_tests.test_pons_position_provider_recovery robinhood_tests.test_pons_cohort_capital robinhood_tests.test_pons_selective_continuation robinhood_tests.test_pons_market_scope_efficiency -v)
              ;;
            meteora)
              (cd "$RUNNER_TEMP/targeted-lanes/meteora" && python -m unittest tests.test_dlmm_alchemy_provider tests.test_solana_dlmm_independent_v1 tests.test_dlmm_tape_extensions tests.test_meteora_market_scope_efficiency -v)
              (cd "$RUNNER_TEMP/targeted-lanes/meteora" && PYTHONPATH="$RUNNER_TEMP/targeted-lanes/meteora:$GITHUB_WORKSPACE" python "$GITHUB_WORKSPACE/certification/meteora_position_recovery_check.py")
              ;;
            ramses)
              (cd "$RUNNER_TEMP/targeted-lanes/ramses" && python -m unittest robinhood_tests.test_ramses_connected_lifecycle robinhood_tests.test_ramses_rate_limit robinhood_tests.test_ramses_strategy robinhood_tests.test_ramses_strategy_isolation robinhood_tests.test_ramses_continuous_campaign robinhood_tests.test_ramses_market_scope_efficiency robinhood_tests.test_ramses_universe robinhood_tests.test_ramses_viability_v4_replay -v)
              ;;
            control)
              python -m unittest certification.tests.test_single_campaign_control certification.tests.test_guard certification.tests.test_prospective_program -v
              ;;
            *) exit 2 ;;
          esac
      - name: Record bounded validation boundary
        env:
          LANE: ${{ inputs.lane }}
        run: |
          mkdir -p targeted-validation
          python - <<'PY'
          import json,os
          json.dump({
            "schema":"meme-machine-targeted-repair-validation-v1",
            "lane":os.environ["LANE"],
            "market_certificate":False,
            "requires_full_composition_certificate_before_launch":True
          },open("targeted-validation/result.json","w"),sort_keys=True,indent=2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: targeted-repair-${{ inputs.lane }}-${{ github.sha }}
          path: targeted-validation/result.json
          retention-days: 30
