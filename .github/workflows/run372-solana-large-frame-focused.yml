name: Run 372 Solana large-frame focused regressions
on:
  push:
    branches: [repair/run372-solana-large-frame-20260926]
permissions:
  contents: read
  actions: read
jobs:
  focused:
    if: contains(github.event.head_commit.message, '[run372-large-frame]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MM_REAL_IPC_TESTS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Root large-frame transport regression
        run: |
          python -m unittest \
            tests.test_run372_large_frame_runtime \
            tests.test_solana_evidence_service_runtime -v
      - name: Prepare exact four-lane runtime
        run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/run372-large-frame-lanes"
      - name: Prepared Pump and Meteora large-frame regressions
        run: |
          for lane in pump meteora; do
            (
              cd "$RUNNER_TEMP/run372-large-frame-lanes/$lane"
              PYTHONPATH="$RUNNER_TEMP/run372-large-frame-lanes/$lane:$GITHUB_WORKSPACE" \
                python -m unittest tests.test_run372_large_frame_runtime -v
              grep -q "asyncio.to_thread(decode_source_message" meme_machine/solana_evidence_service.py
              grep -q "STREAM_DISPATCH_MAX_BYTES" meme_machine/solana_evidence_service.py
              ! grep -q "message=json.loads(raw);config.public(message)" meme_machine/solana_evidence_service.py
            )
          done
      - name: Record exact prepared Solana lane diff identities
        run: |
          for lane in pump meteora; do
            HASH="$(git -C "$RUNNER_TEMP/run372-large-frame-lanes/$lane" diff --binary --full-index --no-ext-diff --no-textconv --no-renames HEAD | sha256sum | awk '{print $1}')"
            echo "$(echo "$lane" | tr '[:lower:]' '[:upper:]')_EXACT_DIFF_SHA256=$HASH"
          done
