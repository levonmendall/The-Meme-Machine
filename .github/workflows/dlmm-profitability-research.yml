name: dlmm-profitability-research
on:
  push:
    branches:
      - research/dlmm-point-in-time-replay
permissions:
  contents: read
jobs:
  pilot:
    if: contains(github.event.head_commit.message, '[dlmm-profitability-pilot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: solana-public-rpc-live
      cancel-in-progress: false
    env:
      MM_DLMM_STRATEGY_REPORT: dlmm-profitability-pilot.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Profitability research regressions
        run: python -m unittest tests.test_dlmm_strategy_point_in_time tests.test_dlmm_strategy_high_activity tests.test_dlmm_dense_acquisition -v
      - name: First bounded multi-pool profitability batch
        env:
          MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
        run: python -m tests.dlmm_profitability_pilot --cycles 1 --window-seconds 12
      - name: Preserve profitability batch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-profitability-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: dlmm-profitability-pilot.json
          if-no-files-found: warn
          retention-days: 60
