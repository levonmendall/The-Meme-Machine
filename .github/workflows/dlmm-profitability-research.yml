name: dlmm-profitability-research
on:
  push:
    branches:
      - research/dlmm-point-in-time-replay
permissions:
  contents: read
jobs:
  development:
    if: ${{ false }} # 60-second strategy is on research hold; see DLMM_60S_RESEARCH_HOLD.json
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: dlmm-alchemy-solana-live
      cancel-in-progress: false
    env:
      MM_DLMM_STRATEGY_REPORT: dlmm-profitability-development.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate Alchemy Solana route
        env:
          MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
        run: python -m tests.dlmm_alchemy_provider
      - name: Economic strategy research regressions
        run: python -m unittest tests.test_dlmm_strategy_point_in_time tests.test_dlmm_strategy_high_activity tests.test_dlmm_dense_acquisition tests.test_dlmm_strategy_economics tests.test_dlmm_strategy_development_analysis tests.test_dlmm_profitability_pilot -v
      - name: Development sample with real 60-second holding horizon
        env:
          MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
        run: python -m tests.dlmm_profitability_pilot --target-completed 6 --max-attempted-pools 24 --warmup-seconds 12 --holding-seconds 60 --study-phase development
      - name: Preserve development sample
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-profitability-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: dlmm-profitability-development.json
          if-no-files-found: warn
          retention-days: 90

  holdout:
    if: ${{ false }} # legacy 60-second holdout is also frozen during research hold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: dlmm-alchemy-solana-live
      cancel-in-progress: false
    env:
      MM_DLMM_STRATEGY_REPORT: dlmm-profitability-holdout.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate Alchemy Solana route
        env:
          MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
        run: python -m tests.dlmm_alchemy_provider
      - name: Frozen-rule holdout regressions
        run: python -m unittest tests.test_dlmm_strategy_economics tests.test_dlmm_profitability_pilot -v
      - name: Holdout sample with frozen rule only
        env:
          MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
        run: python -m tests.dlmm_profitability_pilot --target-completed 6 --max-attempted-pools 12 --warmup-seconds 12 --holding-seconds 60 --study-phase holdout
      - name: Preserve holdout sample
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-profitability-holdout-${{ github.run_id }}-${{ github.run_attempt }}
          path: dlmm-profitability-holdout.json
          if-no-files-found: warn
          retention-days: 90
