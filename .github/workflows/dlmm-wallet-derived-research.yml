name: dlmm-wallet-derived-research
on:
  push:
    branches:
      - research/dlmm-wallet-derived-discovery
permissions:
  contents: read

jobs:
  discovery:
    if: contains(github.event.head_commit.message, '[dlmm-wallet-cohort-discovery]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: dlmm-alchemy-solana-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Wallet-study regression gate
        run: python -m unittest tests.test_dlmm_wallet_strategy_discovery -v
      - name: Validate Alchemy Solana route
        env:
          MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
        run: python -m tests.dlmm_alchemy_provider
      - name: Discover recent LP actors without PnL reads
        env:
          MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
        run: python -m tests.dlmm_wallet_strategy_discovery discover
      - name: Preserve candidate wallet cohort
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-wallet-cohort-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: dlmm-wallet-cohort-discovery.json
          if-no-files-found: warn
          retention-days: 90

  analysis:
    if: contains(github.event.head_commit.message, '[dlmm-wallet-cohort-analysis]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Wallet-study regression gate
        run: python -m unittest tests.test_dlmm_wallet_strategy_discovery -v
      - name: Analyze frozen cohort only
        run: python -m tests.dlmm_wallet_strategy_discovery analyze --cohort DLMM_WALLET_COHORT_V1.json
      - name: Preserve wallet-derived behavior analysis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-wallet-derived-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: dlmm-wallet-derived-analysis.json
          if-no-files-found: warn
          retention-days: 90
