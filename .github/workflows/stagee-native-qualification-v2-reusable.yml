name: Stage E native v2 assembled deterministic checks only
on:
  workflow_call:
    inputs:
      expected_sha:
        type: string
        required: true
      plan_hash:
        type: string
        required: true
      input_manifest_hash:
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  MM_EXPECTED_SHA: ${{ inputs.expected_sha }}
  MM_PLAN_HASH: ${{ inputs.plan_hash }}
  MM_INPUT_HASH: ${{ inputs.input_manifest_hash }}
  MM_WORKFLOW_SHA: ${{ github.workflow_sha }}
  MM_WORKFLOW_REF: ${{ github.workflow_ref }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  qualification_preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.assembly.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -B -m pip install --disable-pip-version-check websockets==17.1
      - name: Declare verified workflow identity and exact candidate assembly
        id: assembly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B -m certification.stage_e_native_v2.transport declare --output "$RUNNER_TEMP/workflow.json"
          candidate_tree=$(git rev-parse "$MM_EXPECTED_SHA^{tree}")
          assembly_digest=$(python -B -m certification.stage_e_native_v2 assemble --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/assembly" --candidate "$MM_EXPECTED_SHA" --tree "$candidate_tree" --plan-hash "$MM_PLAN_HASH" --input-hash "$MM_INPUT_HASH" --workflow "$RUNNER_TEMP/workflow.json")
          echo "digest=$assembly_digest" >> "$GITHUB_OUTPUT"
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/assembly.tar" assembly
          mkdir "$RUNNER_TEMP/preflight-artifact"
          cp "$RUNNER_TEMP/assembly.tar" "$RUNNER_TEMP/preflight-artifact/assembly.tar"
          mkdir "$RUNNER_TEMP/preflight"
          (
            cd "$RUNNER_TEMP/preflight"
            env -i PATH="$PATH" LANG="${LANG:-C.UTF-8}" PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 MM_STAGE_E_V2_ASSEMBLY="$RUNNER_TEMP/assembly" MM_STAGE_E_V2_DIGEST="$assembly_digest" MM_STAGE_E_V2_CANDIDATE="$MM_EXPECTED_SHA" python -I -S "$RUNNER_TEMP/assembly/source/certification/stage_e_native_v2/bootstrap.py" --case preflight --output "$RUNNER_TEMP/preflight" > "$RUNNER_TEMP/preflight/process.log" 2>&1
          )
      - name: Preserve preflight evidence on both success and failure
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/preflight-artifact"
          if [ -f "$RUNNER_TEMP/preflight/raw-trial-v2.json" ]; then
            cp "$RUNNER_TEMP/preflight/raw-trial-v2.json" "$RUNNER_TEMP/preflight-artifact/raw-trial-v2.json"
          fi
          if [ -f "$RUNNER_TEMP/preflight/process.log" ]; then
            cp "$RUNNER_TEMP/preflight/process.log" "$RUNNER_TEMP/preflight-artifact/process.log"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-v2-${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-preflight
          path: ${{ runner.temp }}/preflight-artifact/
          if-no-files-found: error
          retention-days: 90
  trial:
    needs: qualification_preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        case: [clock-contract, run379-setup, native-transitions, held-reader, generation-restart, m1-completion]
    env:
      MM_ASSEMBLY_DIGEST: ${{ needs.qualification_preflight.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -B -m pip install --disable-pip-version-check websockets==17.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-v2-${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-preflight
          path: ${{ runner.temp }}/preflight-artifact
      - name: Verify and execute the identical preflight assembly
        env:
          MM_CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          python -B -m certification.stage_e_native_v2.transport extract-assembly --archive "$RUNNER_TEMP/preflight-artifact/assembly.tar" --output "$RUNNER_TEMP/assembly" --digest "$MM_ASSEMBLY_DIGEST"
          mkdir "$RUNNER_TEMP/trial-preflight" "$RUNNER_TEMP/raw"
          (
            cd "$RUNNER_TEMP/trial-preflight"
            env -i PATH="$PATH" LANG="${LANG:-C.UTF-8}" PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 MM_STAGE_E_V2_ASSEMBLY="$RUNNER_TEMP/assembly" MM_STAGE_E_V2_DIGEST="$MM_ASSEMBLY_DIGEST" MM_STAGE_E_V2_CANDIDATE="$MM_EXPECTED_SHA" python -I -S "$RUNNER_TEMP/assembly/source/certification/stage_e_native_v2/bootstrap.py" --case preflight --output "$RUNNER_TEMP/trial-preflight" > "$RUNNER_TEMP/trial-preflight/process.log" 2>&1
          )
          (
            cd "$RUNNER_TEMP/raw"
            env -i PATH="$PATH" LANG="${LANG:-C.UTF-8}" PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 MM_STAGE_E_V2_ASSEMBLY="$RUNNER_TEMP/assembly" MM_STAGE_E_V2_DIGEST="$MM_ASSEMBLY_DIGEST" MM_STAGE_E_V2_CANDIDATE="$MM_EXPECTED_SHA" python -I -S "$RUNNER_TEMP/assembly/source/certification/stage_e_native_v2/bootstrap.py" --case "$MM_CASE" --output "$RUNNER_TEMP/raw" > "$RUNNER_TEMP/raw/process.log" 2>&1
          )
      - name: Preserve unique raw trial identity
        id: receipt
        if: always()
        run: |
          python -B -m certification.stage_e_native_v2.transport trial-id --raw "$RUNNER_TEMP/raw/raw-trial-v2.json" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-v2-${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.case }}-${{ steps.receipt.outputs.trial_id }}
          path: |
            ${{ runner.temp }}/raw/raw-trial-v2.json
            ${{ runner.temp }}/raw/process.log
          if-no-files-found: error
          retention-days: 90
  aggregate:
    needs: [qualification_preflight, trial]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MM_ASSEMBLY_DIGEST: ${{ needs.qualification_preflight.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -B -m pip install --disable-pip-version-check websockets==17.1
      - name: Re-read immutable original artifacts and aggregate every declared case
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B -m certification.stage_e_native_v2.transport aggregate-github --digest "$MM_ASSEMBLY_DIGEST" --output "$RUNNER_TEMP/aggregate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-v2-${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-aggregate
          path: ${{ runner.temp }}/aggregate/
          if-no-files-found: error
          retention-days: 90
