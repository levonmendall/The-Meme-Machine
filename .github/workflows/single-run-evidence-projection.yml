name: single-run-evidence-projection
on:
  push:
    branches: [review/evidence-reconstruction-single-20260924]
permissions:
  contents: read
  actions: read
jobs:
  project-existing-evidence:
    if: contains(github.event.head_commit.message, '[single-run-evidence-projection]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Copy digest-verified completed evidence without market access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python certification/single_run_evidence_projection.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: single-run-evidence-projection-${{ github.run_id }}
          path: single-run-evidence-projection/
          if-no-files-found: error
          retention-days: 90
