name: E27 exact-candidate continuation through canonical Phase E
on:
  push:
    branches: [recovery/stagee25-github-native-publication-20260928]
    paths: ['.github/stagee27/continue-trigger.txt']
permissions:
  contents: write
  actions: write
concurrency:
  group: e27-exact-candidate-continuation
  cancel-in-progress: false
jobs:
  continue-existing-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: control
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: runtime
          ref: 9356068cc92f9cadbd35adead3c33b532cbd4268
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r runtime/requirements.txt
      - name: Preserve immutable candidate and complete Git history before continuation
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e27-exact-source"
          test "$(git rev-parse HEAD)" = 9356068cc92f9cadbd35adead3c33b532cbd4268
          test "$(git rev-parse HEAD^{tree})" = b7fea73f83b29e569b9c8ffde47ae11ecb04cf1d
          test "$(git rev-parse HEAD^)" = fdeee2721d2bb63e0ff3234328b06936257493b1
          test -z "$(git status --porcelain)"
          git cat-file commit HEAD > "$RUNNER_TEMP/e27-exact-source/commit.raw"
          git show -s --format='%H%n%T%n%P' HEAD > "$RUNNER_TEMP/e27-exact-source/identity.txt"
          git fsck --full --no-reflogs > "$RUNNER_TEMP/e27-exact-source/git-fsck.log" 2>&1
          git bundle create "$RUNNER_TEMP/e27-exact-source/exact-source-history.bundle" --all
          cd "$RUNNER_TEMP/e27-exact-source"
          sha256sum * > SHA256SUMS
      - name: Publish exact source package independently of long-running checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e27-exact-source-9356068-${{ github.run_id }}
          path: ${{ runner.temp }}/e27-exact-source/
          if-no-files-found: error
          retention-days: 90
      - name: Offline control safety tests before any dispatch authority
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e27-driver-checks"
          python "$GITHUB_WORKSPACE/control/.github/stagee27/test_continue_phase_e.py" \
            2>&1 | tee "$RUNNER_TEMP/e27-driver-checks/control-safety-tests.log"
      - name: Follow existing cohort, required full verification, then official exact-SHA promotion
        working-directory: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$GITHUB_WORKSPACE/control/.github/stagee27/continue_phase_e.py"
      - name: Preserve receipts and failure state; never dispatch Phase F
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e27-phase-e-continuation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/e27-phase-e-continuation/
            ${{ runner.temp }}/e27-driver-checks/
          if-no-files-found: error
          retention-days: 90
