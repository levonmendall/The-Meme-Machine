name: E23 maintenance outcomes fixed-cohort qualification
on:
  push:
    branches: [review/stagee23-maintenance-semantics-20260928]
permissions:
  contents: read
  actions: read
concurrency:
  group: stagee23-maintenance-semantics
  cancel-in-progress: false
env:
  EXPECTED_RUNTIME: 449f2cc967dffc9a8f73818a380bed6ea8e8f6e7
  BASE: e0816bff7efedcb4009d1db1151c25776f54a88b
  PLAN_SHA256: c0c34db52972da53f71739f9832b10af40803e93f245026595eda7561af9624c
  CANONICAL_PARENT: a775849c940d48bc8f809e99c075e421744bc53f
jobs:
  publish-reviewed-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and publish exact local repair objects to isolated repair branch
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          parts=sorted(Path('.github/e23-source').glob('part-*.bin'))
          assert len(parts)==21
          data=b''.join(p.read_bytes() for p in parts)
          assert len(data)==18620
          assert hashlib.sha256(data).hexdigest()=='7827175157ac44df69cc29fd1207922e8b48fad5e6442ab0d63f16e4d29da9e9'
          Path('/tmp/e23-repair.bundle').write_bytes(data)
          PY
          git bundle verify /tmp/e23-repair.bundle
          git fetch /tmp/e23-repair.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_RUNTIME"
          test "$(git rev-parse "$EXPECTED_RUNTIME^{tree}")" = a39e00d5ff3a2d24d7ca303b016ca977ea5d6525
          git merge-base --is-ancestor "$BASE" "$EXPECTED_RUNTIME"
          git diff --exit-code "$BASE" "$EXPECTED_RUNTIME" -- certification/combined_pressure.py certification/run381_pressure.py certification/pressure_diagnostics.py certification/cleanup_recovery.py certification/cleanup_recovery_plan.json tests/test_run373_dispatch_throughput.py tests/test_run380_production_pressure.py certification/tests/fixtures/run380-production-templates.json.gz
          prior="$(git ls-remote origin refs/heads/repair/stagee23-maintenance-outcomes-20260928 | cut -f1)"
          test -z "$prior" || test "$prior" = "$EXPECTED_RUNTIME"
          git push origin "$EXPECTED_RUNTIME:refs/heads/repair/stagee23-maintenance-outcomes-20260928"
  focused:
    needs: publish-reviewed-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 449f2cc967dffc9a8f73818a380bed6ea8e8f6e7
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Complete build preflight and focused preservation/observation/dispatch tests
        env:
          MM_TEST_LANE_WORKTREES: ${{ runner.temp }}/e23-lanes
        run: |
          set -euo pipefail
          mkdir -p e23-evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_RUNTIME"
          python -c 'import os; from certification.maintenance_qualification import qualification; from certification.cleanup_recovery import frozen_inputs,plan_hash; exec("with qualification():\n assert frozen_inputs()\n assert plan_hash()==os.environ[\"PLAN_SHA256\"]")'
          python -m certification.run prepare --worktrees "$RUNNER_TEMP/e23-lanes" > e23-evidence/prepare.log 2>&1
          python -m certification.build_consistency verify --worktrees "$RUNNER_TEMP/e23-lanes" --expected-sha "$EXPECTED_RUNTIME" --output e23-evidence/build.json
          python -m unittest -v tests.test_retention_outcomes tests.test_stagee21_retention_access_path tests.test_run381_retention_progress tests.test_run381_maintenance_overlap tests.test_run381_archive_scheduling tests.test_run381_archive_canonical tests.test_solana_evidence_retention tests.test_checkpoint_handoff tests.test_archive_pipeline tests.test_run379_transport_backpressure tests.test_stagee19_maintenance_batch_fairness certification.tests.test_build_consistency certification.tests.test_cleanup_recovery certification.tests.test_autonomous_policy_preservation certification.tests.test_dispatch_phase_e certification.tests.test_combined_observer certification.tests.test_combined_pressure certification.tests.test_final_acceptance > e23-evidence/focused.log 2>&1
          python -c 'import sys,sqlite3,websockets; print(sys.version,sqlite3.sqlite_version,websockets.__version__)' > e23-evidence/versions.txt
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e23-focused-${{ github.run_id }}
          path: e23-evidence/
          retention-days: 90
          if-no-files-found: error
  fixed-trial:
    needs: focused
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        trial: [combined-1, combined-2, combined-3, recovery-1]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TRIAL: ${{ matrix.trial }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 449f2cc967dffc9a8f73818a380bed6ea8e8f6e7
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify exact commit and frozen preregistered plan on fresh runner
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$EXPECTED_RUNTIME"
          mkdir -p e23-evidence
          python -c 'import os; from certification.maintenance_qualification import qualification; from certification.cleanup_recovery import frozen_inputs,plan_hash; exec("with qualification():\n assert frozen_inputs()\n assert plan_hash()==os.environ[\"PLAN_SHA256\"]")'
          python -m certification.run prepare --worktrees "$RUNNER_TEMP/e23-lanes" > e23-evidence/prepare.log 2>&1
          python -m certification.build_consistency verify --worktrees "$RUNNER_TEMP/e23-lanes" --expected-sha "$EXPECTED_RUNTIME" --output e23-evidence/build.json
      - name: Execute one fixed trial without retries; retain actual failure exit
        run: |
          set +e
          python -u -m certification.maintenance_qualification --trial "$TRIAL" --output "e23-evidence/$TRIAL" > "e23-evidence/$TRIAL.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "e23-evidence/$TRIAL-exit-code.txt"
          test "$(git rev-parse HEAD)" = "$EXPECTED_RUNTIME"
          git diff --exit-code HEAD
          tail -n 3 "e23-evidence/$TRIAL.log"
          exit "$code"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e23-trial-${{ matrix.trial }}-${{ github.run_id }}
          path: e23-evidence/
          retention-days: 90
          if-no-files-found: error
  fixed-acceptance:
    needs: [focused, fixed-trial]
    if: always() && needs.focused.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 449f2cc967dffc9a8f73818a380bed6ea8e8f6e7
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: e23-trial-*-${{ github.run_id }}
          path: ${{ runner.temp }}/fixed-e23
      - name: Recompute all four trial decisions from raw artifacts
        run: |
          mkdir -p e23-evidence
          python -m certification.maintenance_qualification --aggregate "$RUNNER_TEMP/fixed-e23" --expected-sha "$EXPECTED_RUNTIME" --output e23-evidence/cohort.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e23-accepted-${{ github.run_id }}
          path: e23-evidence/
          retention-days: 90
          if-no-files-found: error
  complete-verification:
    needs: fixed-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 449f2cc967dffc9a8f73818a380bed6ea8e8f6e7
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Full native supervisor and six-regime checks on exact candidate
        env:
          MM_TEST_LANE_WORKTREES: ${{ runner.temp }}/e23-lanes
        run: |
          set -euo pipefail
          mkdir -p e23-evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_RUNTIME"
          python -m certification.run prepare --worktrees "$RUNNER_TEMP/e23-lanes" > e23-evidence/prepare.log 2>&1
          python -m certification.build_consistency verify --worktrees "$RUNNER_TEMP/e23-lanes" --expected-sha "$EXPECTED_RUNTIME" --output e23-evidence/build.json
          python -m unittest discover -v > e23-evidence/generic.log 2>&1
          python -m certification.non_market --worktrees "$RUNNER_TEMP/e23-lanes" --output e23-evidence/native > e23-evidence/native.log 2>&1
          python -m certification.directional_acceptance --worktrees "$RUNNER_TEMP/e23-lanes" --output e23-evidence/six-regime
          python -m certification.build_consistency verify --worktrees "$RUNNER_TEMP/e23-lanes" --expected-sha "$EXPECTED_RUNTIME" --output e23-evidence/final-build.json
          git diff --exit-code HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e23-complete-${{ github.run_id }}
          path: e23-evidence/
          retention-days: 90
          if-no-files-found: error
  canonical-dispatch:
    needs: complete-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 449f2cc967dffc9a8f73818a380bed6ea8e8f6e7
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: e23-trial-*-${{ github.run_id }}
          path: ${{ runner.temp }}/fixed-e23
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: e23-complete-${{ github.run_id }}
          path: ${{ runner.temp }}/complete-e23
      - name: Publish unchanged verified tree then explicitly dispatch and verify canonical run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p e23-evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_RUNTIME"
          python -m certification.maintenance_qualification --aggregate "$RUNNER_TEMP/fixed-e23" --expected-sha "$EXPECTED_RUNTIME" --output e23-evidence/cohort.json
          git diff --exit-code HEAD
          git fetch origin refs/heads/cert/autonomous-paper-machinery-20260927
          test "$(git rev-parse FETCH_HEAD)" = "$CANONICAL_PARENT"
          TREE="$(git rev-parse "$EXPECTED_RUNTIME^{tree}")"
          git config user.name OpenAI
          git config user.email noreply@openai.com
          CERT_SHA="$(printf '%s\n' '[non-market-cert] Certify maintenance outcomes after fixed recovery and complete native proof' | git commit-tree "$TREE" -p "$CANONICAL_PARENT" -p "$EXPECTED_RUNTIME")"
          test "$(git rev-parse "$CERT_SHA^{tree}")" = "$TREE"
          git push origin "$CERT_SHA:refs/heads/cert/autonomous-paper-machinery-20260927"
          python -m certification.dispatch_phase_e --repo "$GITHUB_REPOSITORY" --sha "$CERT_SHA" --runtime "$EXPECTED_RUNTIME" --plan-sha256 "$PLAN_SHA256" --cohort e23-evidence/cohort.json --build "$RUNNER_TEMP/complete-e23/final-build.json" --output e23-evidence/canonical-dispatch.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e23-dispatch-${{ github.run_id }}
          path: e23-evidence/
          retention-days: 90
          if-no-files-found: error
