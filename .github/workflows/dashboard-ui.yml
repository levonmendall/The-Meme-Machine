name: Dashboard UI — focused read-only checks

on:
  push:
    paths:
      - dashboard/**
      - .github/workflows/dashboard-ui.yml
  pull_request:
    paths:
      - dashboard/**
      - .github/workflows/dashboard-ui.yml

permissions:
  contents: read

jobs:
  dashboard-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements.txt
      - name: Check shipped JavaScript syntax
        run: node --check dashboard/static/app.js
      - name: Run offline dashboard presentation and receiver tests
        run: python -m unittest discover -s dashboard/tests -p 'test_*.py'
