name: cancel-obsolete-pump-source-diagnostic
on:
  push:
    branches: [ops/cancel-obsolete-pump-source-diagnostic-20260923]
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel exact superseded source-copy diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          run_id=35892403684
          expected_sha="324fee081dd7664a30df4d88aaa1448d28e3033e"
          expected_branch="cert/source-pump-profit-protection-v2-20260923"
          headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
          }
          url=f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/runs/{run_id}"
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as response:
              row=json.load(response)
          if (row.get("head_sha")!=expected_sha or row.get("head_branch")!=expected_branch
                  or row.get("name")!="paper-milestone"):
              raise SystemExit("cancellation_identity_mismatch")
          result={"run_id":run_id,"sha":expected_sha,"branch":expected_branch,
                  "before":row.get("status"),"reason":"superseded source-copy live diagnostic blocks final exact-SHA non-market certification; deterministic source-copy tests already passed; current Pump head is separately green"}
          if row.get("status")!="completed":
              req=urllib.request.Request(url+"/force-cancel",headers=headers,method="POST")
              with urllib.request.urlopen(req) as response:
                  result["force_cancel_http_status"]=response.status
          open("obsolete-pump-source-diagnostic-cancellation.json","w").write(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,sort_keys=True))
          PY
      - name: Preserve cancellation audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: obsolete-pump-source-diagnostic-cancellation-${{ github.run_id }}
          path: obsolete-pump-source-diagnostic-cancellation.json
          if-no-files-found: error
          retention-days: 365
