name: dlmm-small-pool-independent-handoff
on:
  push:
    branches:
      - research/dlmm-small-pool-profitability
permissions:
  actions: read
  contents: read

jobs:
  context:
    if: contains(github.event.head_commit.message, '[dlmm-small-pool-handoff]')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
      DLMM_SMALL_POOL_WORKERS: '4'
      SOURCE_RUN_ID: '35450298749'
      SOURCE_ARTIFACT: 'dlmm-small-pool-screen-35450298749-1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Wait for the already-running independent screen artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 360); do
            if gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT" -D . 2>/dev/null; then
              test -f dlmm-small-pool-screen.json
              echo "Recovered screen artifact from run $SOURCE_RUN_ID"
              exit 0
            fi
            sleep 30
          done
          echo "Screen artifact was not published within the bounded handoff window." >&2
          exit 1
      - name: Restore prior compatible TVL-context checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f dlmm-small-pool-profitability-checkpoint.json
          mapfile -t ids < <(
            gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false and (.name | startswith("dlmm-small-pool-profitability-"))) | [.created_at, (.id|tostring)] | @tsv' \
              | sort -r | cut -f2
          )
          for id in "${ids[@]}"; do
            rm -rf /tmp/small-pool-context && mkdir -p /tmp/small-pool-context
            if gh api "repos/${{ github.repository }}/actions/artifacts/${id}/zip" > /tmp/small-pool-context.zip \
                && unzip -q /tmp/small-pool-context.zip -d /tmp/small-pool-context; then
              candidate="$(find /tmp/small-pool-context -name dlmm-small-pool-profitability-checkpoint.json -type f -print -quit)"
              if [ -n "$candidate" ]; then
                cp "$candidate" dlmm-small-pool-profitability-checkpoint.json
                break
              fi
            fi
          done
      - name: Independent small-pool regression gate
        run: python -m unittest tests.test_dlmm_small_pool_profitability -v
      - name: Validate direct Alchemy topology
        run: python -m tests.dlmm_alchemy_provider
      - name: Run independent entry-TVL / age / volatility study
        run: python -m tests.dlmm_small_pool_profitability --screen dlmm-small-pool-screen.json
      - name: Preserve independent small-pool result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-small-pool-independent-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dlmm-small-pool-profitability.json
            dlmm-small-pool-profitability-checkpoint.json
            dlmm-small-pool-screen.json
          if-no-files-found: warn
          retention-days: 90
