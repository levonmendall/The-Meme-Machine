name: robinhood-public-rpc-header-probe
on:
  push:
    branches: [repair/robinhood-public-rpc-403-20260922]
permissions:
  contents: read
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[public-rpc-header-probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Probe official public RPC request profiles
        run: |
          python - <<'PY'
          import json
          import pathlib
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          endpoint='https://rpc.mainnet.chain.robinhood.com'
          profiles={
              'current': {'Content-Type':'application/json'},
              'descriptive_ua': {
                  'Content-Type':'application/json',
                  'Accept':'application/json',
                  'User-Agent':'Meme-Machine/1.0 (+https://github.com/levonmendall/The-Meme-Machine)',
              },
              'curl_ua': {
                  'Content-Type':'application/json',
                  'Accept':'application/json',
                  'User-Agent':'curl/8.5.0',
              },
              'browser_ua': {
                  'Content-Type':'application/json',
                  'Accept':'application/json',
                  'User-Agent':'Mozilla/5.0',
              },
          }
          methods=[
              ('eth_chainId',[]),
              ('eth_getBlockByNumber',['finalized',False]),
          ]
          out={'endpoint_kind':'official_robinhood_public','started_at':time.time(),'profiles':{}}
          for name,headers in profiles.items():
              rows=[]
              for method,params in methods:
                  body=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
                  req=Request(endpoint,data=body,headers=headers)
                  row={'method':method}
                  try:
                      with urlopen(req,timeout=8) as response:
                          raw=response.read(200000)
                          row['http_status']=response.status
                          try:
                              reply=json.loads(raw)
                              row['rpc_error']=(reply.get('error') or {}).get('code')
                              row['has_result']='result' in reply
                          except Exception:
                              row['invalid_json']=True
                  except HTTPError as exc:
                      row['http_status']=exc.code
                  except (URLError,TimeoutError,OSError) as exc:
                      row['transport_error']=type(exc).__name__
                  rows.append(row)
              out['profiles'][name]=rows
          out['ended_at']=time.time()
          pathlib.Path('robinhood-public-rpc-header-probe.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Preserve probe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: robinhood-public-rpc-header-probe-${{ github.run_id }}
          path: robinhood-public-rpc-header-probe.json
          if-no-files-found: error
          retention-days: 30
