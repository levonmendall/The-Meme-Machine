name: M1 deterministic completion repair
on:
  push:
    branches: [repair/stage-e-m1-completion]
permissions:
  contents: read
jobs:
  old-new:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify finite M1 old and new semantics
        run: python diagnostics/m1-completion/verify.py --output m1-verification
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m1-completion-${{ github.sha }}-${{ github.run_attempt }}
          path: m1-verification
          retention-days: 30
