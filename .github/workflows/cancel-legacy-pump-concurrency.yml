name: cancel-legacy-pump-concurrency
on:
  push:
    branches: [cert/profitability-v1-current]
permissions:
  contents: read
concurrency:
  group: solana-public-rpc-live
  cancel-in-progress: true
jobs:
  cancel:
    if: ${{ contains(github.event.head_commit.message, '[cancel-legacy-pump]') }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Legacy Pump concurrency group superseded; no market work launched."
