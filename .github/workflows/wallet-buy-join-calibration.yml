name: wallet-buy-join-calibration
on:
 push:
  branches: [research/fomo-wallet-alpha-event-study]
permissions: {contents: read}
jobs:
 calibrate:
  if: contains(github.event.head_commit.message, '[buy-join-calibrate]')
  runs-on: ubuntu-24.04
  timeout-minutes: 15
  env:
   FOMOAPI_KEY: ${{ secrets.FOMOAPI_KEY }}
  steps:
   - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
   - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
     with: {python-version: '3.12.14'}
   - run: python -m pip install --disable-pip-version-check requests zstandard
   - run: python -m tests.wallet_buy_join_calibration
