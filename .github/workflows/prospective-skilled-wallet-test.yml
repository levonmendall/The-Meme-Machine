name: prospective-skilled-wallet-test

on:
  workflow_dispatch:
  push:
    branches:
      - research/solana-skilled-wallet-alpha

permissions:
  contents: read
  actions: read

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[prospective-wallet-collect]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check requests zstandard
      - name: Collect and label prospective skilled-wallet events
        run: set -o pipefail; python -m tests.solana_skilled_wallet_prospective_collector | tee prospective-skilled-wallet-test.log
      - name: Upload canonical prospective state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prospective-skilled-wallet-state
          path: |
            prospective_state.json
            prospective_events.jsonl
            prospective_summary.json
            prospective-skilled-wallet-test.log
          if-no-files-found: warn
          retention-days: 90
