name: dlmm-dense-retrieval-proof
on:
  push:
    branches:
      - research/dlmm-point-in-time-replay
permissions:
  contents: read
jobs:
  proof:
    if: contains(github.event.head_commit.message, '[dlmm-dense-retrieval-proof]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: dlmm-alchemy-solana-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate Alchemy Solana route
        env:
          MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
        run: python -m tests.dlmm_alchemy_provider
      - name: Recover and serialize exact dense interval
        env:
          MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
        run: python -m tests.dlmm_dense_retrieval_probe
      - name: Preserve dense retrieval proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-dense-retrieval-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: dlmm-dense-retrieval-proof.json
          if-no-files-found: warn
          retention-days: 30
