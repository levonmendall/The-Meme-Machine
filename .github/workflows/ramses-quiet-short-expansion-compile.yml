name: ramses-quiet-short-expansion-compile
on:
  push:
    branches: [research/ramses-quiet-escalation-v1]
permissions:
  contents: read
jobs:
  check:
    if: contains(github.event.head_commit.message, '[ramses-short-expand-compile]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m py_compile robinhood_research/ramses_quiet_short_expansion.py
