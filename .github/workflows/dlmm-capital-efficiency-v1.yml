name: dlmm-capital-efficiency-v1
# Bounded RPC sessions rotate without changing frozen strategy criteria.
on:
  push:
    branches:
      - research/dlmm-capital-efficiency-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dlmm-capital-efficiency-live]')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: dlmm-alchemy-solana-live
      cancel-in-progress: false
    env:
      MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify frozen policy boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open("DLMM_CAPITAL_EFFICIENCY_V1.json"))
          assert p["kind"]=="dlmm_capital_efficiency_v1"
          assert p["status"]=="frozen_pre_prospective"
          assert p["authority"]["allocation"] is False
          assert p["discovery"]["minimum_pool_tvl_usd"] is None
          assert p["position"]["width_bins"]==70
          assert p["qualification"]["min_projected_range_fee_capture_lamports"]==700000
          assert p["qualification"]["min_two_way_balance"]==0.50
          assert p["qualification"]["max_near_range_drift_ratio"]==0.50
          assert p["qualification"]["max_stress_unwind_loss_bps"]==70.0
          print({"revision":p["revision"],"status":p["status"]})
          PY
      - name: Capital-efficiency regression gate
        run: |
          python -m unittest \
            tests.test_dlmm_capital_efficiency_v1 \
            tests.test_dlmm_strategy_point_in_time \
            tests.test_dlmm_strategy_economics \
            tests.test_dlmm_dense_acquisition -v
      - name: Validate direct Alchemy route
        run: python -m tests.dlmm_alchemy_provider
      - name: Prospective natural capital-efficiency sample
        run: |
          python -m tests.dlmm_capital_efficiency_v1 \
            --target-complete 8 \
            --max-attempted 32
      - name: Preserve prospective evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-capital-efficiency-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: dlmm-capital-efficiency-v1-live.json
          if-no-files-found: warn
          retention-days: 90
