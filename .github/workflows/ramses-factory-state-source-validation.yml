name: ramses-factory-state-source-validation
on:
  push:
    branches: [repair/ramses-public-factory-call-20260922]
permissions:
  contents: read
jobs:
  validate:
    if: contains(github.event.head_commit.message, '[ramses-source-validate]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Apply canonical Ramses overlay to current repaired source
        run: |
          set -euo pipefail
          git fetch origin repair/ramses-alchemy-scarcity-public-observation
          SOURCE="$(git rev-parse FETCH_HEAD)"
          echo "$SOURCE" > ramses-source-sha.txt
          git worktree add --detach "$RUNNER_TEMP/ramses" "$SOURCE"
          git -C "$RUNNER_TEMP/ramses" apply --index "$GITHUB_WORKSPACE/certification/patches/ramses-admission.patch"
          git -C "$RUNNER_TEMP/ramses" diff --binary HEAD | sha256sum | awk '{print $1}' > ramses-overlay-sha.txt
      - name: Targeted Ramses regressions
        run: |
          cd "$RUNNER_TEMP/ramses"
          python -m unittest             robinhood_tests.test_ramses_universe             robinhood_tests.test_provider             robinhood_tests.test_provider_topology -v
      - name: Preserve validation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ramses-factory-state-source-validation-${{ github.run_id }}
          path: |
            ramses-source-sha.txt
            ramses-overlay-sha.txt
          if-no-files-found: warn
          retention-days: 30
