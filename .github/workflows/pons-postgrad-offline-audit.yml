name: pons-postgrad-offline-audit
on:
  push:
    branches: [research/pons-postgrad-breakout-study-20260926]
permissions:
  contents: read
jobs:
  offline-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Audit retained Pons post-graduation evidence
        run: python -m certification.robinhood.pons_postgrad_evidence_audit
      - name: Preserve audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pons-postgrad-offline-audit-${{ github.sha }}-${{ github.run_id }}
          path: pons-postgrad-offline-audit.json
          retention-days: 90
          if-no-files-found: error
