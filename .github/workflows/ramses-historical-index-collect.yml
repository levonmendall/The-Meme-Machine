name: ramses-historical-index-collect
on:
  push:
    branches: [research/ramses-dlmm-historical-market-v1]
permissions:
  contents: read
jobs:
  collect:
    if: contains(github.event.head_commit.message, '[ramses-index-collect]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: ramses-historical-index-collect
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m py_compile robinhood_research/ramses_historical_index_collect.py
      - run: python -m robinhood_research.ramses_historical_index_collect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ramses-historical-index-${{ github.run_id }}
          path: |
            ramses-historical-index-summary.json
            ramses-historical-index-data.json.gz
          if-no-files-found: warn
          retention-days: 90
