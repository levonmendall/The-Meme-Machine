name: Stage E source identity review
on:
  push:
    branches: [review/stagee20-source-identity-20260928]
permissions:
  contents: read
jobs:
  source-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: runtime
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 23f06ed84e5b5e2d4efd074618ab44ae7ed58011
          path: runtime
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/non-market-lanes"
      - name: Measure prepared lane identities
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'non-market-lanes'
          result={}
          args=['git','diff','--binary','--full-index','--no-ext-diff','--no-textconv','--no-renames','HEAD']
          for lane in ('pump','meteora','pons','ramses'):
              cwd=root/lane
              diff=subprocess.check_output(args,cwd=cwd)
              service=cwd/'meme_machine/solana_evidence_service.py'
              result[lane]={
                  'source_diff_sha256':hashlib.sha256(diff).hexdigest(),
                  'service_sha256':hashlib.sha256(service.read_bytes()).hexdigest() if service.exists() else None,
              }
          try:
              from certification.run import source_integrity
              source_integrity(root)
              result['source_integrity']='success'
          except Exception as exc:
              result['source_integrity']=type(exc).__name__+':'+str(exc)
          out=Path(os.environ['GITHUB_WORKSPACE'])/'source-identity.json'
          out.write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stagee-source-identity
          path: source-identity.json
          if-no-files-found: error
          retention-days: 30
