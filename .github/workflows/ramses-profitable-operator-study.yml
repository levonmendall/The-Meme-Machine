name: ramses-profitable-operator-study
on:
  push:
    branches: [research/ramses-profitable-operator-reverse-engineering-v1]
permissions:
  actions: read
  contents: read

jobs:
  study:
    if: contains(github.event.head_commit.message, '[ramses-operator-study]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify frozen protocol and analysis code
        run: |
          python -m py_compile robinhood_research/ramses_profitable_operator_study.py
          python - <<'PY'
          import json
          p=json.load(open("RAMSES_PROFITABLE_OPERATOR_REVERSE_ENGINEERING_V1.json"))
          assert p["kind"]=="ramses_profitable_operator_reverse_engineering_protocol_v1"
          assert p["holdout_outcomes_read"] is False
          assert p["discovery_cutoff_timestamp"]==1788949990
          PY
      - name: Download exact frozen Ramses artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          fetch_artifact () {
            local aid="$1"
            local name="$2"
            mkdir -p "/tmp/$name"
            gh api "repos/$REPOSITORY/actions/artifacts/$aid/zip" > "/tmp/$name.zip"
            unzip -q "/tmp/$name.zip" -d "/tmp/$name"
          }
          fetch_artifact 10667850006 positions
          fetch_artifact 10668466591 burns
          fetch_artifact 10668780170 outcomes
          fetch_artifact 10669119524 fees
          fetch_artifact 10668407769 signals
          fetch_artifact 10667753690 index
          cp /tmp/positions/ramses-historical-position-data.json.gz .
          cp /tmp/positions/ramses-historical-position-summary.json .
          cp /tmp/burns/ramses-historical-burn-ownership.json .
          cp /tmp/outcomes/ramses-historical-lp-outcomes.json .
          cp /tmp/fees/ramses-historical-fee-decomposition.json .
          cp /tmp/signals/ramses-historical-lp-signal-join.json .
          cp /tmp/index/ramses-historical-index-data.json.gz .
          cp /tmp/index/ramses-historical-index-summary.json .
      - name: Reconstruct profitable operator behavior
        run: python -m robinhood_research.ramses_profitable_operator_study
      - name: Verify holdout remained unread
        run: |
          python - <<'PY'
          import json
          r=json.load(open("ramses-profitable-operator-study.json"))
          assert r["holdout_outcomes_read"] is False
          assert r["reconstructed"]["closed_pre_holdout_books"] > 0
          assert r["reconstructed"]["repeatable_positive_operators"] > 0
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ramses-profitable-operator-study-${{ github.run_id }}
          path: |
            ramses-profitable-operator-study.json
            RAMSES_PROFITABLE_OPERATOR_STUDY.md
            RAMSES_PROFITABLE_OPERATOR_REVERSE_ENGINEERING_V1.json
          if-no-files-found: error
          retention-days: 90
