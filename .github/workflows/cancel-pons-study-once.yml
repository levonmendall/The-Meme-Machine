name: Cancel Pons study once
on:
  push:
    branches: [ops/cancel-pons-study-20260926]
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    if: contains(github.event.head_commit.message, '[cancel-pons-study]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel exact Pons study run and verify terminal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          owner='levonmendall'; repo='The-Meme-Machine'; run_id=36251721328
          token=os.environ['GH_TOKEN']
          base=f'https://api.github.com/repos/{owner}/{repo}/actions/runs/{run_id}'
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def request(method,url):
              req=urllib.request.Request(url,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read()
                      return r.status, json.loads(body or b'{}') if body else {}
              except urllib.error.HTTPError as e:
                  body=e.read()
                  try:data=json.loads(body or b'{}')
                  except Exception:data={'raw':body.decode(errors='replace')}
                  return e.code,data
          status,row=request('GET',base)
          if status!=200: raise SystemExit(f'cancel_lookup_failed:{status}:{row}')
          if row.get('status')!='completed':
              status,body=request('POST',base+'/cancel')
              if status not in (202,409):
                  raise SystemExit(f'cancel_request_failed:{status}:{body}')
          for _ in range(60):
              status,row=request('GET',base)
              if status==200 and row.get('status')=='completed':
                  print(json.dumps({'run_id':run_id,'status':row.get('status'),'conclusion':row.get('conclusion')},sort_keys=True))
                  raise SystemExit(0)
              time.sleep(2)
          raise SystemExit('cancel_terminal_timeout')
          PY
