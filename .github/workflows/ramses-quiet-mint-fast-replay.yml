name: ramses-quiet-mint-fast-replay
on:
  push:
    branches: [research/ramses-exact-replay-efficiency-v1]
permissions:
  actions: read
  contents: read
jobs:
  replay:
    if: contains(github.event.head_commit.message, '[ramses-quiet-mint-fast]')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    concurrency:
      group: ramses-quiet-mint-fast-replay
      cancel-in-progress: false
    env:
      MM_ROBINHOOD_READ_RPC_URL: ${{ secrets.MM_ROBINHOOD_READ_RPC_URL }}
      MM_ROBINHOOD_DLMM_RPC_URL: ${{ secrets.MM_ROBINHOOD_DLMM_RPC_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify accelerated log retrieval
        run: |
          python -m py_compile robinhood_research/ramses_all_pool_lifecycle.py robinhood_research/ramses_historical_quiet_mint_counterfactual.py
          python -m unittest robinhood_tests.test_ramses_historical_fast_logs -v
      - name: Download complete Ramses indexed history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          aid="$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100"             --jq '.artifacts[] | select(.expired == false and (.name | startswith("ramses-historical-index-")) and (.name | contains("summary") | not) and (.name | contains("probe") | not) and (.size_in_bytes > 1000000)) | [.created_at, (.id|tostring)] | @tsv'             | sort -r | head -1 | cut -f2)"
          test -n "$aid"
          gh api "repos/${{ github.repository }}/actions/artifacts/$aid/zip" > /tmp/index.zip
          mkdir -p /tmp/index
          unzip -q /tmp/index.zip -d /tmp/index
          cp /tmp/index/ramses-historical-index-data.json.gz .
      - name: Restore latest partial checkpoint when available
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          aid="$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false and (.name | startswith("ramses-quiet-mint-counterfactual-fast-")) and (.size_in_bytes > 0)) | [.created_at, (.id|tostring)] | @tsv' \
            | sort -r | head -1 | cut -f2 || true)"
          if [ -n "$aid" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$aid/zip" > /tmp/checkpoint.zip
            unzip -p /tmp/checkpoint.zip ramses-quiet-mint-counterfactual.json > ramses-quiet-mint-counterfactual.json || rm -f ramses-quiet-mint-counterfactual.json
          fi
      - name: Exact quiet-mint counterfactual replay with equivalent fast log fetch
        run: python -m robinhood_research.ramses_historical_quiet_mint_counterfactual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ramses-quiet-mint-counterfactual-fast-${{ github.run_id }}
          path: ramses-quiet-mint-counterfactual.json
          if-no-files-found: warn
          retention-days: 90
