name: CI — staged offline validation
# The legacy fast check is focused development evidence by default, including
# draft PRs and main. It is not full FAST/OPERATIONAL release evidence.
# Final frozen releases explicitly dispatch validation=full for both suites.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      validation:
        description: Focused development checks or a complete frozen release suite
        type: choice
        options: [focused, owner-comparison, full]
        default: focused
      suite:
        description: Complete offline release suite (finalized candidates only)
        type: choice
        options: [FAST, OPERATIONAL]
        default: FAST
permissions:
  contents: read
# New commits cancel obsolete runs for the same PR/ref; the final revision must pass.
concurrency:
  group: fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.suite == 'OPERATIONAL' && 90 || 45 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Focused evidence must exercise the exact reviewed PR head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Source-equivalence checks retain the pinned source through later commits.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.txt
      - name: Run focused Stage A offline regressions (not full FAST or OPERATIONAL)
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.validation != 'full' && inputs.validation != 'owner-comparison') }}
        run: |
          sudo env CI=true PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" - <<'PY'
          import os
          from pathlib import Path
          import runpy
          import resource
          import sys

          # Retain the same actual kernel containment as the complete suites.
          soft, hard = resource.getrlimit(resource.RLIMIT_NOFILE)
          if hard < 4096:
              raise RuntimeError('ci_replay_file_descriptors_required')
          resource.setrlimit(resource.RLIMIT_NOFILE, (max(soft, 4096), hard))
          cpus = sorted(os.sched_getaffinity(0))
          if len(cpus) < 2:
              raise RuntimeError('two_ci_cpus_required')
          os.sched_setaffinity(0, set(cpus[:2]))
          Path('/sys/fs/cgroup/cgroup.subtree_control').write_text('+cpu +memory +io')
          from engineering.solana_capacity.proof_host import LinuxGroup
          from engineering.solana_capacity.proof_limits import LIMITS
          group = LinuxGroup(LIMITS)
          group.close()
          modules = [
              'tests.test_owner_throughput_source_guard',
              'tests.test_owner_throughput_comparison',
              'tests.test_bounded_candidate_development',
              'tests.test_solana_acquisition_scheduler',
              'tests.test_solana_dispatch_probe',
              'tests.test_owner_planning_fanout',
              'tests.test_managed_capacity_source_guard',
              'tests.test_pump_restore_source_guard',
              'tests.test_operational_candidate_source_guard',
              'tests.test_ea_performance_source_guard',
              'tests.test_native_audit_source_guard',
              'tests.test_prepared_evidence_decode',
              'tests.test_restore_reference_pages',
              'tests.test_source_operation_publication',
              'tests.test_solana_health_atomicity',
              'tests.test_checkpoint_handoff',
              'tests.test_solana_checkpoint_owner',
              'tests.test_solana_prewarm_startup',
              'tests.test_operation_costs',
              'tests.test_sleeve_prefix_scheduling',
              'tests.test_sleeve_prefix_recovery',
              'tests.test_sleeve_reconciliation_snapshot',
              'tests.test_pons_capital_recovery_snapshot',
              'tests.test_survivor_terminal_retirement',
              'tests.test_pons_native_retirement',
              'tests.test_pons_projection_source_reuse',
              'tests.test_pons_retention_covering_index',
              'tests.test_pons_protection_revision',
              'tests.test_pons_evidence_retention_revision',
              'tests.test_pons_native_audit_guards',
              'tests.test_pons_stalled_startup_stack',
              'tests.test_shared_capital_recovery',
              'tests.test_shared_capital_concurrency',
              'tests.test_shared_capital_economics',
              'tests.test_pons_shared_native_acquisition',
              'tests.test_provider_budget_namespace_read',
              'tests.test_native_usage_intake',
              'tests.test_bounded_provider_preflight',
              'tests.test_continuous_paper',
              'tests.test_restored_provider_history',
              'tests.test_position_continuation',
              'tests.test_pump_cost_environment',
              'tests.test_pons_operation_costs',
              'tests.test_operational_supervisor',
              'tests.test_publication_accounting_turn',
              'tests.test_pump_restore_cost_attribution',
              'tests.test_solana_history_separation',
              'tests.test_buffered_gap_origin_geometry',
              'tests.test_buffered_prejoin_recovery',
              'tests.test_startup_archive_read_reuse',
              'tests.test_isolated_market_observer',
              'tests.test_isolated_native_workload',
              'tests.test_isolated_native_workload_replay',
              'tests.test_isolated_native_pump',
              'tests.test_isolated_native_pons',
              'tests.test_namespace_canary',
              'tests.test_landlock_canary',
              'tests.test_namespace_runtime',
              'tests.test_source_pool_cooperative_stop',
              'tests.test_preparation_failed_recovery',
              'tests.test_native_startup_lifecycle',
              'tests.test_startup_history_cancellation',
              'tests.test_current_combined_diagnostic',
              'tests.test_integrated_startup_rehearsal',
              'tests.test_sqlite_failure_attribution',
              'tests.test_robinhood_usd_valuation',
              'tests.test_source_handler_recovery',
              'tests.test_control_interrupted_recovery',
              'tests.test_solana_source_drain',
              'tests.test_cancelled_buffered_recovery',
              'tests.test_archive_full_log_content',
              'tests.test_archive_recovered_session',
              'tests.test_session_economic_recovery',
              'tests.test_retained_canonical_reference',
              'tests.test_candidate_history',
              'tests.test_frozen_paused_reader',
              'tests.test_operational_ramses_pause',
              'tests.test_contained_source_observation',
              'tests.test_program_gap_observation',
              'tests.test_directional_accounting',
              'tests.lanes.pons.test_pons_position_provider_recovery',
              'tests.test_survivor_commit',
              'tests.test_survivor_retained_gap',
              'tests.test_maintenance_owner_entry_clock',
              'tests.test_maintenance_permit_ownership',
              'tests.test_maintenance_admission_service',
              'tests.test_pipeline_retention_boundary',
              'tests.test_prejoin_observation_recovery',
              'tests.test_pump_restore_selection_index',
              'tests.test_canonical_cold_archive_cohort',
              'tests.test_retained_reference_path_walk',
              'tests.test_retirement_hot_pages',
              'tests.test_solana_closure',
          ]
          print('FOCUSED_VALIDATION_ONLY: not a complete FAST or OPERATIONAL release suite', flush=True)
          print('FOCUSED_MODULES: ' + ','.join(modules), flush=True)
          sys.argv = ['operational.tests', 'OPERATIONAL', '--modules', *modules, '--verbose']
          runpy.run_module('operational.tests', run_name='__main__')
          PY
      - name: Checkout preserved runtime baseline for a matched synthetic comparison
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation == 'owner-comparison' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: be2fed3e4296a999cf6fcd596c0d06bd4720d7b1
          path: owner-throughput-baseline
          fetch-depth: 8
          persist-credentials: false
      - name: Compare identical offline owner workloads in baseline-candidate-candidate-baseline order
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation == 'owner-comparison' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C owner-throughput-baseline rev-parse HEAD)" = be2fed3e4296a999cf6fcd596c0d06bd4720d7b1
          git -C owner-throughput-baseline diff --exit-code 44c4d556f9d7eb6f0481cbdceabc4c58e8714e65 HEAD -- meme_machine
          cmp requirements.txt owner-throughput-baseline/requirements.txt
          cmp tests/test_owner_throughput_comparison.py owner-throughput-baseline/tests/test_owner_throughput_comparison.py
          python - <<'PY' | tee "$RUNNER_TEMP/owner-comparison-runtime.json"
          import json,platform,sqlite3,subprocess
          print(json.dumps(dict(scope='SYNTHETIC_COMPONENT_COMPARISON_NOT_MARKET_ACCEPTANCE',
              candidate_source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              baseline_source='be2fed3e4296a999cf6fcd596c0d06bd4720d7b1',
              python=platform.python_version(),sqlite=sqlite3.sqlite_version,
              matches_ec2_versions=(platform.python_version(),sqlite3.sqlite_version)==('3.12.14','3.45.1'))))
          PY
          for comparison_arm in baseline-1 candidate-1 candidate-2 baseline-2; do
            case "$comparison_arm" in
              baseline-*) comparison_directory="$GITHUB_WORKSPACE/owner-throughput-baseline" ;;
              candidate-*) comparison_directory="$GITHUB_WORKSPACE" ;;
            esac
            (
              cd "$comparison_directory"
              PYTHONDONTWRITEBYTECODE=1 python -m operational.tests FAST --cases \
                tests.test_owner_throughput_comparison.OwnerThroughputComparisonTests.test_actual_population_is_conserved_and_vm_probe_preserves_semantics \
                tests.test_owner_throughput_comparison.OwnerThroughputComparisonTests.test_idle_epochs_preserve_population_and_original_deadlines
            ) 2>&1 | tee "$RUNNER_TEMP/owner-comparison-$comparison_arm.log"
          done
          python - <<'PY'
          import json,os,pathlib
          directory=pathlib.Path(os.environ['RUNNER_TEMP'])
          reports=[]
          for name in ('baseline-1','candidate-1','candidate-2','baseline-2'):
              raw=(directory/('owner-comparison-'+name+'.log')).read_bytes()
              assert len(raw)<=262144,'bounded_comparison_report_required'
              rows=[]
              for line in raw.decode().splitlines():
                  if 'OWNER_THROUGHPUT_COMPARISON ' in line:
                      row=json.JSONDecoder().raw_decode(line.split('OWNER_THROUGHPUT_COMPARISON ',1)[1])[0]
                      rows.append(row)
              assert [r['arm'] for r in rows]==['optional_plain','optional_measured',
                  'optional_idle_epochs_plain','optional_idle_epochs_measured'],'four_exact_arms_required'
              reports.extend(dict(process=name,report=row) for row in rows)
          references={row['report']['scheduling']['mode']:row['report'] for row in reports[:4]}
          def equivalent(row):
              reference=references[row['scheduling']['mode']]
              return (all(row[key]==reference[key] for key in
                  ('cohort','runtime','fingerprints','final','scheduling'))
                  and row['provenance']['harness_sha256']==reference['provenance']['harness_sha256'])
          matched=all(equivalent(row['report']) for row in reports)
          idle=[row['report']['schedule_observations'] for row in reports
              if row['report']['scheduling']['mode']=='idle-epochs']
          matched=matched and all(row['epochs']==idle[0]['epochs'] and row['final_outcome']=='IDLE' for row in idle)
          summary=dict(scope='SYNTHETIC_EQUIVALENCE_ONLY_NOT_LIVE_PERFORMANCE_ACCEPTANCE',
              cross_source_equivalent=matched,reports=reports)
          (directory/'owner-comparison-summary.json').write_text(json.dumps(summary,sort_keys=True)+'\n')
          assert matched,'cross_source_cohort_runtime_or_functional_mismatch'
          PY
      - name: Retain the four bounded comparison reports
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.validation == 'owner-comparison' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-throughput-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/owner-comparison-*.log
            ${{ runner.temp }}/owner-comparison-runtime.json
            ${{ runner.temp }}/owner-comparison-summary.json
          if-no-files-found: warn
          retention-days: 90
      - name: Run complete offline suite with the required Linux containment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation == 'full' }}
        env:
          OFFLINE_SUITE: ${{ inputs.suite || 'FAST' }}
        run: |
          # The real containment regressions require cgroup v2 and exactly two
          # CPUs. Supply those conditions on this disposable runner; retain the
          # original tests, kernel limits and market-provider network guard.
          sudo env CI=true PYTHONDONTWRITEBYTECODE=1 OFFLINE_SUITE="$OFFLINE_SUITE" "$(command -v python)" - <<'PY'
          import os
          from pathlib import Path
          import runpy
          import resource
          import sys

          # sudo's 1,024-descriptor default is insufficient for the unchanged
          # multi-owner SQLite replay fixtures in the FAST parent. This does
          # not change the contained workers' protective resource ceilings.
          soft, hard = resource.getrlimit(resource.RLIMIT_NOFILE)
          if hard < 4096:
              raise RuntimeError('ci_replay_file_descriptors_required')
          resource.setrlimit(resource.RLIMIT_NOFILE, (max(soft, 4096), hard))
          cpus = sorted(os.sched_getaffinity(0))
          if len(cpus) < 2:
              raise RuntimeError('two_ci_cpus_required')
          os.sched_setaffinity(0, set(cpus[:2]))
          Path('/sys/fs/cgroup/cgroup.subtree_control').write_text('+cpu +memory +io')
          from engineering.solana_capacity.proof_host import LinuxGroup
          from engineering.solana_capacity.proof_limits import LIMITS
          group = LinuxGroup(LIMITS)
          group.close()
          # Preserve the last reached regression if containment or the runner
          # fails. This changes diagnostics only, not tests or their limits.
          level = os.environ['OFFLINE_SUITE']
          if level not in ('FAST', 'OPERATIONAL'):
              raise RuntimeError('explicit_offline_suite_required')
          sys.argv = ['operational.tests', level, '--verbose']
          runpy.run_module('operational.tests', run_name='__main__')
          PY
