name: CI — fast deterministic tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The isolated feature's source-equivalence check reads its parent tree.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m operational.tests FAST
