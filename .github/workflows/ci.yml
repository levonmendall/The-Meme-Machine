name: CI — staged offline validation
# The legacy fast check is focused development evidence by default, including
# draft PRs and main. It is not full FAST/OPERATIONAL release evidence.
# Final frozen releases explicitly dispatch validation=full for both suites.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      validation:
        description: Focused development checks or a complete frozen release suite
        type: choice
        options: [focused, full]
        default: focused
      suite:
        description: Complete offline release suite (finalized candidates only)
        type: choice
        options: [FAST, OPERATIONAL]
        default: FAST
permissions:
  contents: read
# New commits cancel obsolete runs for the same PR/ref; the final revision must pass.
concurrency:
  group: fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.suite == 'OPERATIONAL' && 90 || 45 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Focused evidence must exercise the exact reviewed PR head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Source-equivalence checks retain the pinned source through later commits.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements.txt
        id: pinned_dependencies
      - name: Seal the fixed setup-python copied-runtime inputs
        id: trusted_native_runtime
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.validation != 'full' }}
        run: |
          # Metadata-only installation of the exact selected core closure;
          # no runtime trust predicate, file bytes or host tree is relaxed.
          sudo env CI=true GITHUB_ACTIONS=true PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" \
            -m engineering.ci.native_principals --python-location "$pythonLocation" \
            --runner-uid "$(id -u)" --runner-gid "$(id -g)"
      - name: Run focused Stage A offline regressions (not full FAST or OPERATIONAL)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.validation != 'full' }}
        run: |
          sudo env CI=true PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" - <<'PY'
          import os
          from pathlib import Path
          import runpy
          import resource
          import sys

          # Retain the same actual kernel containment as the complete suites.
          soft, hard = resource.getrlimit(resource.RLIMIT_NOFILE)
          if hard < 4096:
              raise RuntimeError('ci_replay_file_descriptors_required')
          resource.setrlimit(resource.RLIMIT_NOFILE, (max(soft, 4096), hard))
          cpus = sorted(os.sched_getaffinity(0))
          if len(cpus) < 2:
              raise RuntimeError('two_ci_cpus_required')
          os.sched_setaffinity(0, set(cpus[:2]))
          Path('/sys/fs/cgroup/cgroup.subtree_control').write_text('+cpu +memory +io')
          from engineering.solana_capacity.proof_host import LinuxGroup
          from engineering.solana_capacity.proof_limits import LIMITS
          group = LinuxGroup(LIMITS)
          group.close()
          modules = [
              'tests.test_pump_restore_source_guard',
              'tests.test_future_pump_source_guard',
              'tests.test_prepared_evidence_decode',
              'tests.test_restore_reference_pages',
              'tests.test_source_operation_publication',
              'tests.test_solana_health_atomicity',
              'tests.test_solana_prewarm_startup',
              'tests.test_operation_costs',
              'tests.test_sleeve_prefix_scheduling',
              'tests.test_sleeve_prefix_recovery',
              'tests.test_sleeve_reconciliation_snapshot',
              'tests.test_pons_capital_recovery_snapshot',
              'tests.test_survivor_terminal_retirement',
              'tests.test_pons_native_retirement',
              'tests.test_pons_projection_source_reuse',
              'tests.test_pons_retention_covering_index',
              'tests.test_shared_capital_recovery',
              'tests.test_shared_capital_concurrency',
              'tests.test_shared_capital_economics',
              'tests.test_pons_shared_native_acquisition',
              'tests.test_provider_budget_namespace_read',
              'tests.test_native_usage_intake',
              'tests.test_bounded_provider_preflight',
              'tests.test_continuous_paper',
              'tests.test_restored_provider_history',
              'tests.test_position_continuation',
              'tests.test_pump_cost_environment',
              'tests.test_pons_operation_costs',
              'tests.test_operational_supervisor',
              'tests.test_publication_accounting_turn',
              'tests.test_pump_restore_cost_attribution',
              'tests.test_solana_history_separation',
              'tests.test_buffered_gap_origin_geometry',
              'tests.test_buffered_prejoin_recovery',
              'tests.test_startup_archive_read_reuse',
              'tests.test_isolated_market_observer',
              'tests.test_isolated_native_workload',
              'tests.test_isolated_native_workload_replay',
              'tests.test_isolated_native_pump',
              'tests.test_isolated_native_pons',
              'tests.test_namespace_canary',
              'tests.test_landlock_canary',
              'tests.test_namespace_runtime',
              'tests.test_source_pool_cooperative_stop',
              'tests.test_preparation_failed_recovery',
              'tests.test_native_startup_lifecycle',
              'tests.test_startup_history_cancellation',
              'tests.test_current_combined_diagnostic',
              'tests.test_integrated_startup_rehearsal',
              'tests.test_sqlite_failure_attribution',
              'tests.test_robinhood_usd_valuation',
              'tests.test_source_handler_recovery',
              'tests.test_control_interrupted_recovery',
              'tests.test_solana_source_drain',
              'tests.test_archive_full_log_content',
              'tests.test_archive_recovered_session',
              'tests.test_session_economic_recovery',
              'tests.test_retained_canonical_reference',
              'tests.test_candidate_history',
              'tests.test_frozen_paused_reader',
              'tests.test_operational_ramses_pause',
              'tests.test_contained_source_observation',
              'tests.test_program_gap_observation',
              'tests.test_directional_accounting',
              'tests.lanes.pons.test_pons_position_provider_recovery',
              'tests.test_survivor_commit',
              'tests.test_survivor_retained_gap',
              'tests.test_maintenance_owner_entry_clock',
              'tests.test_prejoin_observation_recovery',
              'tests.test_pump_restore_selection_index',
              'tests.test_canonical_cold_archive_cohort',
              'tests.test_retained_reference_path_walk',
              'tests.test_retirement_hot_pages',
              'tests.test_solana_closure',
          ]
          print('FOCUSED_VALIDATION_ONLY: not a complete FAST or OPERATIONAL release suite', flush=True)
          print('FOCUSED_MODULES: ' + ','.join(modules), flush=True)
          sys.argv = ['operational.tests', 'OPERATIONAL', '--modules', *modules, '--verbose']
          runpy.run_module('operational.tests', run_name='__main__')
          PY
      - name: Run affected root service-diagnostic regressions
        if: ${{ !cancelled() && steps.pinned_dependencies.outcome == 'success' && steps.trusted_native_runtime.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.validation != 'full') }}
        run: |
          # All 87 original cases stay in the root phase; two actual service
          # identity cases retain their existing systemd/account prerequisites.
          sudo env CI=true PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" - <<'PY'
          import os
          import resource
          import runpy
          import sys
          if os.geteuid() != 0:
              raise RuntimeError('ci_root_diagnostic_principal_required')
          soft, hard = resource.getrlimit(resource.RLIMIT_NOFILE)
          if hard < 4096:
              raise RuntimeError('ci_replay_file_descriptors_required')
          resource.setrlimit(resource.RLIMIT_NOFILE, (max(soft, 4096), hard))
          cpus = sorted(os.sched_getaffinity(0))
          if len(cpus) < 2:
              raise RuntimeError('two_ci_cpus_required')
          os.sched_setaffinity(0, set(cpus[:2]))
          sys.argv = ['operational.tests', 'OPERATIONAL', '--modules',
              'tests.test_current_combined_diagnostic', '--verbose']
          runpy.run_module('operational.tests', run_name='__main__')
          PY
      - name: Run affected native isolation and complete copied-main regressions
        # Run this independent evidence even when Stage A fails. Its failure
        # still leaves the job failed; cancellation and missing setup stop it.
        if: ${{ !cancelled() && steps.pinned_dependencies.outcome == 'success' && steps.trusted_native_runtime.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.validation != 'full') }}
        run: |
          # Run the original remaining 48 modules/588 cases as the real runner.
          # No CAP_SYS_RESOURCE may invalidate the hard-AS negative regression.
          # Keep the actual copied-main case and every failure intact;
          # this remains synthetic component validation, not kernel/live readiness.
          env CI=true PYTHONDONTWRITEBYTECODE=1 "$(command -v python)" - <<'PY'
          import json
          import os
          import resource
          import runpy
          import sqlite3
          import sys
          from pathlib import Path

          if os.geteuid() == 0 or os.getuid() != os.geteuid():
              raise RuntimeError('ci_unprivileged_native_principal_required')
          status = dict(line.split(':', 1) for line in Path('/proc/self/status').read_text().splitlines() if ':' in line)
          capabilities = {}
          for field in ('CapInh', 'CapPrm', 'CapEff', 'CapAmb'):
              if field not in status or int(status[field].strip(), 16) != 0:
                  raise RuntimeError('ci_native_capabilities_must_be_empty')
              capabilities[field] = int(status[field].strip(), 16)
          soft, hard = resource.getrlimit(resource.RLIMIT_NOFILE)
          if hard < 4096:
              raise RuntimeError('ci_replay_file_descriptors_required')
          resource.setrlimit(resource.RLIMIT_NOFILE, (max(soft, 4096), hard))
          cpus = sorted(os.sched_getaffinity(0))
          if len(cpus) < 2:
              raise RuntimeError('two_ci_cpus_required')
          os.sched_setaffinity(0, set(cpus[:2]))
          print('NATIVE_FOCUSED_RUNTIME: ' + json.dumps({
              'python': sys.version.split()[0], 'sqlite': sqlite3.sqlite_version,
              'real_uid': os.getuid(), 'effective_uid': os.geteuid(),
              'capabilities': capabilities,
          }, sort_keys=True), flush=True)
          modules = [
              'tests.test_transport_bridge',
              'tests.test_parent_native_transport',
              'tests.test_child_transport',
              'tests.test_parent_sequencer_clock',
              'tests.test_isolated_rpc_ports',
              'tests.test_isolated_native_resources',
              'tests.test_isolated_native_execution',
              'tests.test_isolated_native_admission',
              'tests.test_isolated_native_bootstrap',
              'tests.test_isolated_native_entry',
              'tests.test_isolated_pons_current',
              'tests.test_parent_sizing',
              'tests.test_isolated_native_source',
              'tests.test_native_subscription_upload',
              'tests.test_pons_native_profile',
              'tests.test_pons_profile_channel',
              'tests.test_isolated_native_fatal_drain',
              'tests.test_isolated_native_launcher',
              'tests.test_namespace_runtime',
              'tests.test_namespace_canary',
              'tests.test_source_ports',
              'tests.test_isolated_native_executor',
              'tests.test_isolated_native_control',
              'tests.test_native_read_lane',
              'tests.test_checkpoint_handoff',
              'tests.test_market_heads',
              'tests.test_http_response_eof',
              'tests.test_landlock_canary',
              'tests.test_isolated_native_landlock_image',
              'tests.test_parent_head_lifecycle',
              'tests.test_pons_scheduling_reads',
              'tests.test_native_commit_measurement',
              'tests.test_isolated_native_layout',
              'tests.test_isolated_native_spawn',
              'tests.test_native_landlock_policy',
              'tests.test_native_landlock_launcher',
              'tests.test_native_kernel_outputs',
              'tests.test_isolated_native_kernel_corpus',
              'tests.test_native_pons_kernel_corpus',
              'tests.test_parent_native_factories',
              'tests.test_shared_capital_recovery',
              'tests.test_shared_capital_concurrency',
              'tests.test_shared_capital_economics',
              'tests.test_native_startup_lifecycle',
              'tests.test_startup_history_cancellation',
              'tests.test_integrated_startup_rehearsal',
              'tests.test_paper_policy_compatibility',
              'tests.test_isolated_native_kernel_validation',
          ]
          print('FOCUSED_NATIVE_VALIDATION_ONLY: synthetic offline; not full release or kernel acceptance', flush=True)
          print('FOCUSED_NATIVE_MODULES: ' + ','.join(modules), flush=True)
          sys.argv = ['operational.tests', 'OPERATIONAL', '--modules', *modules, '--verbose']
          runpy.run_module('operational.tests', run_name='__main__')
          PY
      - name: Check CI execution-principal and runtime-installation contract
        if: ${{ !cancelled() && steps.pinned_dependencies.outcome == 'success' && steps.trusted_native_runtime.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.validation != 'full') }}
        run: python -m operational.tests FAST --modules tests.test_ci_native_principals --verbose
      - name: Run complete offline suite with the required Linux containment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation == 'full' }}
        env:
          OFFLINE_SUITE: ${{ inputs.suite || 'FAST' }}
        run: |
          # The real containment regressions require cgroup v2 and exactly two
          # CPUs. Supply those conditions on this disposable runner; retain the
          # original tests, kernel limits and market-provider network guard.
          sudo env CI=true PYTHONDONTWRITEBYTECODE=1 OFFLINE_SUITE="$OFFLINE_SUITE" "$(command -v python)" - <<'PY'
          import os
          from pathlib import Path
          import runpy
          import resource
          import sys

          # sudo's 1,024-descriptor default is insufficient for the unchanged
          # multi-owner SQLite replay fixtures in the FAST parent. This does
          # not change the contained workers' protective resource ceilings.
          soft, hard = resource.getrlimit(resource.RLIMIT_NOFILE)
          if hard < 4096:
              raise RuntimeError('ci_replay_file_descriptors_required')
          resource.setrlimit(resource.RLIMIT_NOFILE, (max(soft, 4096), hard))
          cpus = sorted(os.sched_getaffinity(0))
          if len(cpus) < 2:
              raise RuntimeError('two_ci_cpus_required')
          os.sched_setaffinity(0, set(cpus[:2]))
          Path('/sys/fs/cgroup/cgroup.subtree_control').write_text('+cpu +memory +io')
          from engineering.solana_capacity.proof_host import LinuxGroup
          from engineering.solana_capacity.proof_limits import LIMITS
          group = LinuxGroup(LIMITS)
          group.close()
          # Preserve the last reached regression if containment or the runner
          # fails. This changes diagnostics only, not tests or their limits.
          level = os.environ['OFFLINE_SUITE']
          if level not in ('FAST', 'OPERATIONAL'):
              raise RuntimeError('explicit_offline_suite_required')
          sys.argv = ['operational.tests', level, '--verbose']
          runpy.run_module('operational.tests', run_name='__main__')
          PY
