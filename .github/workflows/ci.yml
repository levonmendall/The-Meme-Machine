name: DigitalOcean migration bridge inventory
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meme-machine-migration-source-inventory
  cancel-in-progress: false
jobs:
  source-inventory:
    if: github.ref == 'refs/heads/migration/do-bridge-20261015' && github.repository == 'levonmendall/The-Meme-Machine'
    runs-on: meme-machine-stage-e-observer
    timeout-minutes: 5
    steps:
      - name: Read-only original-host identity and migration prerequisites
        shell: bash
        env:
          ACTUAL_RUNNER: ${{ runner.name }}
        run: |
          set -euo pipefail
          test "$ACTUAL_RUNNER" = 'the meme machine'
          python3 -I -B - <<'PYCODE'
          import datetime,json,os,pathlib,platform,subprocess,urllib.request
          def command(argv):
              try:
                  p=subprocess.run(argv,capture_output=True,text=True,timeout=30)
                  return dict(exit=p.returncode,stdout=p.stdout.strip(),stderr=p.stderr.strip())
              except Exception as error:return dict(unavailable=type(error).__name__)
          def info(path):
              p=pathlib.Path(path)
              try:
                  s=p.lstat();return dict(uid=s.st_uid,gid=s.st_gid,mode=oct(s.st_mode&0o7777),symlink=p.is_symlink(),bytes=s.st_size)
              except Exception as error:return dict(unavailable=type(error).__name__)
          if platform.node()!='ubuntu-gd-2vcpu-8gb-nyc1':raise RuntimeError('source_hostname_mismatch')
          try:
              with urllib.request.urlopen('http://169.254.169.254/metadata/v1/id',timeout=3) as response:
                  droplet_id=response.read(100).decode().strip()
              if droplet_id!='605465049':raise RuntimeError('source_droplet_mismatch')
          except Exception as error:
              raise RuntimeError('source_droplet_identity_unavailable') from None
          volume=pathlib.Path('/mnt/volume_nyc1_1790918115030')
          roots=[p for p in volume.glob('meme-machine-paper*') if p.is_dir()]
          paths=['/opt/meme-machine','/opt/meme-machine/.venv/bin/python','/etc/meme-machine','/var/lib/meme-machine-handoff']
          config=pathlib.Path('/etc/meme-machine')
          files={str(p):info(p) for p in config.iterdir()} if config.is_dir() else {}
          result=dict(captured_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),runner=os.environ['ACTUAL_RUNNER'],
              droplet_id=droplet_id,hostname=platform.node(),identity=command(['id']),
              sudo=command(['sudo','-n','-l']),disk_free=command(['df','-B1']),
              devices=command(['lsblk','-J','-b','-o','NAME,PATH,SIZE,TYPE,FSTYPE,UUID,MOUNTPOINTS']),
              paper=command(['systemctl','show','meme-machine-paper.service','-p','ActiveState','-p','SubState','-p','MainPID','-p','ControlGroup','-p','UnitFileState','-p','Restart','-p','User','-p','EnvironmentFiles']),
              units=command(['systemctl','list-units','--all','meme-machine*','--no-pager']),
              source=command(['git','-c','safe.directory=/opt/meme-machine','-C','/opt/meme-machine','rev-parse','HEAD','HEAD^{tree}']),
              runtime=command(['/opt/meme-machine/.venv/bin/python','-I','-B','-c','import platform,sqlite3,json;print(json.dumps(dict(python=platform.python_version(),sqlite=sqlite3.sqlite_version)))']),
              paths={p:info(p) for p in paths},configuration_metadata=files,
              state_root_sizes={str(p):command(['du','-sb',str(p)]) for p in roots},
              sealed_recovery_size=command(['du','-sb','/var/lib/meme-machine-handoff/20261006T053005Z-capacity-hold']),
              economic_writes=False,provider_calls=False,protected_files_transferred=False)
          print(json.dumps(result,indent=2))
          pathlib.Path(os.environ['RUNNER_TEMP'],'do-migration-inventory.json').write_text(json.dumps(result,indent=2)+'\n')
          PYCODE
      - name: Preserve nonsecret source-host inventory only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: do-migration-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/do-migration-inventory.json
          if-no-files-found: error
          retention-days: 90
