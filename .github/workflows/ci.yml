name: paper-milestone
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test:
    if: github.event_name != 'push' || github.event.head_commit.message != '[cancel-runs]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate qualification Pump overlay
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[qualification-build]')
        run: |
          PUMP_SHA="$(python -c 'import json; print(json.load(open("certification/sources.json"))["lanes"]["pump"]["source_sha"])')"
          WORKTREE="$(mktemp -d)/pump"
          git fetch origin "$PUMP_SHA"
          git worktree add --detach "$WORKTREE" "$PUMP_SHA"
          git -C "$WORKTREE" apply --check "$GITHUB_WORKSPACE/certification/patches/pump-accounting.patch"
          git -C "$WORKTREE" apply --index "$GITHUB_WORKSPACE/certification/patches/pump-accounting.patch"
          (cd "$WORKTREE" && python -m unittest tests.test_solana_evidence_broker tests.test_evidence_consumers tests.test_pump_acceleration_history -v)
      - name: Validate qualification Meteora overlay
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[qualification-build]')
        run: |
          METEORA_SHA="$(python -c 'import json; print(json.load(open("certification/sources.json"))["lanes"]["meteora"]["source_sha"])')"
          WORKTREE="$(mktemp -d)/meteora"
          git fetch origin "$METEORA_SHA"
          git worktree add --detach "$WORKTREE" "$METEORA_SHA"
          git -C "$WORKTREE" apply --check "$GITHUB_WORKSPACE/certification/patches/meteora-checkpoint.patch"
          git -C "$WORKTREE" apply --index "$GITHUB_WORKSPACE/certification/patches/meteora-checkpoint.patch"
          (cd "$WORKTREE" && python -m unittest tests.test_dlmm_alchemy_provider tests.test_solana_dlmm_independent_v1 tests.test_dlmm_tape_extensions -v)
          (cd "$WORKTREE" && PYTHONPATH="$WORKTREE:$GITHUB_WORKSPACE" python "$GITHUB_WORKSPACE/certification/meteora_position_recovery_check.py")
          (cd "$WORKTREE" && python -m tests.dlmm_resource_check)
      - name: Validate qualification Pons overlay
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[qualification-build]')
        run: |
          PONS_SHA="$(python -c 'import json; print(json.load(open("certification/sources.json"))["lanes"]["pons"]["source_sha"])')"
          WORKTREE="$(mktemp -d)/pons"
          git fetch origin "$PONS_SHA"
          git worktree add --detach "$WORKTREE" "$PONS_SHA"
          git -C "$WORKTREE" apply --check "$GITHUB_WORKSPACE/certification/patches/pons-cohort-capital.patch"
          git -C "$WORKTREE" apply --index "$GITHUB_WORKSPACE/certification/patches/pons-cohort-capital.patch"
          (cd "$WORKTREE" && python -m unittest             robinhood_tests.test_pons_partial_accounting             robinhood_tests.test_pons_position_provider_recovery             robinhood_tests.test_pons_cohort_capital             robinhood_tests.test_pons_selective_continuation -v)
      - name: Validate qualification Ramses overlay
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[qualification-build]')
        run: |
          RAMSES_SHA="$(python -c 'import json; print(json.load(open("certification/sources.json"))["lanes"]["ramses"]["source_sha"])')"
          WORKTREE="$(mktemp -d)/ramses"
          git fetch origin "$RAMSES_SHA"
          git worktree add --detach "$WORKTREE" "$RAMSES_SHA"
          git -C "$WORKTREE" apply --check "$GITHUB_WORKSPACE/certification/patches/ramses-admission.patch"
          git -C "$WORKTREE" apply --index "$GITHUB_WORKSPACE/certification/patches/ramses-admission.patch"
          (cd "$WORKTREE" && python -m unittest             robinhood_tests.test_ramses_connected_lifecycle             robinhood_tests.test_ramses_rate_limit             robinhood_tests.test_ramses_strategy             robinhood_tests.test_ramses_strategy_isolation             robinhood_tests.test_ramses_continuous_campaign -v)
          (cd "$WORKTREE" && python -c "from robinhood_research.ramses_campaign import CampaignBooks; from robinhood_research.ramses_strategy import POLICY,POLICY_HASH,STRATEGY_DOMAIN; asset='0x'+'11'*20; costs=dict(entry_overhead=630350,add_liquidity=1260698,remove_liquidity=1260698,unwind=630349); position=204788; screen=dict(policy_hash=POLICY_HASH,strategy_domain=STRATEGY_DOMAIN,finalized_frontier_source='pinned_external_finalized_header',rows=[dict(token_y=asset,paper_capital_quote_raw=205467,gas_costs=costs,decision=dict(freeze=dict(proposals=[dict(capital_employed=position)])))]); expected=max(205467,position+sum(costs.values())*(1+POLICY['controller']['max_rebalances'])); assert CampaignBooks.budgets_from_screen(screen)[asset]==expected")
      - run: python -m unittest discover -v
      - run: python -m tests.resource_check
      - run: python -m tests.make_tape && python -m meme_machine --mode synthetic --config config.synthetic.json --db /tmp/meme-ci.db --tape tests/fixtures/synthetic_lifecycle.jsonl
  longevity-soak:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[longevity-soak]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Accelerated 24-hour storage and memory plateau proof
        run: python -m tests.longevity_soak --hours 24 --events-per-minute 1200 --writes-per-minute 12
  forced-real-data-canary:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[forced-canary]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: solana-public-rpc-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: One isolated forced real-data paper canary
        run: python -m tests.forced_real_data_canary
  postgrad-live:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[postgrad-live]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: solana-public-rpc-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Read-only PumpSwap and generic legacy Raydium discovery proof
        run: python -m tests.postgrad_live_probe | tee postgrad-live-report.json
      - name: Explicit provenanced legacy Raydium read and quote proof
        run: python -m tests.legacy_raydium_live_probe | tee legacy-raydium-live-report.json
      - name: Preserve raw captured evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgrad-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            postgrad-live-report.json
            postgrad-live-capture.json
            legacy-raydium-live-report.json
            legacy-raydium-live-capture.json
          if-no-files-found: warn
          retention-days: 30
  onfinality-auth-smoke:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[onfinality-auth-smoke]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MM_ONFINALITY_SOLANA_RPC_URL: ${{ secrets.MM_ONFINALITY_SOLANA_RPC_URL }}
      MM_ONFINALITY_SOLANA_WS_URL: ${{ secrets.MM_ONFINALITY_SOLANA_WS_URL }}
      MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Authenticated OnFinality HTTP and WebSocket smoke
        run: python -m tests.onfinality_authenticated_smoke
      - name: Preserve authenticated primary smoke
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onfinality-auth-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: onfinality-auth-smoke.json
          if-no-files-found: warn
          retention-days: 30
  pump-stream-parallel-compare:
    needs: test
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[stream-compare-live]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pump-stream-parallel-compare
      cancel-in-progress: false
    env:
      MM_ONFINALITY_SOLANA_WS_URL: ${{ secrets.MM_ONFINALITY_SOLANA_WS_URL }}
      MM_STREAM_COMPARE_SECONDS: '300'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Parallel authenticated OnFinality vs public Solana Pump stream comparison
        run: python -m tests.parallel_pump_stream_comparison
      - name: Preserve parallel stream comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pump-stream-parallel-compare-${{ github.run_id }}-${{ github.run_attempt }}
          path: pump-stream-parallel-comparison.json
          if-no-files-found: warn
          retention-days: 90

  high-throughput-e2e-certification:
    needs: test
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[high-throughput-e2e-cert]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Connected high-throughput deterministic certification
        run: python -m tests.high_throughput_e2e_certification
      - name: Preserve high-throughput certification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: high-throughput-e2e-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: high-throughput-e2e-certification.json
          if-no-files-found: warn
          retention-days: 90
  discovery-lane-compare:
    needs: test
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[discovery-compare-live]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: solana-pump-public-discovery-alchemy-http
      cancel-in-progress: false
    env:
      MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
      MM_DISCOVERY_COMPARE_SECONDS: '3300'
      MM_DISCOVERY_COMPARE_POST_SECONDS: '1000'
      MM_DISCOVERY_COMPARE_MAX_PER_LANE: '20'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Paired scout versus market-native shadow comparison
        run: python -m tests.discovery_lane_compare
      - name: Preserve paired discovery comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: discovery-lane-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: discovery-lane-comparison.json
          if-no-files-found: warn
          retention-days: 90
  market-native-priority:
    needs: test
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[market-native-priority-live]')
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    concurrency:
      group: solana-pump-public-discovery-alchemy-http
      cancel-in-progress: false
    env:
      MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
      MM_MARKET_NATIVE_PRIORITY_SECONDS: '3300'
      MM_MARKET_NATIVE_PREFLIGHT_BUDGET: '150'
      MM_MARKET_NATIVE_FULL_EVIDENCE_BUDGET: '40'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Prioritized market-native qualification with frozen continuation-v1
        run: python -m tests.prioritized_market_native_qualification
      - name: Preserve prioritized market-native report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: market-native-priority-${{ github.run_id }}-${{ github.run_attempt }}
          path: market-native-priority-report.json
          if-no-files-found: warn
          retention-days: 90
  market-native-fast-smoke:
    needs: test
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[market-native-smoke-live]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: solana-pump-public-discovery-alchemy-http
      cancel-in-progress: false
    env:
      MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
      MM_MARKET_NATIVE_SMOKE_SECONDS: '720'
      MM_MARKET_NATIVE_SMOKE_FILL_WAIT_SECONDS: '120'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Fast market-native active-runtime smoke
        run: python -m tests.market_native_fast_smoke
      - name: Preserve fast smoke diagnostics and replayable Store
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: market-native-fast-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            market-native-fast-smoke-report.json
            market-native-fast-smoke-evidence.json
            market-native-fast-smoke.db*
          if-no-files-found: warn
          retention-days: 30
  market-native-active-paper:
    needs: test
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[market-native-paper-live]')
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    concurrency:
      group: solana-pump-public-discovery-alchemy-http
      cancel-in-progress: false
    env:
      MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
      MM_MARKET_NATIVE_PAPER_DISCOVERY_SECONDS: '3300'
      MM_MARKET_NATIVE_PAPER_POST_SECONDS: '1000'
      PRIOR_PUBLIC_RPC_RUN_ID: '35272214900'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Wait for prior public-RPC probe to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          run_id=os.environ['PRIOR_PUBLIC_RPC_RUN_ID']
          url=f'https://api.github.com/repos/levonmendall/The-Meme-Machine/actions/runs/{run_id}'
          headers={'Accept':'application/vnd.github+json',
                   'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
                   'X-GitHub-Api-Version':'2022-11-28'}
          for _ in range(80):
              request=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(request,timeout=10) as response:
                  state=json.load(response)
              if state.get('status') not in ('queued','in_progress','waiting','pending'):
                  print(json.dumps({'prior_run':run_id,'status':state.get('status'),
                                    'conclusion':state.get('conclusion')},sort_keys=True))
                  break
              time.sleep(15)
          else:
              raise SystemExit('prior_public_rpc_probe_still_active')
          PY
      - name: First real market-native active paper lifecycle
        run: python -m tests.market_native_active_paper
      - name: Preserve active paper lifecycle proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: market-native-active-paper-${{ github.run_id }}-${{ github.run_attempt }}
          path: market-native-active-paper-report.json
          if-no-files-found: warn
          retention-days: 90
  market-native-paper-cohort:
    needs: test
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[market-native-cohort-live]')
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    concurrency:
      group: solana-pump-public-discovery-alchemy-http
      cancel-in-progress: false
    env:
      MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
      MM_MARKET_NATIVE_COHORT_DISCOVERY_SECONDS: '5400'
      MM_MARKET_NATIVE_COHORT_POST_SECONDS: '1100'
      MM_MARKET_NATIVE_COHORT_TARGET_SETTLED: '3'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Multi-position natural Pump/PumpSwap paper cohort
        run: python -m tests.market_native_paper_cohort
      - name: Preserve natural paper cohort evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: market-native-paper-cohort-${{ github.run_id }}-${{ github.run_attempt }}
          path: market-native-paper-cohort-report.json
          if-no-files-found: warn
          retention-days: 90
  qualified-post-exit-history:
    needs: test
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[post-exit-outcome-live]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: solana-public-rpc-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Counterfactual follow-up after proven +15% paper exit
        run: python -m tests.qualified_post_exit_history --seed research/post_exit_35301686960.json
      - name: Preserve post-exit outcome evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-post-exit-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualified-post-exit-history.json
          if-no-files-found: warn
          retention-days: 90
  market-native-outcome-study:
    needs: test
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[market-native-outcomes-live]')
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    concurrency:
      group: solana-pump-public-discovery-alchemy-http
      cancel-in-progress: true
    env:
      MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
      MM_MARKET_NATIVE_OUTCOME_DISCOVERY_SECONDS: '3300'
      MM_MARKET_NATIVE_OUTCOME_FOLLOWUP_SECONDS: '3600'
      MM_MARKET_NATIVE_OUTCOME_NATURAL_BUDGET: '180'
      MM_MARKET_NATIVE_OUTCOME_PRIORITY_BUDGET: '240'
      MM_MARKET_NATIVE_OUTCOME_EXTRA_EVIDENCE_BUDGET: '240'
      MM_MARKET_NATIVE_OUTCOME_EXTRA_EVIDENCE_PER_SLOT: '5'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Unbiased and missed-opportunity forward outcome study
        run: python -m tests.market_native_opportunity_outcomes
      - name: Preserve strategy outcome research
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: market-native-opportunity-outcomes-${{ github.run_id }}-${{ github.run_attempt }}
          path: market-native-opportunity-outcomes.json
          if-no-files-found: warn
          retention-days: 90
  market-native-sample-supplement:
    needs: test
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[market-native-sample-supplement-live]')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: solana-pump-public-discovery-alchemy-http
      cancel-in-progress: false
    env:
      MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
      MM_MARKET_NATIVE_OUTCOME_DISCOVERY_SECONDS: '1200'
      MM_MARKET_NATIVE_OUTCOME_FOLLOWUP_SECONDS: '300'
      MM_MARKET_NATIVE_OUTCOME_NATURAL_BUDGET: '30'
      MM_MARKET_NATIVE_OUTCOME_PRIORITY_BUDGET: '40'
      MM_MARKET_NATIVE_OUTCOME_EXTRA_EVIDENCE_BUDGET: '20'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Supplemental unbiased sample and missed-opportunity evidence
        run: python -m tests.market_native_opportunity_outcomes
      - name: Preserve supplemental market-native sample
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: market-native-sample-supplement-${{ github.run_id }}-${{ github.run_attempt }}
          path: market-native-opportunity-outcomes.json
          if-no-files-found: warn
          retention-days: 90
  live-diagnostic:
    # Historical shadow diagnostic is opt-in; ordinary commits never launch it.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[legacy-shadow-connectivity]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    concurrency:
      group: solana-public-rpc-live
      cancel-in-progress: false
    env:
      MM_STREAM_OBSERVE_SECONDS: '3300'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Finalized-stream shadow qualification using unchanged continuation-v1
        run: python -m tests.prospective_stream_qualification | tee qualification-report.json
      - name: Preserve qualification research artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-vector-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification-report.json
          if-no-files-found: warn
          retention-days: 90
