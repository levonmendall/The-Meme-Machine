name: paper-milestone
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m unittest discover -v
      - run: python -m tests.resource_check
      - run: python -m tests.make_tape && python -m meme_machine --mode synthetic --config config.synthetic.json --db /tmp/meme-ci.db --tape tests/fixtures/synthetic_lifecycle.jsonl
  longevity-soak:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[longevity-soak]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Accelerated 24-hour storage and memory plateau proof
        run: python -m tests.longevity_soak --hours 24 --events-per-minute 1200 --writes-per-minute 12
  forced-real-data-canary:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[forced-canary]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: One isolated forced real-data paper canary
        run: python -m tests.forced_real_data_canary
  live-diagnostic:
    if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[forced-canary]') && !contains(github.event.head_commit.message, '[longevity') && !contains(github.event.head_commit.message, '[qualification-build]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    env:
      MM_STREAM_OBSERVE_SECONDS: '3300'
      MM_STREAM_MAX_EVIDENCE_CANDIDATES: '24'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      # Warm one uninterrupted finalized Pump-program stream for the full unchanged
      # 60-second evidence window, then observe prospectively for 55 minutes. The
      # candidate/RPC budget remains bounded and cannot grant order authority.
      - name: Finalized-stream shadow qualification using unchanged continuation-v1
        run: python -m tests.prospective_stream_qualification | tee qualification-report.json
      - name: Preserve qualification research artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-vector-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification-report.json
          if-no-files-found: warn
          retention-days: 90