name: pump-acceleration-natural-prospective
on:
  push:
    branches: [strategy/pump-profitability-v1]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[pump-acceleration-natural-live]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m unittest discover -v
      - run: python -m tests.resource_check
      - run: python -m py_compile tests/pump_acceleration_natural_prospective.py
      - name: Verify exact frozen strategy policy hash
        run: |
          python - <<'PY'
          from meme_machine.pump_acceleration_strategy import policy_hash
          expected="561ce76a334d9cdcd3b4888a9aaee24d11c9eb43f1ca20c5b806940297018bfc"
          actual=policy_hash()
          print({"expected":expected,"actual":actual})
          if actual != expected:
              raise SystemExit("frozen_policy_hash_changed")
          PY
  natural-prospective:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: solana-pump-public-discovery-alchemy-http
      cancel-in-progress: true
    env:
      MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
      MM_PUMP_ACCELERATION_DISCOVERY_SECONDS: '900'
      MM_PUMP_ACCELERATION_FOLLOWUP_SECONDS: '300'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Profitability-v1 natural prospective Pump acceleration paper study
        run: python -m tests.pump_acceleration_natural_prospective
      - name: Preserve exact frozen-policy prospective artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pump-acceleration-natural-prospective-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pump-acceleration-natural-prospective.json
            solana-evidence-broker.sqlite3
          if-no-files-found: warn
          retention-days: 90
