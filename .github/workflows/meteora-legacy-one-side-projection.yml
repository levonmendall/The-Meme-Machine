name: meteora-legacy-one-side-projection
on:
  push:
    branches: [repair/meteora-legacy-one-side-replay-20260924]
permissions:
  contents: read
jobs:
  project:
    if: contains(github.event.head_commit.message, '[meteora-one-side-projection]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Prepare exact declared lane overlays
        run: python -m certification.run prepare "$RUNNER_TEMP/worktrees"
      - name: Compute prepared Meteora identity
        run: |
          mkdir -p projection
          git -C "$RUNNER_TEMP/worktrees/meteora" diff --binary --full-index --no-ext-diff --no-textconv --no-renames HEAD > projection/meteora.diff
          sha256sum projection/meteora.diff | tee projection/meteora-source-diff.sha256
          git -C "$RUNNER_TEMP/worktrees/meteora" diff --check | tee projection/diff-check.txt
      - name: Focused legacy one-side replay tests
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/worktrees/meteora"
          python -m unittest tests.test_dlmm_tape -v 2>&1 | tee "$GITHUB_WORKSPACE/projection/focused-tests.log"
      - name: Full Meteora offline suite
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/worktrees/meteora"
          python -m unittest discover -v 2>&1 | tee "$GITHUB_WORKSPACE/projection/meteora-suite.log"
      - name: Meteora resource gates
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/worktrees/meteora"
          python -m tests.resource_check 2>&1 | tee "$GITHUB_WORKSPACE/projection/resource.log"
          python -m tests.dlmm_resource_check 2>&1 | tee "$GITHUB_WORKSPACE/projection/dlmm-resource.log"
      - name: Verify source identity unchanged by tests
        run: |
          git -C "$RUNNER_TEMP/worktrees/meteora" diff --binary --full-index --no-ext-diff --no-textconv --no-renames HEAD > projection/meteora-after.diff
          cmp projection/meteora.diff projection/meteora-after.diff
          sha256sum projection/meteora-after.diff | tee projection/meteora-after-source-diff.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: meteora-legacy-one-side-projection-${{ github.run_id }}
          path: projection/
          if-no-files-found: warn
          retention-days: 30
