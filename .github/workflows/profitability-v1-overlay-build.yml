name: profitability-v1-overlay-build
on:
  push:
    branches: [cert/profitability-v1-current]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build rebased operational plus profitability overlays
        run: python certification/build_profitability_overlays.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: profitability-v1-overlay-build-${{ github.run_id }}
          path: profitability-overlay-build/
          if-no-files-found: warn
          retention-days: 30
