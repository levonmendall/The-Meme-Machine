name: profitability-v1-overlay-build
on:
  push:
    branches: [cert/profitability-v1-current]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build combined operational plus profitability overlays
        run: |
          set -euo pipefail
          mkdir -p profitability-overlay-build

          merge_lane() {
            lane="$1"; base="$2"; profit="$3"; old_patch="$4"; shift 4
            work="$RUNNER_TEMP/$lane-combined"
            git fetch origin "$base" "$profit"
            git worktree add --detach "$work" "$base"
            git -C "$work" apply --index "$GITHUB_WORKSPACE/$old_patch"
            for file in "$@"; do
              base_file="$RUNNER_TEMP/base-${lane}-$(basename "$file")"
              profit_file="$RUNNER_TEMP/profit-${lane}-$(basename "$file")"
              merged_file="$RUNNER_TEMP/merged-${lane}-$(basename "$file")"
              git -C "$work" show "HEAD:$file" > "$base_file"
              git show "$profit:$file" > "$profit_file"
              cp "$work/$file" "$merged_file"
              set +e
              git merge-file -p "$merged_file" "$base_file" "$profit_file" > "$merged_file.out"
              rc=$?
              set -e
              mv "$merged_file.out" "$work/$file"
              if [ "$rc" -gt 0 ]; then
                echo "MERGE_CONFLICT_RESOLVING lane=$lane file=$file"
                if [ "$lane" = pump ] && [ "$file" = tests/pump_acceleration_natural_prospective.py ]; then
                  python - "$work/$file" <<'PY'
import re,sys
p=sys.argv[1];s=open(p).read()
m=re.search(r'<<<<<<<[^\n]*\n(.*?)=======\n(.*?)>>>>>>>[^\n]*\n',s,re.S)
if not m:raise SystemExit('pump_conflict_not_found')
left=m.group(1).replace(
    'FROZEN_POLICY_HASH="bb2631d83f5be287a0afc01dfc6d7a4da8b7086ae0afd09dfbf27df6d9d66a6e"',
    'FROZEN_POLICY_HASH="561ce76a334d9cdcd3b4888a9aaee24d11c9eb43f1ca20c5b806940297018bfc"')
s=s[:m.start()]+left+s[m.end():]
open(p,'w').write(s)
PY
                elif [ "$lane" = pons ] && [ "$file" = robinhood_research/pons_selective_cohort.py ]; then
                  python - "$work/$file" <<'PY'
import re,sys
p=sys.argv[1];s=open(p).read()
conf=list(re.finditer(r'<<<<<<<[^\n]*\n(.*?)=======\n(.*?)>>>>>>>[^\n]*\n',s,re.S))
if len(conf)!=3:raise SystemExit(f'pons_conflict_count:{len(conf)}')
repls=[
'''            "distinct Pons V2 buys receive minimal current-state authentication; "
            "trajectory/window investment evaluation is admitted only when current "
            "ungraduated native-quote state satisfies the profitability-v1 progress, "
            "snipe-tax, creator-tax, maturity, ETA and friction prospect screen; "
            "paper entry additionally requires a terminal/flat prior same-curve "
            "lifecycle plus a point-in-time regime reset; at most one screen per "
            "curve per 2 wall-clock seconds; no outcome reranking"
''',
'''                    if len(futures)>=MAX_CONCURRENT_LIFECYCLES:
                        life=dict(index=qindex,status='capacity_censored',
                            boundary='selective_concurrent_position_capacity',economic_rejection=False)
                        result['lifecycles'].append(life)
                        _append_jsonl(ROOT/'completed-lifecycles.jsonl',life)
                        continue
                    future=pool.submit(
                        run_lifecycle,endpoint,evaluation,
                        db_path=ROOT/f"trial-{qindex:03d}.sqlite",
                        capital_path=ROOT/"pons-selective-cohort-capital.sqlite",
                    )
                    futures.append((qindex,future))
                    active_curve_futures[curve]=(qindex,future)
                    last_authorized_vector[curve]=evaluation["vector"]
''',
''
]
for m,repl in reversed(list(zip(conf,repls))):
    s=s[:m.start()]+repl+s[m.end():]
s=s.replace(
'            result["lifecycles"].append(life)\n            last_terminal_by_curve[curve]=life',
'            result["lifecycles"].append(life)\n            _append_jsonl(ROOT/"completed-lifecycles.jsonl",life)\n            last_terminal_by_curve[curve]=life')
s=s.replace(
'            futures=_collect_completed(result,futures)',
'            for curve_key in list(active_curve_futures):\n                collect_curve_future(curve_key)\n            futures=[item for item in futures if id(item[1]) not in collected_futures]')
s=s.replace(
'''                for qindex,future in futures:
                    try:life=future.result()
                    except Exception as exc:life=dict(status='unexpected_boundary',boundary=type(exc).__name__)
                    life['index']=qindex
                    result['lifecycles'].append(life)
                    _append_jsonl(ROOT/'completed-lifecycles.jsonl',life)
                    _checkpoint(result,cursor=cursor,feed=feed,rpc=rpc,phase='position_drain')
''',
'''                for qindex,future in futures:
                    if id(future) in collected_futures:
                        continue
                    try:life=future.result()
                    except Exception as exc:life=dict(status='unexpected_boundary',boundary=type(exc).__name__)
                    life['index']=qindex
                    result['lifecycles'].append(life)
                    _append_jsonl(ROOT/'completed-lifecycles.jsonl',life)
                    collected_futures.add(id(future))
                    _checkpoint(result,cursor=cursor,feed=feed,rpc=rpc,phase='position_drain')
''')
if any(x in s for x in ('<<<<<<<','=======','>>>>>>>')):
    raise SystemExit('pons_conflict_marker_remaining')
open(p,'w').write(s)
PY
                else
                  echo "UNRESOLVED_CONFLICT lane=$lane file=$file"
                  grep -n -C 8 '<<<<<<<\|=======\|>>>>>>>' "$work/$file" || true
                  cp "$work/$file" "profitability-overlay-build/${lane}-conflict-$(basename "$file")"
                  return 1
                fi
              fi
              if grep -q '<<<<<<<\|=======\|>>>>>>>' "$work/$file"; then
                echo "CONFLICT_MARKER_REMAINING lane=$lane file=$file"
                return 1
              fi
            done
            git -C "$work" diff --binary HEAD > "profitability-overlay-build/${lane}-combined.patch"
            git -C "$work" diff --check
          }

          status=0
          merge_lane pump 04c99ca3125747dc8bfc6f655fec7533f8ac8156 160985182b043ab41d0418ba5dcfed7dbfbe3cb2 certification/patches/pump-accounting.patch             meme_machine/pump_acceleration_strategy.py tests/pump_acceleration_natural_prospective.py tests/test_pump_acceleration_strategy.py tests/test_pump_acceleration_policy_identity.py .github/workflows/pump-acceleration-natural-prospective.yml .github/workflows/ci.yml || status=1

          merge_lane pons c692fe446bdee4ea1179da27a3f0c9f2f281f118 a8b560c13f7e1b3696ac7f7aa9f35801f87421e1 certification/patches/pons-cohort-capital.patch             robinhood_research/pons_selective_continuation.py robinhood_research/pons_selective_cohort.py robinhood_tests/test_pons_selective_continuation.py .github/workflows/robinhood-research.yml || status=1

          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: profitability-v1-overlay-build-${{ github.run_id }}
          path: profitability-overlay-build/
          if-no-files-found: warn
          retention-days: 30
