name: four-lane-certification
on:
  push:
    branches: [cert/one-hour-repair-campaign, cert/prospective-market-v1, cert/dlmm-machinery-proof-current, repair/solana-alchemy-efficiency, repair/frozen-campaign-handoff]
  workflow_dispatch:
    inputs:
      phase:
        description: Smoke only, or clean smoke followed by a fresh one-hour campaign
        required: true
        default: smoke
        type: choice
        options: [smoke, hourly]
permissions:
  contents: read
  actions: write
  checks: write
concurrency:
  group: meme-machine-four-lane-certification
  cancel-in-progress: ${{ github.event_name == 'push' && github.event.head_commit.message == '[cancel-runs]' }}
jobs:
  concurrent-smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[four-lane-smoke]') || contains(github.event.head_commit.message, '[four-lane-hourly]')
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    outputs:
      readiness: ${{ steps.readiness.outputs.readiness }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Supervisor, accounting and cross-process capacity regressions
        run: |
          mkdir -p certification-gates
          set -o pipefail
          python -m py_compile certification/frozen_artifact_review.py certification/inspect_stable_artifact.py
          python -m unittest discover -s certification/tests -v 2>&1 | tee certification-gates/supervisor-tests.log
      - name: Create isolated exact-source worktrees
        run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/four-lane-worktrees"
      - name: Full deterministic lane suites and resource gates
        run: python -m certification.run verify --worktrees "$RUNNER_TEMP/four-lane-worktrees" --output certification-gates
      - name: Verify current heads and absence of competing market jobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m certification.guard --wait-seconds 3600
      - name: Secret-safe Solana and Robinhood chain binding
        env:
          MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
          MM_ROBINHOOD_READ_RPC_URL: ${{ secrets.MM_ROBINHOOD_READ_RPC_URL }}
          MM_ROBINHOOD_DLMM_RPC_URL: ${{ secrets.MM_ROBINHOOD_DLMM_RPC_URL }}
        run: python -m certification.chain_binding --output certification-gates/chain-binding.json
      - name: Bounded existing-endpoint read-only capability probes
        env:
          MM_ROBINHOOD_READ_RPC_URL: ${{ secrets.MM_ROBINHOOD_READ_RPC_URL }}
          MM_ROBINHOOD_DLMM_RPC_URL: ${{ secrets.MM_ROBINHOOD_DLMM_RPC_URL }}
        run: python -m certification.capabilities --worktrees "$RUNNER_TEMP/four-lane-worktrees" --output certification-gates/rpc-capabilities.json
      - name: Concurrent paper smoke with original frozen lane runners
        env:
          GH_CHECKS_TOKEN: ${{ github.token }}
          MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
          MM_ROBINHOOD_READ_RPC_URL: ${{ secrets.MM_ROBINHOOD_READ_RPC_URL }}
          MM_ROBINHOOD_DISCOVERY_RPC_URL: ${{ secrets.MM_ROBINHOOD_DISCOVERY_RPC_URL }}
          MM_ROBINHOOD_DLMM_RPC_URL: ${{ secrets.MM_ROBINHOOD_DLMM_RPC_URL }}
          MM_ROBINHOOD_RAMSES_COSTS_BY_POOL_JSON: ${{ secrets.MM_ROBINHOOD_RAMSES_COSTS_BY_POOL_JSON }}
          MM_ROBINHOOD_RAMSES_SIGNALS_BY_POOL_JSON: ${{ secrets.MM_ROBINHOOD_RAMSES_SIGNALS_BY_POOL_JSON }}
        run: exec python -m certification.live_status --output certification-smoke --phase smoke -- python -m certification.run run --worktrees "$RUNNER_TEMP/four-lane-worktrees" --output certification-smoke --gate certification-gates/deterministic.json --phase smoke --seconds 600
      - name: Export exact-revision engineering readiness
        id: readiness
        run: python -m certification.controls --smoke-result certification-smoke/result.json --output "$GITHUB_OUTPUT"
      - name: Mark cancelled collection
        if: cancelled()
        run: echo "MM_ARCHIVE_CANCELLED=true" >> "$GITHUB_ENV"
      - name: Preserve smoke native ledgers before creating the hourly study
        if: always()
        run: python -m certification.archive_native --worktrees "$RUNNER_TEMP/four-lane-worktrees" --output certification-artifact --evidence-root . --phase smoke --cancelled "${MM_ARCHIVE_CANCELLED:-false}"
      - name: Preserve success and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: four-lane-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: certification-artifact/
          if-no-files-found: error
          retention-days: 90

  hourly-campaign:
    needs: [concurrent-smoke, smoke-artifact-review]
    if: inputs.phase == 'hourly' || contains(github.event.head_commit.message, '[four-lane-hourly]')
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Supervisor, accounting and cross-process capacity regressions
        run: |
          mkdir -p certification-gates
          set -o pipefail
          python -m py_compile certification/frozen_artifact_review.py certification/inspect_stable_artifact.py
          python -m unittest discover -s certification/tests -v 2>&1 | tee certification-gates/supervisor-tests.log
      - name: Create isolated exact-source worktrees
        run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/four-lane-worktrees"
      - name: Full deterministic lane suites and resource gates
        run: python -m certification.run verify --worktrees "$RUNNER_TEMP/four-lane-worktrees" --output certification-gates
      - name: Verify current heads and absence of competing market jobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m certification.guard --wait-seconds 3600
      - name: Restore exact smoke readiness
        env:
          SMOKE_READINESS: ${{ needs.concurrent-smoke.outputs.readiness }}
        run: python -c 'import os,pathlib,json; value=json.loads(os.environ["SMOKE_READINESS"]); pathlib.Path("smoke-readiness.json").write_text(json.dumps(value))'
      - name: Secret-safe Solana and Robinhood chain binding
        env:
          MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
          MM_ROBINHOOD_READ_RPC_URL: ${{ secrets.MM_ROBINHOOD_READ_RPC_URL }}
          MM_ROBINHOOD_DLMM_RPC_URL: ${{ secrets.MM_ROBINHOOD_DLMM_RPC_URL }}
        run: python -m certification.chain_binding --output certification-gates/chain-binding.json
      - name: Bounded existing-endpoint read-only capability probes
        env:
          MM_ROBINHOOD_READ_RPC_URL: ${{ secrets.MM_ROBINHOOD_READ_RPC_URL }}
          MM_ROBINHOOD_DLMM_RPC_URL: ${{ secrets.MM_ROBINHOOD_DLMM_RPC_URL }}
        run: python -m certification.capabilities --worktrees "$RUNNER_TEMP/four-lane-worktrees" --output certification-gates/rpc-capabilities.json
      - name: One-hour continuous paper campaign, no process restart
        env:
          GH_CHECKS_TOKEN: ${{ github.token }}
          MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
          MM_ROBINHOOD_READ_RPC_URL: ${{ secrets.MM_ROBINHOOD_READ_RPC_URL }}
          MM_ROBINHOOD_DISCOVERY_RPC_URL: ${{ secrets.MM_ROBINHOOD_DISCOVERY_RPC_URL }}
          MM_ROBINHOOD_DLMM_RPC_URL: ${{ secrets.MM_ROBINHOOD_DLMM_RPC_URL }}
          MM_ROBINHOOD_RAMSES_COSTS_BY_POOL_JSON: ${{ secrets.MM_ROBINHOOD_RAMSES_COSTS_BY_POOL_JSON }}
          MM_ROBINHOOD_RAMSES_SIGNALS_BY_POOL_JSON: ${{ secrets.MM_ROBINHOOD_RAMSES_SIGNALS_BY_POOL_JSON }}
        run: exec python -m certification.live_status --output certification-hourly --phase hourly -- python -m certification.run run --worktrees "$RUNNER_TEMP/four-lane-worktrees" --output certification-hourly --gate certification-gates/deterministic.json --phase hourly --seconds 3600 --smoke-result smoke-readiness.json
      - name: Mark cancelled collection
        if: cancelled()
        run: echo "MM_ARCHIVE_CANCELLED=true" >> "$GITHUB_ENV"
      - name: Preserve hourly native ledgers including per-asset Ramses books
        if: always()
        run: python -m certification.archive_native --worktrees "$RUNNER_TEMP/four-lane-worktrees" --output certification-artifact --evidence-root . --phase hourly --cancelled "${MM_ARCHIVE_CANCELLED:-false}"
      - name: Record prospective economic block without selecting on outcome
        if: always()
        run: |
          if [ -f certification-hourly/result.json ]; then
            python -m certification.prospective_acceptance record \
              --result certification-hourly/result.json \
              --run-dir certification-artifact \
              --chain-binding certification-gates/chain-binding.json \
              --output certification-artifact/prospective-observation.json
          fi
          if [ -f certification-hourly-live-snapshots.jsonl ]; then
            cp certification-hourly-live-snapshots.jsonl certification-artifact/
          fi
      - name: Preserve hourly success or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: four-lane-hourly-${{ github.run_id }}-${{ github.run_attempt }}
          path: certification-artifact/
          if-no-files-found: error
          retention-days: 90
      - name: Start automatic durable continuation for open long-horizon positions
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/continuation-lanes
          import json
          from pathlib import Path
          row=json.loads(Path("certification-hourly/result.json").read_text())
          for lane in ("meteora","ramses"):
              state=(row.get("lanes") or {}).get(lane) or {}
              if int(state.get("open_positions") or 0)>0 and state.get("durable_handoff") is True:
                  print(lane)
          PY
          while read -r lane; do
            [ -n "$lane" ] || continue
            gh workflow run position-continuation.yml \
              --ref "$GITHUB_REF_NAME" \
              -f lane="$lane" \
              -f state_run_id="$GITHUB_RUN_ID" \
              -f slice_seconds="3000"
          done < /tmp/continuation-lanes

  smoke-artifact-review:
    needs: concurrent-smoke
    if: needs.concurrent-smoke.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify artifact digest and inspect all native evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_RUN_ID: ${{ github.run_id }}
          REVIEW_SHA: ${{ github.sha }}
          REVIEW_PHASE: smoke
        run: python certification/inspect_stable_artifact.py
      - name: Preserve complete artifact review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smoke-artifact-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: frozen-review/
          if-no-files-found: error
          retention-days: 90

  hourly-artifact-review:
    needs: hourly-campaign
    if: always() && (needs.hourly-campaign.result == 'success' || needs.hourly-campaign.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify artifact digest and inspect all native evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_RUN_ID: ${{ github.run_id }}
          REVIEW_SHA: ${{ github.sha }}
          REVIEW_PHASE: hourly
        run: python certification/inspect_stable_artifact.py
      - name: Preserve complete artifact review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hourly-artifact-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: frozen-review/
          if-no-files-found: error
          retention-days: 90
