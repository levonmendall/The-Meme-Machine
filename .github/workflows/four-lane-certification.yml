name: four-lane-certification
on:
  push:
    branches: [certification/four-lane-repair-integration-20260920]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: meme-machine-four-lane-certification
  cancel-in-progress: false
jobs:
  concurrent-smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[four-lane-smoke]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Supervisor, accounting and cross-process capacity regressions
        run: |
          mkdir -p certification-gates
          set -o pipefail
          python -m unittest certification.tests.test_certification -v 2>&1 | tee certification-gates/supervisor-tests.log
      - name: Create isolated exact-source worktrees
        run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/four-lane-worktrees"
      - name: Full deterministic lane suites and resource gates
        run: python -m certification.run verify --worktrees "$RUNNER_TEMP/four-lane-worktrees" --output certification-gates
      - name: Verify current heads and absence of competing market jobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m certification.guard
      - name: Concurrent paper smoke with original frozen lane runners
        env:
          MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
          MM_ROBINHOOD_READ_RPC_URL: ${{ secrets.MM_ROBINHOOD_READ_RPC_URL }}
          MM_ROBINHOOD_DISCOVERY_RPC_URL: ${{ secrets.MM_ROBINHOOD_DISCOVERY_RPC_URL }}
          MM_ROBINHOOD_DLMM_RPC_URL: ${{ secrets.MM_ROBINHOOD_DLMM_RPC_URL }}
          MM_ROBINHOOD_RAMSES_COSTS_BY_POOL_JSON: ${{ secrets.MM_ROBINHOOD_RAMSES_COSTS_BY_POOL_JSON }}
          MM_ROBINHOOD_RAMSES_SIGNALS_BY_POOL_JSON: ${{ secrets.MM_ROBINHOOD_RAMSES_SIGNALS_BY_POOL_JSON }}
        run: python -m certification.run run --worktrees "$RUNNER_TEMP/four-lane-worktrees" --output certification-smoke --gate certification-gates/deterministic.json --phase smoke --seconds 600
      - name: Preserve success and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: four-lane-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            certification-gates/
            certification-smoke/
            certification-preflight.json
            ${{ runner.temp }}/four-lane-worktrees/pump/pump-acceleration-natural-prospective*
            ${{ runner.temp }}/four-lane-worktrees/pump/pump-acceleration-natural-prospective.accounting.sqlite3*
            ${{ runner.temp }}/four-lane-worktrees/pump/pump-acceleration-natural-prospective.candidates.jsonl
            ${{ runner.temp }}/four-lane-worktrees/meteora/solana-dlmm-independent-v1-live.json
            ${{ runner.temp }}/four-lane-worktrees/pons/pons-selective-continuation-v1-cohort.json
            ${{ runner.temp }}/four-lane-worktrees/pons/pons-selective-continuation-v1-cohort/
            ${{ runner.temp }}/four-lane-worktrees/ramses/robinhood-ramses-extended-market-report.json
            ${{ runner.temp }}/four-lane-worktrees/ramses/robinhood-ramses-extended-market.sqlite
            ${{ runner.temp }}/four-lane-worktrees/ramses/robinhood-ramses-all-pool-inventory-cache.json
          if-no-files-found: error
          retention-days: 90
