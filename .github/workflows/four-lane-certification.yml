name: four-lane-certification
on:
  push:
    branches: [cert/one-hour-repair-campaign, repair/solana-alchemy-efficiency, repair/frozen-campaign-handoff]
  workflow_dispatch:
    inputs:
      phase:
        description: Smoke only, or clean smoke followed by a fresh one-hour campaign
        required: true
        default: smoke
        type: choice
        options: [smoke, hourly]
permissions:
  contents: read
  actions: read
  checks: write
concurrency:
  group: meme-machine-four-lane-certification
  cancel-in-progress: ${{ github.event_name == 'push' && github.event.head_commit.message == '[cancel-runs]' }}
jobs:
  concurrent-smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[four-lane-smoke]') || contains(github.event.head_commit.message, '[four-lane-hourly]')
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    outputs:
      readiness: ${{ steps.readiness.outputs.readiness }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Supervisor, accounting and cross-process capacity regressions
        run: |
          mkdir -p certification-gates
          set -o pipefail
          python -m unittest discover -s certification/tests -v 2>&1 | tee certification-gates/supervisor-tests.log
      - name: Create isolated exact-source worktrees
        run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/four-lane-worktrees"
      - name: Full deterministic lane suites and resource gates
        run: python -m certification.run verify --worktrees "$RUNNER_TEMP/four-lane-worktrees" --output certification-gates
      - name: Verify current heads and absence of competing market jobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m certification.guard --wait-seconds 3600
      - name: Bounded existing-endpoint read-only capability probes
        env:
          MM_ROBINHOOD_READ_RPC_URL: ${{ secrets.MM_ROBINHOOD_READ_RPC_URL }}
          MM_ROBINHOOD_DLMM_RPC_URL: ${{ secrets.MM_ROBINHOOD_DLMM_RPC_URL }}
        run: python -m certification.capabilities --worktrees "$RUNNER_TEMP/four-lane-worktrees" --output certification-gates/rpc-capabilities.json
      - name: Concurrent paper smoke with original frozen lane runners
        env:
          GH_CHECKS_TOKEN: ${{ github.token }}
          MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
          MM_ROBINHOOD_READ_RPC_URL: ${{ secrets.MM_ROBINHOOD_READ_RPC_URL }}
          MM_ROBINHOOD_DISCOVERY_RPC_URL: ${{ secrets.MM_ROBINHOOD_DISCOVERY_RPC_URL }}
          MM_ROBINHOOD_DLMM_RPC_URL: ${{ secrets.MM_ROBINHOOD_DLMM_RPC_URL }}
          MM_ROBINHOOD_RAMSES_COSTS_BY_POOL_JSON: ${{ secrets.MM_ROBINHOOD_RAMSES_COSTS_BY_POOL_JSON }}
          MM_ROBINHOOD_RAMSES_SIGNALS_BY_POOL_JSON: ${{ secrets.MM_ROBINHOOD_RAMSES_SIGNALS_BY_POOL_JSON }}
        run: python -m certification.live_status --output certification-smoke --phase smoke -- python -m certification.run run --worktrees "$RUNNER_TEMP/four-lane-worktrees" --output certification-smoke --gate certification-gates/deterministic.json --phase smoke --seconds 600
      - name: Export exact-revision engineering readiness
        id: readiness
        run: python -m certification.controls --smoke-result certification-smoke/result.json --output "$GITHUB_OUTPUT"
      - name: Preserve smoke native ledgers before creating the hourly study
        if: always()
        run: python -m certification.archive_native --worktrees "$RUNNER_TEMP/four-lane-worktrees" --output certification-native/smoke
      - name: Preserve success and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: four-lane-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            certification-*-publisher.jsonl
            certification-gates/
            certification-smoke/
            certification-preflight.json
            certification-contention-history.jsonl
            certification-hourly-gates/
            certification-hourly/
            certification-native/
            ${{ runner.temp }}/four-lane-worktrees/pump/pump-acceleration-natural-prospective*
            ${{ runner.temp }}/four-lane-worktrees/pump/pump-acceleration-natural-prospective.accounting.sqlite3*
            ${{ runner.temp }}/four-lane-worktrees/pump/pump-acceleration-natural-prospective.candidates.jsonl
            ${{ runner.temp }}/four-lane-worktrees/meteora/solana-dlmm-independent-v1-live*
            ${{ runner.temp }}/four-lane-worktrees/pons/pons-selective-continuation-v1-cohort.json
            ${{ runner.temp }}/four-lane-worktrees/pons/pons-selective-continuation-v1-cohort/
            ${{ runner.temp }}/four-lane-worktrees/ramses/robinhood-ramses-extended-market-report.json
            ${{ runner.temp }}/four-lane-worktrees/ramses/robinhood-ramses-extended-market.sqlite*
            ${{ runner.temp }}/four-lane-worktrees/ramses/robinhood-ramses-all-pool-inventory-cache.json
          if-no-files-found: error
          retention-days: 90

  hourly-campaign:
    needs: concurrent-smoke
    if: inputs.phase == 'hourly' || contains(github.event.head_commit.message, '[four-lane-hourly]')
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Supervisor, accounting and cross-process capacity regressions
        run: |
          mkdir -p certification-gates
          set -o pipefail
          python -m unittest discover -s certification/tests -v 2>&1 | tee certification-gates/supervisor-tests.log
      - name: Create isolated exact-source worktrees
        run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/four-lane-worktrees"
      - name: Full deterministic lane suites and resource gates
        run: python -m certification.run verify --worktrees "$RUNNER_TEMP/four-lane-worktrees" --output certification-gates
      - name: Verify current heads and absence of competing market jobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m certification.guard --wait-seconds 3600
      - name: Restore exact smoke readiness
        env:
          SMOKE_READINESS: ${{ needs.concurrent-smoke.outputs.readiness }}
        run: python -c 'import os,pathlib,json; value=json.loads(os.environ["SMOKE_READINESS"]); pathlib.Path("smoke-readiness.json").write_text(json.dumps(value))'
      - name: Bounded existing-endpoint read-only capability probes
        env:
          MM_ROBINHOOD_READ_RPC_URL: ${{ secrets.MM_ROBINHOOD_READ_RPC_URL }}
          MM_ROBINHOOD_DLMM_RPC_URL: ${{ secrets.MM_ROBINHOOD_DLMM_RPC_URL }}
        run: python -m certification.capabilities --worktrees "$RUNNER_TEMP/four-lane-worktrees" --output certification-gates/rpc-capabilities.json
      - name: One-hour continuous paper campaign, no process restart
        env:
          GH_CHECKS_TOKEN: ${{ github.token }}
          MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
          MM_ROBINHOOD_READ_RPC_URL: ${{ secrets.MM_ROBINHOOD_READ_RPC_URL }}
          MM_ROBINHOOD_DISCOVERY_RPC_URL: ${{ secrets.MM_ROBINHOOD_DISCOVERY_RPC_URL }}
          MM_ROBINHOOD_DLMM_RPC_URL: ${{ secrets.MM_ROBINHOOD_DLMM_RPC_URL }}
          MM_ROBINHOOD_RAMSES_COSTS_BY_POOL_JSON: ${{ secrets.MM_ROBINHOOD_RAMSES_COSTS_BY_POOL_JSON }}
          MM_ROBINHOOD_RAMSES_SIGNALS_BY_POOL_JSON: ${{ secrets.MM_ROBINHOOD_RAMSES_SIGNALS_BY_POOL_JSON }}
        run: python -m certification.live_status --output certification-hourly --phase hourly -- python -m certification.run run --worktrees "$RUNNER_TEMP/four-lane-worktrees" --output certification-hourly --gate certification-gates/deterministic.json --phase hourly --seconds 3600 --smoke-result smoke-readiness.json
      - name: Preserve hourly native ledgers including per-asset Ramses books
        if: always()
        run: python -m certification.archive_native --worktrees "$RUNNER_TEMP/four-lane-worktrees" --output certification-native/hourly
      - name: Preserve hourly success or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: four-lane-hourly-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            certification-*-publisher.jsonl
            certification-gates/
            certification-hourly/
            certification-native/
            certification-preflight.json
            certification-contention-history.jsonl
            smoke-readiness.json
          if-no-files-found: error
          retention-days: 90
