name: POE recorded RPC binding validation only
on:
  push:
    branches: [poe-provider-presence-20261027]
    paths: [.github/workflows/poe-provider-presence.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-recorded-provider-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate provider host without returning URL or key
        env:
          POE_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
        run: |
          python3 -I - <<'PY'
          import json,os,urllib.parse
          value=os.environ.get("POE_READ_RPC_URL","")
          result={"project":"pump-opportunity-engine","credentialBound":bool(value),"scope":"repository","binding":"MM_SOLANA_READ_RPC_URL","providerRequests":0,"credentialValuesExported":False,"credentialStoredOutsideJob":False,"deployment":False}
          try:
              url=urllib.parse.urlsplit(value)
              approved=url.hostname=="solana-mainnet.g.alchemy.com"
              result.update({"recognizedProvider":"Alchemy Solana mainnet" if approved else None,"recognizedPublicHost":url.hostname if approved else None,"https":url.scheme=="https","embeddedUserInfoAbsent":url.username is None and url.password is None,"pathCarriesAppKey":approved and url.path.startswith("/v2/") and len(url.path)>4,"providerAuthenticationVerified":False,"freeQuotaVerified":False})
          except Exception:
              result.update({"recognizedProvider":None,"formatValid":False,"providerAuthenticationVerified":False,"freeQuotaVerified":False})
          print(json.dumps(result,sort_keys=True))
          PY
