name: evidence-reconstruction-certification
on:
  push:
    branches: [repair/evidence-reconstruction-20260924]
permissions:
  contents: read
  actions: read
concurrency:
  group: evidence-reconstruction-exact-certificate
  cancel-in-progress: false
jobs:
  certify:
    if: contains(github.event.head_commit.message, '[evidence-reconstruction-cert]') && contains(github.event.head_commit.message, '[non-market-cert]')
    uses: ./.github/workflows/non-market-certification.yml
    secrets: inherit
# Certification has no market dispatch, workflow_run successor, or recovery job.
