name: robinhood-alchemy-edge-sample
on:
  push:
    branches: [diag/robinhood-alchemy-edge-sample-20260923]
permissions:
  contents: read
jobs:
  sample:
    strategy:
      fail-fast: false
      matrix:
        sample: [1,2,3,4]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Single secret-safe edge sample
        env:
          MM_ROBINHOOD_READ_RPC_URL: ${{ secrets.MM_ROBINHOOD_READ_RPC_URL }}
          SAMPLE_ID: ${{ matrix.sample }}
        run: |
          python - <<'PY'
          import hashlib,json,os,socket,time
          from urllib.parse import urlsplit
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          url=os.environ["MM_ROBINHOOD_READ_RPC_URL"]
          p=urlsplit(url)
          try:
              ips=sorted({x[4][0] for x in socket.getaddrinfo(p.hostname,443,type=socket.SOCK_STREAM)})
          except Exception as exc:
              ips=["dns_error:"+type(exc).__name__]
          body=json.dumps({"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}).encode()
          req=Request(url,data=body,headers={
              "Content-Type":"application/json",
              "Accept":"application/json",
              "User-Agent":"meme-machine-edge-sample/1",
          })
          started=time.monotonic()
          row={
              "sample":int(os.environ["SAMPLE_ID"]),
              "endpoint_identity":hashlib.sha256(("4663:"+url).encode()).hexdigest(),
              "hostname":p.hostname,
              "resolved_ips":ips,
          }
          try:
              with urlopen(req,timeout=5) as resp:
                  raw=resp.read(4096);row["http_status"]=resp.status;headers=resp.headers
          except HTTPError as exc:
              raw=exc.read(4096);row["http_status"]=exc.code;headers=exc.headers
          except (URLError,TimeoutError,OSError) as exc:
              row["transport_error"]=type(exc).__name__;raw=b"";headers={}
          row["latency_seconds"]=time.monotonic()-started
          row["server"]=headers.get("Server") if headers else None
          row["x_alchemy_trace_id"]=headers.get("X-Alchemy-Trace-Id") if headers else None
          row["body_bytes"]=len(raw)
          try:
              obj=json.loads(raw)
              row["chain_id_result"]=obj.get("result") if isinstance(obj,dict) else None
              if isinstance(obj,dict) and isinstance(obj.get("error"),dict):
                  row["rpc_error_code"]=obj["error"].get("code")
                  row["rpc_error_message"]=str(obj["error"].get("message",""))[:160]
          except Exception:
              pass
          print(json.dumps(row,sort_keys=True))
          PY
