name: ramses-final-candidate-profile
on:
  push:
    branches: [research/ramses-strategy-finalization-v2]
permissions:
  actions: read
  contents: read
jobs:
  profile:
    if: contains(github.event.head_commit.message, '[ramses-profile-candidates]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Download indexed history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          aid="$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name | startswith("ramses-historical-index-")) and (.name | contains("summary") | not) and (.name | contains("probe") | not) and (.size_in_bytes > 1000000)) | [.created_at, (.id|tostring)] | @tsv' | sort -r | head -1 | cut -f2)"
          gh api "repos/${{ github.repository }}/actions/artifacts/$aid/zip" > /tmp/index.zip
          unzip -p /tmp/index.zip ramses-historical-index-data.json.gz > ramses-historical-index-data.json.gz
      - run: python -m robinhood_research.ramses_final_candidate_profile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ramses-final-candidate-profile-${{ github.run_id }}
          path: ramses-final-candidate-profile.json
