name: frozen-campaign-artifact-review
on:
  push:
    branches: [repair/frozen-campaign-handoff]
permissions:
  contents: read
  actions: read
jobs:
  review:
    if: contains(github.event.head_commit.message, '[artifact-review]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Wait only for this exact hourly artifact to finish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          base='https://api.github.com/repos/levonmendall/The-Meme-Machine/actions/runs/35578433187'
          headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'}
          def read(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as response:return json.load(response)
          deadline=time.monotonic()+1500
          while time.monotonic()<deadline:
              run=read(base)
              if run['head_sha']!='7427d71b685d9a273732b65265a34e49d4f8bbd5':raise SystemExit('sha_mismatch')
              rows=read(base+'/artifacts')['artifacts']
              if any(a['name'].startswith('four-lane-hourly-') and not a['expired'] for a in rows):
                  print('Exact hourly artifact finalized; read-only review begins.');break
              if run['status']=='completed':raise SystemExit('completed_without_hourly_artifact')
              time.sleep(5)
          else:raise SystemExit('hourly_artifact_wait_expired')
          PY
      - name: Review exact hourly artifact without provider access
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_RUN_ID: "35578433187"
          REVIEW_SHA: 7427d71b685d9a273732b65265a34e49d4f8bbd5
          REVIEW_PHASE: hourly
        run: python certification/inspect_ramses_dynamic_events.py
      - name: Preserve complete review and verified artifact metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frozen-campaign-review-${{ github.run_id }}
          path: frozen-review/
          if-no-files-found: error
          retention-days: 90

  finalize-failed-check:
    if: contains(github.event.head_commit.message, '[record-failed-check]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - name: Finalize only the retained failed c4572 hourly check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib,urllib.request
          base='https://api.github.com/repos/levonmendall/The-Meme-Machine'
          headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          def api(path,body=None):
              request=urllib.request.Request(base+path,headers=headers,data=None if body is None else json.dumps(body).encode(),method='GET' if body is None else 'PATCH')
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          run=api('/actions/runs/35563114670')
          check=api('/check-runs/106224946839')
          if run['head_sha']!='c4572e18d078222fe05d6df9eec55d62dfc59f41' or run['status']!='completed' or run['conclusion']!='cancelled':
              raise SystemExit('failed_run_identity_mismatch')
          if check['head_sha']!=run['head_sha'] or check['name']!='four-lane-live-hourly' or check['external_id']!='35563114670:1:hourly':
              raise SystemExit('failed_check_identity_mismatch')
          audit={'run_id':run['id'],'sha':run['head_sha'],'before':check,'hourly_artifact_missing':True}
          pathlib.Path('failed-check-audit.json').write_text(json.dumps(audit,indent=2))
          if check['status']!='completed':
              output=check['output']
              body={'status':'completed','conclusion':'failure','completed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    'output':{'title':'FAILED: early Pons exit, unresolved exposure, hourly archive unavailable',
                      'summary':'Engineering certification failed before cancellation. Pons exited after1369.46s with1 unresolved position. The hourly artifact upload failed during SQLite sidecar ZIP creation; full raw replay evidence is unavailable. The JSON below is the retained PRE-CANCELLATION snapshot, not a terminal measurement. Complete cancellation audit and evidence-gap handoff: https://github.com/levonmendall/The-Meme-Machine/blob/repair/frozen-campaign-handoff/certification/AUTONOMOUS_CAMPAIGN_HANDOFF.md',
                      'text':output.get('text','')}}
              updated=api('/check-runs/106224946839',body)
              audit['after_status']=updated['status'];audit['after_conclusion']=updated['conclusion']
              pathlib.Path('failed-check-audit.json').write_text(json.dumps(audit,indent=2))
          print(json.dumps({k:v for k,v in audit.items() if k!='before'}))
          PY
      - name: Preserve prior check state and failure correction
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: failed-check-audit-${{ github.run_id }}
          path: failed-check-audit.json
          retention-days: 90

  finalize-7427-failed-check:
    if: contains(github.event.head_commit.message, '[record-hourly-failure]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - name: Mark only the preserved 7427 hour as failed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib,urllib.request
          base='https://api.github.com/repos/levonmendall/The-Meme-Machine'
          headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          def api(path,body=None):
              req=urllib.request.Request(base+path,headers=headers,data=None if body is None else json.dumps(body).encode(),method='GET' if body is None else 'PATCH')
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          run=api('/actions/runs/35578433187');check=api('/check-runs/106274851741')
          sha='7427d71b685d9a273732b65265a34e49d4f8bbd5'
          if run['head_sha']!=sha or run['status']!='completed' or run['conclusion']!='cancelled':raise SystemExit('failed_run_identity_mismatch')
          if check['head_sha']!=sha or check['name']!='four-lane-live-hourly' or check['external_id']!='35578433187:1:hourly':raise SystemExit('failed_check_identity_mismatch')
          artifact=api('/actions/artifacts/10632897444')
          if artifact['workflow_run']['head_sha']!=sha or artifact['digest']!='sha256:be3e70c5fae7a90cbfac6070bd04d99f655e0f35a23ff409fc80179ee7b4c1cd':raise SystemExit('failed_artifact_identity_mismatch')
          audit={'run_id':run['id'],'sha':sha,'before':check,'artifact':artifact}
          path=pathlib.Path('failed-7427-check-audit.json');path.write_text(json.dumps(audit,indent=2))
          if check['status']!='completed':
              result=api('/check-runs/106274851741',dict(status='completed',conclusion='failure',completed_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  output=dict(title='FAILED: Ramses decoder exit before 3600 seconds; full artifact preserved',
                    summary='Ramses exited with event_dynamic_capacity after3213.884026284s. Pons and Meteora completed normally; the remaining flat Pump follow-up was stopped only after an audited fresh-book guard. Full hourly artifact10632897444 and native replay evidence are preserved. The JSON below is the retained PRE-CANCELLATION checkpoint, not a successful terminal certification. See certification/AUTONOMOUS_CAMPAIGN_HANDOFF.md on repair/frozen-campaign-handoff.',
                    text=check['output'].get('text',''))))
              audit.update(after_status=result['status'],after_conclusion=result['conclusion'])
          elif check['conclusion']!='failure':raise SystemExit('unexpected_completed_conclusion')
          path.write_text(json.dumps(audit,indent=2))
          print(json.dumps({'run':run['id'],'sha':sha,'status':'completed','conclusion':'failure','artifact':artifact['id']}))
          PY
      - name: Preserve prior check and exact failed artifact identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: failed-7427-check-audit-${{ github.run_id }}
          path: failed-7427-check-audit.json
          retention-days: 90
