name: frozen-campaign-artifact-review
on:
  push:
    branches: [repair/frozen-campaign-handoff]
permissions:
  contents: read
  actions: read
jobs:
  review:
    if: contains(github.event.head_commit.message, '[artifact-review]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Wait only for this exact smoke artifact to finish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          base='https://api.github.com/repos/levonmendall/The-Meme-Machine/actions/runs/35600287474'
          headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'}
          def read(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as response:return json.load(response)
          deadline=time.monotonic()+1500
          while time.monotonic()<deadline:
              run=read(base)
              if run['head_sha']!='e552c288e6dd6c9028819cc4883890303dbf9524':raise SystemExit('sha_mismatch')
              rows=read(base+'/artifacts')['artifacts']
              if any(a['name'].startswith('four-lane-certification-') and not a['expired'] for a in rows):
                  print('Exact smoke artifact finalized; read-only review begins.');break
              if run['status']=='completed':raise SystemExit('completed_without_smoke_artifact')
              time.sleep(5)
          else:raise SystemExit('smoke_artifact_wait_expired')
          PY
      - name: Audit exact replacement hour without provider access
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_RUN_ID: "35600287474"
          REVIEW_SHA: e552c288e6dd6c9028819cc4883890303dbf9524
          REVIEW_PHASE: smoke
        run: python certification/inspect_stable_artifact.py
      - name: Preserve complete review and verified artifact metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frozen-campaign-review-${{ github.run_id }}
          path: frozen-review/
          if-no-files-found: error
          retention-days: 90
