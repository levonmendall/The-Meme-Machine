name: fomoapi-live-probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/fomoapi-key-validation

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[fomoapi-probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FOMOAPI_KEY: ${{ secrets.FOMOAPI_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Read-only FomoAPI board and historical-parameter validation
        run: python -m tests.fomoapi_live_probe | tee fomoapi-live-probe.log
      - name: Preserve sanitized validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fomoapi-live-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fomoapi-probe-report.json
            fomoapi-live-probe.log
          if-no-files-found: warn
          retention-days: 7
