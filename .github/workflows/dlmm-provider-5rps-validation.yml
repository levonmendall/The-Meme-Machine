name: dlmm-provider-5rps-validation
on:
  push:
    branches:
      - research/dlmm-top-roi-wallet-evaluation
permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[dlmm-provider-5rps-validate]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MM_SOLANA_READ_RPC_URL: ${{ secrets.MM_SOLANA_READ_RPC_URL }}
    concurrency:
      group: dlmm-provider-5rps-validation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Provider topology regression gate
        run: python -m unittest tests.test_dlmm_alchemy_provider -v
      - name: Live five-read DLMM provider validation
        run: python -m tests.dlmm_provider_5rps_live
      - name: Preserve provider validation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dlmm-provider-5rps-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: dlmm-provider-5rps-validation.json
          if-no-files-found: warn
          retention-days: 30
