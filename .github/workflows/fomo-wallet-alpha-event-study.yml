name: fomo-wallet-alpha-event-study
on:
  push:
    branches: [research/fomo-wallet-alpha-event-study]
permissions: {contents: read}
jobs:
  study:
    if: contains(github.event.head_commit.message, '[wallet-alpha-study]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FOMOAPI_KEY: ${{ secrets.FOMOAPI_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - run: python -m pip install --disable-pip-version-check requests zstandard
      - name: Run successful-wallet Pump-native alpha event study
        run: set -o pipefail; python -m tests.fomo_wallet_alpha_event_study | tee fomo-wallet-alpha-event-study.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fomo-wallet-alpha-event-study-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fomo-wallet-alpha-event-study.json
            fomo-wallet-alpha-event-study.log
          if-no-files-found: warn
          retention-days: 30
