name: coverage-repair-certification
on:
  push:
    branches: [repair/target-market-coverage-20260924]
permissions:
  contents: write
  actions: write
  checks: write
concurrency:
  group: coverage-repair-final-candidate
  cancel-in-progress: false
jobs:
  certify:
    if: contains(github.event.head_commit.message, '[coverage-repair-cert]')
    uses: ./.github/workflows/non-market-certification.yml
    secrets: inherit
  preserve-replay-launch:
    needs: certify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Prepare final exact-source replay trees
        run: python -m certification.run prepare --worktrees "$RUNNER_TEMP/coverage-replay-lanes"
      - name: Reprocess preserved evidence once with final acquisition logic
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m certification.coverage_replay --worktrees "$RUNNER_TEMP/coverage-replay-lanes" --output coverage-handoff/historical-replay
      - name: Verify predecessor remains censored and every native book is flat
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m certification.coverage_successor --replay coverage-handoff/historical-replay/result.json --output coverage-handoff/preservation-gate.json
      - name: Launch clean exact-certified successor under durable automation
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python -m certification.prospective_program start --run-id "$GITHUB_RUN_ID" --output coverage-handoff/successor-state.json
      - name: Preserve replay and launch receipts on success failure or cancellation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-repair-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage-handoff/*.json
            coverage-handoff/historical-replay/*.json
          if-no-files-found: warn
          retention-days: 90
