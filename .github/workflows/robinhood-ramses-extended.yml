name: robinhood-ramses-extended-test
on:
  push:
    branches: [feat/robinhood-research-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extended-market-test:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[robinhood-ramses-extended-test]')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    concurrency:
      group: meme-machine-robinhood-ramses-extended
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Run extended natural Fee Pulse discovery and machinery proof
        env:
          MM_ROBINHOOD_READ_RPC_URL: ${{ secrets.MM_ROBINHOOD_READ_RPC_URL }}
          MM_ROBINHOOD_DLMM_RPC_URL: ${{ secrets.MM_ROBINHOOD_DLMM_RPC_URL }}
          MM_ROBINHOOD_RAMSES_COSTS_BY_POOL_JSON: ${{ secrets.MM_ROBINHOOD_RAMSES_COSTS_BY_POOL_JSON }}
          MM_ROBINHOOD_RAMSES_SIGNALS_BY_POOL_JSON: ${{ secrets.MM_ROBINHOOD_RAMSES_SIGNALS_BY_POOL_JSON }}
          MM_ROBINHOOD_RAMSES_EXTENDED_DISCOVERY_SECONDS: "1200"
          MM_ROBINHOOD_RAMSES_EXTENDED_INTERVAL_SECONDS: "60"
        run: python -m robinhood_research.ramses_extended_test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: robinhood-ramses-extended-${{ github.sha }}-${{ github.run_id }}
          path: |
            robinhood-ramses-extended-market-report.json
            robinhood-ramses-extended-market.sqlite
            robinhood-ramses-all-pool-inventory-cache.json
          retention-days: 30
          if-no-files-found: error
