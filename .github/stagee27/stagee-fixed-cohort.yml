name: Exact-candidate fixed Phase E prerequisite cohort
on:
  push:
    branches: [repair/stagee27-archive-ready-allocation-20260928]
    paths: ['.github/stagee27/cohort-request.json']
  workflow_dispatch:
    inputs:
      expected_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: stagee-fixed-prerequisite-cohort
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Bind exact candidate, first attempt, reviewed publication and frozen plan
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/preflight"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          request=json.loads(Path('.github/stagee27/cohort-request.json').read_text())
          git=lambda *args:subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')==request['expected_parent']
          assert set(git('diff','--name-only','HEAD^','HEAD').splitlines())==set(request['reviewed_files'])
          assert hashlib.sha256(Path('certification/stagee24_qualification_plan.json').read_bytes()).hexdigest()==request['plan_sha256']
          assert request['paper_only'] is True and request['market_authority'] is False
          row=dict(sha=git('rev-parse','HEAD'),tree=git('rev-parse','HEAD^{tree}'),parent=git('rev-parse','HEAD^'),request=request)
          (Path(os.environ['RUNNER_TEMP'])/'preflight'/'identity.json').write_text(json.dumps(row,indent=2)+'\n')
          PY
          git fsck --full --no-reflogs > "$RUNNER_TEMP/preflight/git-fsck.txt" 2>&1
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Frozen environment
        run: python -m certification.qualification_environment --output "$RUNNER_TEMP/preflight/environment.json"
      - name: Prepare and verify complete native build before pressure
        run: |
          set -euo pipefail
          python -m certification.run prepare --worktrees "$RUNNER_TEMP/cohort-lanes"
          python -m certification.build_consistency verify --worktrees "$RUNNER_TEMP/cohort-lanes" --expected-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/preflight/build-consistency.json"
      - name: Exact-source focused and promotion regressions
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_run381_archive_scheduling \
            tests.test_run381_maintenance_overlap \
            tests.test_run381_retention_progress \
            tests.test_retention_outcomes \
            certification.tests.test_lifecycle_capacity \
            certification.tests.test_build_consistency \
            certification.tests.test_stagee24_environment \
            certification.tests.test_dispatch_phase_e \
            certification.tests.test_stagee25_promotion \
            certification.tests.test_stagee27_cohort_wiring \
            2>&1 | tee "$RUNNER_TEMP/preflight/focused-tests.log"
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'preflight';text=(root/'focused-tests.log').read_text()
          total=re.search(r'^Ran (\d+) tests in ',text,re.M)
          assert total and re.search(r'^OK\s*$',text,re.M) and not re.search(r'\bskipped\b',text,re.I)
          assert 'test_ready_archive_receipt_finishes_slices_before_fresh_retention_grant (' in text
          (root/'focused-result.json').write_text(json.dumps(dict(sha=os.environ['GITHUB_SHA'],tests_run=int(total[1]),failures=0,errors=0,skipped=0),indent=2)+'\n')
          PY
      - name: Preserve preflight even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stagee-fixed-${{ github.sha }}-${{ github.run_id }}-preflight
          path: ${{ runner.temp }}/preflight/
          if-no-files-found: error
          retention-days: 90
  trial:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        trial: [combined-1, combined-2, combined-3, recovery-1]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Execute one unchanged fixed trial; never retry
        env:
          TRIAL: ${{ matrix.trial }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/cohort"
          python -m certification.qualification_environment --output "$RUNNER_TEMP/cohort/$TRIAL-environment.json"
          python -m certification.maintenance_qualification --trial "$TRIAL" --output "$RUNNER_TEMP/cohort/$TRIAL"
      - name: Preserve raw trial even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stagee-fixed-${{ github.sha }}-${{ github.run_id }}-${{ matrix.trial }}
          path: ${{ runner.temp }}/cohort/
          if-no-files-found: error
          retention-days: 90
  aggregate:
    needs: [preflight, trial]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Recover every raw artifact and re-evaluate the frozen cohort
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAL_JOB_RESULT: ${{ needs.trial.result }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          from certification.autonomous_control import _artifact_metadata
          from certification.autonomous_window import extract_artifact
          from certification.prospective_program import GitHub
          from certification.promote_phase_e import verify_environment
          from certification.maintenance_qualification import PLAN_PATH,frozen_inputs,qualification
          from certification import cleanup_recovery
          root=Path(os.environ['RUNNER_TEMP'])/'cohort';root.mkdir()
          api=GitHub();sha=os.environ['GITHUB_SHA'];run_id=int(os.environ['GITHUB_RUN_ID'])
          plan=json.loads(PLAN_PATH.read_text());bindings={};recovery_errors=[]
          assert frozen_inputs()
          for part in ['preflight',*plan['trials']]:
              name=f'stagee-fixed-{sha}-{run_id}-{part}'
              try:
                  reference=_artifact_metadata(api,run_id,name)
                  folder=extract_artifact(api,reference,root/part)
                  bindings[part]=reference
                  env=folder/('environment.json' if part=='preflight' else part+'-environment.json')
                  verify_environment(json.loads(env.read_text()))
                  if part=='preflight':shutil.copy2(env,root/'environment.json')
              except (OSError,ValueError,KeyError) as exc:
                  recovery_errors.append(dict(part=part,error=str(exc)))
          (root/'source-artifact-bindings.json').write_text(json.dumps(bindings,indent=2)+'\n')
          (root/'artifact-recovery-errors.json').write_text(json.dumps(recovery_errors,indent=2)+'\n')
          with qualification():result=cleanup_recovery.aggregate(root,sha)
          (root/'aggregate.json').write_text(json.dumps(result,indent=2)+'\n')
          sums={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          (root/'SHA256.json').write_text(json.dumps(sums,indent=2)+'\n')
          print(json.dumps(result,sort_keys=True),flush=True)
          assert not recovery_errors and result['passed'] and os.environ['TRIAL_JOB_RESULT']=='success',result
          PY
      - name: Preserve complete raw cohort and computed acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stagee-fixed-cohort-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cohort/
          if-no-files-found: error
          retention-days: 90
